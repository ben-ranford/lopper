name: memory-profiles

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MEM_PROFILE_STAMP: github-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Capture watched package memory profiles
        run: make mem-profiles

      - name: Publish profiling summary
        run: cat ".artifacts/memory-profiles/${MEM_PROFILE_STAMP}/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload profiling artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: memory-profiles-${{ github.run_number }}
          path: .artifacts/memory-profiles/${{ env.MEM_PROFILE_STAMP }}
          if-no-files-found: error
          retention-days: 30
