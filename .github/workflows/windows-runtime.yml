name: windows runtime

on:
  workflow_dispatch:
    inputs:
      historical_marker_diagnostic:
        description: Run the bounded isolated original issue1604 fixture investigation
        type: boolean
        required: false
        default: false
      preflight_termination_diagnostic:
        description: Run bounded Git Bash process cleanup proof for exact repaired source
        type: boolean
        required: false
        default: false
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  runtime-cancellation:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Test Windows runtime cancellation
        shell: pwsh
        run: go test ./internal/runtime -run '^(TestStartCommandConfiguresWindowsJobCancellation|TestWindowsCommandCancellationWithoutProcess|TestStartCommandCancellationTerminatesWindowsDescendant|TestWindowsJobCleanupWaitsForDescendants|TestWindowsJobCleanupIsConcurrentAndRepeatable|TestWindowsJobRepeatedStartPreservesCommand|TestWindowsJobCancellationRacesCleanup|TestWindowsJobPreCanceledStartReleasesCommand)$' -v -count=50 -timeout 2m

  historical-marker-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.historical_marker_diagnostic
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout diagnostic assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: diagnostic-assets
      - name: Checkout exact historical tested merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 41680ca9548f72e351c8ed88e98cc946347f45d4
          persist-credentials: false
          path: historical-runtime
      - name: Setup historical Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: historical-runtime/go.mod
      - name: Run bounded original-fixture investigation
        shell: pwsh
        run: ./diagnostic-assets/.diagnostics/issue1604/run-historical.ps1
      - name: Retain all original-fixture diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue1604-historical-marker-${{ github.run_id }}-${{ github.run_attempt }}
          path: issue1604-evidence/
          if-no-files-found: error
          retention-days: 30

  preflight-termination-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.preflight_termination_diagnostic
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed diagnostic assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: diagnostic-assets
      - name: Verify and exercise native Git Bash cleanup
        shell: bash
        run: |
          set -euo pipefail
          workspace="$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          evidence="$workspace/preflight-evidence"
          mkdir -p "$evidence/scripts"
          source=0eb83fe3177e3071b199ffff2525c7bf6977d38b
          diagnostic_sha="$(git -C "$workspace/diagnostic-assets" rev-parse HEAD)"
          test "$diagnostic_sha" = "$GITHUB_SHA"
          # Read immutable Git bytes so Windows checkout line endings cannot change either asset.
          git -C "$workspace/diagnostic-assets" show HEAD:.diagnostics/preflight/hook-config-preflight.sh > "$evidence/scripts/hook-config-preflight.sh"
          git -C "$workspace/diagnostic-assets" show HEAD:.diagnostics/preflight/preflight-native-probe.sh > "$evidence/preflight-native-probe.sh"
          git -C "$workspace/diagnostic-assets" show HEAD:.diagnostics/preflight/manifest.json > "$evidence/source-manifest.json"
          git -C "$workspace/diagnostic-assets" show HEAD:.diagnostics/preflight/group-observer.sh > "$evidence/group-observer.sh"
          git -C "$workspace/diagnostic-assets" show HEAD:.diagnostics/preflight/startup-controls.sh > "$evidence/startup-controls.sh"
          helper_hash="$(sha256sum "$evidence/scripts/hook-config-preflight.sh" | cut -d ' ' -f 1)"
          probe_hash="$(sha256sum "$evidence/preflight-native-probe.sh" | cut -d ' ' -f 1)"
          test "$helper_hash" = f9381c99c6febfdaad1f8cbdb545acec097e0114ed6e4b0b81479d28b676d1f9
          test "$probe_hash" = 0f28d4d49780fdc56e20bad6d08df73f7898dcc31896ad11c479a0c6ae16894c
          manifest_hash="$(sha256sum "$evidence/source-manifest.json" | cut -d ' ' -f 1)"
          test "$manifest_hash" = 0b435e1e402e3ff500d035961928dd38e88debb9f79225e0d96b9cb345ab4a63
          observer_hash="$(sha256sum "$evidence/group-observer.sh" | cut -d ' ' -f 1)"
          test "$observer_hash" = 9b7828150c21d897e5e430ece4834cf2cfc86ed5cdf663f03fe0c52fe789c75d
          controls_hash="$(sha256sum "$evidence/startup-controls.sh" | cut -d ' ' -f 1)"
          test "$controls_hash" = 8f4969e0b1e3f40cd81ce68045aa8fc4b850fc59a27c1c02d6a79b2e1dc33da4
          helper_blob="$(git hash-object "$evidence/scripts/hook-config-preflight.sh")"
          test "$helper_blob" = e6b5e2d3dd82bf5d40f1566124afbf22d769ff13
          case "$(uname -s)" in MINGW*|MSYS*|CYGWIN*) ;; *) echo "Native Git Bash required" >&2; exit 1 ;; esac
          set +e
          LOPPER_PREFLIGHT_PROBE_EVIDENCE="$evidence/cases" bash "$evidence/preflight-native-probe.sh" "$evidence/scripts/hook-config-preflight.sh" "$evidence/group-observer.sh" 2>&1 | tee "$evidence/probe.log"
          probe_status=${PIPESTATUS[0]}
          bash "$evidence/startup-controls.sh" "$evidence/scripts/hook-config-preflight.sh" "$evidence/group-observer.sh" "$evidence/startup" 2>&1 | tee "$evidence/startup.log"
          startup_status=${PIPESTATUS[0]}
          set -e
          overall_status=$probe_status
          if [ "$startup_status" -ne 0 ]; then overall_status=$startup_status; fi
          printf '{"source_sha":"%s","diagnostic_sha":"%s","helper_sha256":"%s","probe_sha256":"%s","group_observer_sha256":"%s","startup_controls_sha256":"%s","exit_code":%s,"main_exit_code":%s,"startup_exit_code":%s}\n' "$source" "$diagnostic_sha" "$helper_hash" "$probe_hash" "$observer_hash" "$controls_hash" "$overall_status" "$probe_status" "$startup_status" > "$evidence/result.json"
          exit "$overall_status"
      - name: Retain supplemental preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: preflight-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: preflight-evidence/
          if-no-files-found: error
          retention-days: 30
