name: ci-tests

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      build_channel:
        required: true
        type: string

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact CI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        if: ${{ !env.ACT }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            Makefile
            .github/workflows/ci-tests.yml

      - name: Setup test runtimes (act)
        if: ${{ env.ACT }}
        run: |
          if ! command -v go >/dev/null 2>&1 || ! command -v ruby >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1; then
            apt-get update
            apt-get install -y golang-go ruby python3
          fi
          if ! command -v node >/dev/null 2>&1 || ! node -e 'const [major, minor] = process.versions.node.split(".").map(Number); process.exit(major > 22 || (major === 22 && minor >= 12) ? 0 : 1)'; then
            apt-get update
            apt-get install -y ca-certificates curl gnupg
            mkdir -p /usr/share/keyrings
            curl -fsSL --proto '=https' --tlsv1.2 https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
            echo "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
            apt-get update
            apt-get install -y nodejs
          fi

      - name: Run normal and leak tests
        id: ordinary_tests
        env:
          BUILD_CHANNEL: ${{ inputs.build_channel }}
        run: make ci-tests BUILD_CHANNEL="${BUILD_CHANNEL}"

      # make stops at a failing prerequisite; inspect its workspace even then.
      - name: Check runtime artifacts after tests
        if: ${{ always() }}
        run: make runtime-pycache-check

      - name: Capture bounded native hook interruption evidence
        id: native_trace
        if: ${{ always() && !cancelled() && inputs.build_channel == 'dev' && github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize') && github.run_attempt == 1 }}
        env:
          TRACE_SOURCE_SHA: ${{ inputs.source_sha }}
          TRACE_BUILD_CHANNEL: ${{ inputs.build_channel }}
          TRACE_ORDINARY_OUTCOME: ${{ steps.ordinary_tests.outcome }}
          TRACE_DRIVER_SHA256: 023eac2b864db169d2b3fb0ed951a9a35ea432ee96efe9839f797a583cfde90c
        run: /usr/bin/python3 -I -S "${GITHUB_WORKSPACE}/scripts/trace-hook-interruption.py" run

      - name: Upload bounded native hook interruption evidence
        if: ${{ always() && inputs.build_channel == 'dev' && github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize') && github.run_attempt == 1 && contains(fromJSON('["success","failure","cancelled"]'), steps.native_trace.outcome) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/main.json
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/main.json.tmp
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/manifest.json
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/manifest.json.tmp
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/preflight.log
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/preflight.log.tmp
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/exit0.trace
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/exit0.receipt.json
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/exit0.receipt.json.tmp
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/exit23.trace
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/exit23.receipt.json
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/exit23.receipt.json.tmp
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/signal.trace
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/signal.receipt.json
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/signal.receipt.json.tmp
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/groups.trace
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/groups.receipt.json
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/groups.receipt.json.tmp
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/cap.trace
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/cap.receipt.json
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/cap.receipt.json.tmp
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/write-error.trace
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/write-error.receipt.json
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/write-error.receipt.json.tmp
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/missing.trace
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/missing.receipt.json
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/missing.receipt.json.tmp
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/abnormal.trace
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/abnormal.receipt.json
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/abnormal.receipt.json.tmp
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/cancel.trace
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/cancel.receipt.json
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/cancel.receipt.json.tmp
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/focused.trace
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/focused.receipt.json
            ${{ runner.temp }}/hook-native-${{ github.run_id }}-${{ github.job }}-${{ github.run_attempt }}/focused.receipt.json.tmp
