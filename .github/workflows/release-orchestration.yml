name: release-orchestration

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false
    inputs:
      tag:
        required: true
        type: string
      source_sha:
        required: false
        type: string
        default: ''
      memory_approved:
        required: false
        type: boolean
        default: false
      artifact_prefix:
        required: true
        type: string
      image_tags:
        required: true
        type: string
      build_channel:
        required: true
        type: string

# Jobs declare their own token permissions. Keep this default empty so a
# new job cannot inherit a broader repository token.
permissions: {}

jobs:
  verify-publication-source:
    permissions:
      contents: read
    uses: ./.github/workflows/release-source-ci.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
      build_channel: ${{ inputs.build_channel }}
      memory_approved: ${{ inputs.memory_approved }}

  validate-publication-identifiers:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate publication channel and identifiers
        env:
          BUILD_CHANNEL: ${{ inputs.build_channel }}
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE_TAGS: ${{ inputs.image_tags }}
        shell: bash
        run: |
          set -euo pipefail
          case "$BUILD_CHANNEL" in
            release) ;;
            rolling)
              [[ "$RELEASE_TAG" =~ ^rolling-[0-9]{14}-[0-9a-f]{7}$ ]] || exit 1
              while IFS= read -r tag; do
                [[ -z "$tag" || "$tag" == rolling || "$tag" == "$RELEASE_TAG" ]] || exit 1
              done <<< "$IMAGE_TAGS"
              ;;
            *) exit 1 ;;
          esac

  build-linux-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Compute build metadata
        id: build_meta
        run: |
          echo "commit=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2

      - name: Install shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: Resolve gosec version
        id: gosec_version
        run: echo "value=$(make --silent print-gosec-version)" >> "$GITHUB_OUTPUT"

      - name: Install Go tooling
        env:
          GOSEC_VERSION: ${{ steps.gosec_version.outputs.value }}
        run: |
          make tools-install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Reset Linux/Windows artifact staging
        env:
          PATH: /usr/bin:/bin
        shell: /usr/bin/env -u BASH_ENV -u ENV -u PROMPT_COMMAND -u PS4 -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          rm -rf -- dist
          mkdir dist

      - name: Build Linux/Windows release artifacts
        env:
          TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ steps.build_meta.outputs.commit }}
          BUILD_DATE: ${{ steps.build_meta.outputs.build_date }}
          BUILD_CHANNEL: ${{ inputs.build_channel }}
        run: |
          make release \
            VERSION="$TAG" \
            GIT_COMMIT="$COMMIT_SHA" \
            BUILD_DATE="$BUILD_DATE" \
            RELEASE_BUILD_CHANNEL="$BUILD_CHANNEL" \
            PLATFORMS="linux/amd64 linux/arm64 windows/amd64 windows/arm64"

      - name: Validate Linux/Windows release artifacts
        env:
          PATH: /usr/bin:/bin
          RELEASE_TAG: ${{ inputs.tag }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u PROMPT_COMMAND -u PS4 -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          expected=(
            "dist/lopper_${RELEASE_TAG}_linux_amd64.tar.gz"
            "dist/lopper_${RELEASE_TAG}_linux_arm64.tar.gz"
            "dist/lopper_${RELEASE_TAG}_windows_amd64.zip"
            "dist/lopper_${RELEASE_TAG}_windows_arm64.zip"
          )
          if find -P dist -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "Linux/Windows artifact staging contains a non-regular entry" >&2
            exit 1
          fi
          file_count="$(find -P dist -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [ "${file_count}" -ne "${#expected[@]}" ]; then
            echo "Linux/Windows artifact staging contains an unexpected file count" >&2
            exit 1
          fi
          for artifact in "${expected[@]}"; do
            if [ ! -f "${artifact}" ] || [ -L "${artifact}" ]; then
              echo "Expected Linux/Windows artifact ${artifact} is missing or not a regular file" >&2
              exit 1
            fi
            if [ ! -s "${artifact}" ]; then
              echo "Expected Linux/Windows artifact ${artifact} is empty" >&2
              exit 1
            fi
          done

      - name: Upload Linux/Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_prefix }}-linux-windows
          path: |
            dist/lopper_${{ inputs.tag }}_linux_amd64.tar.gz
            dist/lopper_${{ inputs.tag }}_linux_arm64.tar.gz
            dist/lopper_${{ inputs.tag }}_windows_amd64.zip
            dist/lopper_${{ inputs.tag }}_windows_arm64.zip
          if-no-files-found: error

  build-darwin:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Compute build metadata
        id: build_meta
        run: |
          echo "commit=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod

      - name: Assert Darwin arm64 host
        shell: bash
        run: |
          set -euo pipefail
          host_goarch="$(go env GOARCH)"
          if [ "${host_goarch}" != "arm64" ]; then
            echo "::error::Expected darwin/arm64 runner, got darwin/${host_goarch}."
            exit 1
          fi

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Resolve gosec version
        id: gosec_version
        run: echo "value=$(make --silent print-gosec-version)" >> "$GITHUB_OUTPUT"

      - name: Install Go tooling
        env:
          GOSEC_VERSION: ${{ steps.gosec_version.outputs.value }}
        run: |
          make tools-install
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Reset Darwin arm64 artifact staging
        env:
          PATH: /usr/bin:/bin
        shell: /usr/bin/env -u BASH_ENV -u ENV -u PROMPT_COMMAND -u PS4 -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          rm -rf -- dist
          mkdir dist

      - name: Build Darwin release artifact
        env:
          TAG: ${{ inputs.tag }}
          COMMIT_SHA: ${{ steps.build_meta.outputs.commit }}
          BUILD_DATE: ${{ steps.build_meta.outputs.build_date }}
          BUILD_CHANNEL: ${{ inputs.build_channel }}
        run: |
          host_goarch="$(go env GOARCH)"
          make release \
            VERSION="$TAG" \
            GIT_COMMIT="$COMMIT_SHA" \
            BUILD_DATE="$BUILD_DATE" \
            RELEASE_BUILD_CHANNEL="$BUILD_CHANNEL" \
            PLATFORMS="darwin/${host_goarch}"

      - name: Validate Darwin arm64 release artifact
        env:
          PATH: /usr/bin:/bin
          RELEASE_TAG: ${{ inputs.tag }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u PROMPT_COMMAND -u PS4 -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          expected=("dist/lopper_${RELEASE_TAG}_darwin_arm64.tar.gz")
          if find -P dist -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "Darwin arm64 artifact staging contains a non-regular entry" >&2
            exit 1
          fi
          file_count="$(find -P dist -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d '[:space:]')"
          if [ "${file_count}" -ne "${#expected[@]}" ]; then
            echo "Darwin arm64 artifact staging contains an unexpected file count" >&2
            exit 1
          fi
          for artifact in "${expected[@]}"; do
            if [ ! -f "${artifact}" ] || [ -L "${artifact}" ]; then
              echo "Expected Darwin arm64 artifact ${artifact} is missing or not a regular file" >&2
              exit 1
            fi
            if [ ! -s "${artifact}" ]; then
              echo "Expected Darwin arm64 artifact ${artifact} is empty" >&2
              exit 1
            fi
          done

      - name: Upload Darwin artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.artifact_prefix }}-darwin
          path: dist/lopper_${{ inputs.tag }}_darwin_arm64.tar.gz
          if-no-files-found: error

  prepare-ghcr:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false

      - name: Compute image metadata
        id: image_meta
        run: |
          echo "commit=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Compute image name
        id: image
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/lopper" >> "$GITHUB_OUTPUT"

      - name: Compute image tags
        id: image_tags
        shell: bash
        env:
          IMAGE_TAGS: ${{ inputs.image_tags }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_ARCH_SUFFIX: -${{ matrix.architecture }}
        run: |
          set -euo pipefail
          bash scripts/release-image-tags.sh > image-tags.txt
          {
            echo 'tags<<EOF'
            cat image-tags.txt
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build OCI publication payload
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            VERSION=${{ inputs.tag }}
            GIT_COMMIT=${{ steps.image_meta.outputs.commit }}
            BUILD_DATE=${{ steps.image_meta.outputs.build_date }}
            BUILD_CHANNEL=${{ inputs.build_channel }}
          labels: |
            org.opencontainers.image.created=${{ steps.image_meta.outputs.build_date }}
            org.opencontainers.image.revision=${{ inputs.source_sha || github.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
          push: false
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.image_tags.outputs.tags }}
          outputs: type=oci,dest=${{ runner.temp }}/ghcr-${{ matrix.architecture }}-publication/layout,tar=false
          provenance: false
          sbom: false

      - name: Prepare publication metadata
        shell: bash
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_COMMIT: ${{ steps.image_meta.outputs.commit }}
          BUILD_DATE: ${{ steps.image_meta.outputs.build_date }}
          BUILD_CHANNEL: ${{ inputs.build_channel }}
        run: |
          set -euo pipefail
          payload_root="${RUNNER_TEMP}/ghcr-${ARCHITECTURE}-publication"
          install -m 0600 image-tags.txt "${payload_root}/image-tags.txt"
          jq -n \
            --arg source_sha "${SOURCE_SHA}" \
            --arg image_name "${IMAGE_NAME}" \
            --arg platform "${PLATFORM}" \
            --arg tag "${RELEASE_TAG}" \
            --arg build_commit "${BUILD_COMMIT}" \
            --arg build_date "${BUILD_DATE}" \
            --arg build_channel "${BUILD_CHANNEL}" \
            '{
              source_sha: $source_sha,
              image_name: $image_name,
              platform: $platform,
              tag: $tag,
              build_commit: $build_commit,
              build_date: $build_date,
              build_channel: $build_channel
            }' > "${payload_root}/publication.json"
          (
            cd "${payload_root}"
            find -P . -type f ! -path './SHA256SUMS' -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 -r sha256sum
          ) > "${payload_root}/SHA256SUMS"

      - name: Upload OCI publication payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ghcr-${{ matrix.architecture }}-publication-payload
          path: ${{ runner.temp }}/ghcr-${{ matrix.architecture }}-publication

  publish-ghcr-images:
    needs:
      - verify-publication-source
      - validate-publication-identifiers
      - build-linux-windows
      - build-darwin
      - prepare-ghcr
    outputs:
      amd64_digest: ${{ steps.publish_amd64.outputs.digest }}
      arm64_digest: ${{ steps.publish_arm64.outputs.digest }}
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      id-token: write
      packages: write
    steps:
      - name: Download amd64 OCI publication payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ghcr-amd64-publication-payload
          path: ${{ runner.temp }}/ghcr-amd64-publication

      - name: Download arm64 OCI publication payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ghcr-arm64-publication-payload
          path: ${{ runner.temp }}/ghcr-arm64-publication

      - name: Validate OCI publication payloads
        id: validate
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_BUILD_CHANNEL: ${{ inputs.build_channel }}
          EXPECTED_IMAGE_TAGS: ${{ inputs.image_tags }}
        run: |
          set -euo pipefail
          expected_source_sha="${EXPECTED_SOURCE_SHA}"
          expected_image_tags="${EXPECTED_IMAGE_TAGS}"
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          expected_image_name="ghcr.io/${owner}/lopper"

          if [[ ! "${expected_source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid immutable source SHA in OCI publication payloads."
            exit 1
          fi

          validate_payload() {
            local architecture="$1"
            local platform="$2"
            local tag_suffix="-$1"
            local payload_root="${RUNNER_TEMP}/ghcr-${architecture}-publication"
            local layout_root="${payload_root}/layout"
            local metadata_file="${payload_root}/publication.json"
            local tags_file="${payload_root}/image-tags.txt"
            local checksums_file="${payload_root}/SHA256SUMS"
            local required
            for required in \
              "${layout_root}" \
              "${layout_root}/blobs/sha256" \
              "${layout_root}/oci-layout" \
              "${layout_root}/index.json" \
              "${metadata_file}" \
              "${tags_file}" \
              "${checksums_file}"; do
              if [ ! -e "${required}" ]; then
                echo "::error::Missing ${architecture} publication payload path: ${required}."
                exit 1
              fi
            done
            if find -P "${payload_root}" ! -type d ! -type f -print -quit | grep -q .; then
              echo "::error::${architecture} publication payload must contain only regular files and directories."
              exit 1
            fi

            local file_count
            local total_bytes
            file_count="$(find -P "${payload_root}" -type f | wc -l | tr -d '[:space:]')"
            total_bytes="$(find -P "${payload_root}" -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
            if [ "${file_count}" -lt 6 ] || [ "${file_count}" -gt 256 ] || [ "${total_bytes}" -gt 536870912 ]; then
              echo "::error::${architecture} artifact payload exceeds file-count or size bounds."
              exit 1
            fi

            local payload_path
            local relative_path
            while IFS= read -r payload_path; do
              relative_path="${payload_path#"${payload_root}/"}"
              case "${relative_path}" in
                SHA256SUMS|publication.json|image-tags.txt|layout/oci-layout|layout/index.json|layout/manifest.json) ;;
                layout/blobs/sha256/*)
                  if [[ ! "${relative_path##*/}" =~ ^[0-9a-f]{64}$ ]]; then
                    echo "::error::Unexpected ${architecture} OCI blob path: ${relative_path}."
                    exit 1
                  fi
                  ;;
                *)
                  echo "::error::Unexpected ${architecture} publication payload path: ${relative_path}."
                  exit 1
                  ;;
              esac
            done < <(find -P "${payload_root}" -type f -print)
            while IFS= read -r payload_path; do
              relative_path="${payload_path#"${payload_root}/"}"
              case "${relative_path}" in
                "${payload_root}"|layout|layout/blobs|layout/blobs/sha256) ;;
                *)
                  echo "::error::Unexpected ${architecture} publication payload directory: ${relative_path}."
                  exit 1
                  ;;
              esac
            done < <(find -P "${payload_root}" -type d -print)

            if [ "$(stat -c '%s' "${metadata_file}")" -gt 16384 ] \
              || [ "$(stat -c '%s' "${tags_file}")" -gt 16384 ] \
              || [ "$(stat -c '%s' "${checksums_file}")" -gt 32768 ]; then
              echo "::error::${architecture} publication metadata exceeds size bounds."
              exit 1
            fi
            local computed_checksums="${RUNNER_TEMP}/ghcr-${architecture}-computed-SHA256SUMS"
            (
              cd "${payload_root}"
              find -P . -type f ! -path './SHA256SUMS' -print0 \
                | LC_ALL=C sort -z \
                | xargs -0 -r sha256sum
            ) > "${computed_checksums}"
            if ! cmp -s "${checksums_file}" "${computed_checksums}" \
              || ! (cd "${payload_root}" && sha256sum --check --strict SHA256SUMS >/dev/null); then
              echo "::error::${architecture} publication payload checksum validation failed."
              exit 1
            fi
            rm -f "${computed_checksums}"
            if ! jq -e \
              --arg source_sha "${expected_source_sha}" \
              --arg image_name "${expected_image_name}" \
              --arg platform "${platform}" \
              --arg tag "${EXPECTED_TAG}" \
              --arg build_channel "${EXPECTED_BUILD_CHANNEL}" \
              'type == "object"
                and length == 7
                and .source_sha == $source_sha
                and .image_name == $image_name
                and .platform == $platform
                and .tag == $tag
                and .build_commit == ($source_sha[0:12])
                and (.build_date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"))
                and .build_channel == $build_channel' "${metadata_file}" >/dev/null; then
              echo "::error::${architecture} publication metadata does not match immutable release inputs."
              exit 1
            fi

            local image_ref
            local image_tag
            local tag_count=0
            local -A seen_tags=()
            while IFS= read -r image_ref; do
              if [[ "${image_ref}" != "${expected_image_name}:"* ]]; then
                echo "::error::unexpected image reference in ${architecture} publication payload."
                exit 1
              fi
              image_tag="${image_ref#"${expected_image_name}:"}"
              if [[ ! "${image_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || [[ "${image_tag}" != *"${tag_suffix}" ]]; then
                echo "::error::unexpected image reference in ${architecture} publication payload."
                exit 1
              fi
              if [[ -n "${seen_tags[${image_ref}]:-}" ]]; then
                echo "::error::Duplicate ${architecture} publication image reference."
                exit 1
              fi
              seen_tags["${image_ref}"]=1
              tag_count=$((tag_count + 1))
            done < "${tags_file}"
            if [ "${tag_count}" -lt 1 ] || [ "${tag_count}" -gt 16 ]; then
              echo "::error::${architecture} publication tag count is outside bounds."
              exit 1
            fi

            local expected_tags_file="${RUNNER_TEMP}/ghcr-${architecture}-expected-image-tags.txt"
            : > "${expected_tags_file}"
            local expected_tag_count=0
            local -A expected_seen_tags=()
            local raw_tag
            local tag
            local expected_image_ref
            while IFS= read -r raw_tag || [[ -n "${raw_tag}" ]]; do
              tag="${raw_tag}"
              tag="${tag%$'\r'}"
              tag="${tag#"${tag%%[![:space:]]*}"}"
              tag="${tag%"${tag##*[![:space:]]}"}"
              if [[ -z "${tag}" ]]; then
                continue
              fi
              if [[ ! "${tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] \
                || [[ "${tag}" == *-amd64 ]] || [[ "${tag}" == *-arm64 ]]; then
                echo "::error::unexpected image reference in immutable architecture inputs."
                exit 1
              fi
              expected_image_ref="${expected_image_name}:${tag}-${architecture}"
              if [[ -n "${expected_seen_tags[${expected_image_ref}]:-}" ]]; then
                echo "::error::Duplicate immutable architecture image reference."
                exit 1
              fi
              expected_seen_tags["${expected_image_ref}"]=1
              printf '%s\n' "${expected_image_ref}" >> "${expected_tags_file}"
              expected_tag_count=$((expected_tag_count + 1))
            done <<< "${expected_image_tags}"
            if [ "${expected_tag_count}" -lt 1 ] || [ "${expected_tag_count}" -gt 16 ]; then
              echo "::error::Immutable architecture input tag count is outside bounds."
              exit 1
            fi
            if ! cmp -s "${tags_file}" "${expected_tags_file}"; then
              echo "::error::${architecture} publication image references do not match immutable release inputs."
              exit 1
            fi
            rm -f "${expected_tags_file}"

            if ! jq -e '.imageLayoutVersion == "1.0.0"' "${layout_root}/oci-layout" >/dev/null \
              || ! jq -e '.schemaVersion == 2 and (.manifests | type == "array")' "${layout_root}/index.json" >/dev/null; then
              echo "::error::Invalid ${architecture} OCI image layout."
              exit 1
            fi
            local blob
            local expected_digest
            local actual_digest
            while IFS= read -r blob; do
              expected_digest="$(basename "${blob}")"
              actual_digest="$(sha256sum "${blob}" | cut -d ' ' -f 1)"
              if [ "${actual_digest}" != "${expected_digest}" ]; then
                echo "::error::${architecture} OCI blob digest mismatch."
                exit 1
              fi
            done < <(find -P "${layout_root}/blobs/sha256" -type f -print)

            local -a image_digests
            mapfile -t image_digests < <(jq -r \
              --arg architecture "${architecture}" \
              '.manifests[]
                | select(.platform.os == "linux" and .platform.architecture == $architecture)
                | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
                | .digest' "${layout_root}/index.json" | sort -u)
            if [ "${#image_digests[@]}" -ne 1 ] || [[ ! "${image_digests[0]}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${architecture} OCI layout must contain exactly one unique ${platform} image digest."
              exit 1
            fi

            local image_digest="${image_digests[0]}"
            local manifest_file="${layout_root}/blobs/sha256/${image_digest#sha256:}"
            local config_digest
            config_digest="$(jq -r '.config.digest // empty' "${manifest_file}")"
            if [[ ! "${config_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::${architecture} OCI image config digest is invalid."
              exit 1
            fi
            local config_file="${layout_root}/blobs/sha256/${config_digest#sha256:}"
            if ! jq -e \
              --arg source_sha "${expected_source_sha}" \
              --arg release_tag "${EXPECTED_TAG}" \
              --arg architecture "${architecture}" \
              '.architecture == $architecture
                and .os == "linux"
                and .config.Labels["org.opencontainers.image.revision"] == $source_sha
                and .config.Labels["org.opencontainers.image.version"] == $release_tag
                and ((.config.OnBuild // []) | length == 0)' "${config_file}" >/dev/null; then
              echo "::error::${architecture} OCI image identity or OnBuild policy is invalid."
              exit 1
            fi

            chmod -R a-w "${payload_root}"
            {
              echo "${architecture}_digest=${image_digest}"
              echo "${architecture}_tags<<EOF_${architecture}"
              cat "${tags_file}"
              echo "EOF_${architecture}"
            } >> "${GITHUB_OUTPUT}"
          }

          validate_payload amd64 linux/amd64
          validate_payload arm64 linux/arm64

      - name: Prepare trusted image promotion Dockerfiles
        shell: bash
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            promotion_root="${RUNNER_TEMP}/ghcr-${architecture}-promotion"
            mkdir -p "${promotion_root}"
            printf '%s\n' 'FROM prepared' > "${promotion_root}/Dockerfile"
            chmod 0444 "${promotion_root}/Dockerfile"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish amd64 release image
        id: publish_amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/ghcr-amd64-promotion
          file: ${{ runner.temp }}/ghcr-amd64-promotion/Dockerfile
          build-contexts: prepared=oci-layout://${{ runner.temp }}/ghcr-amd64-publication/layout@${{ steps.validate.outputs.amd64_digest }}
          platforms: linux/amd64
          tags: ${{ steps.validate.outputs.amd64_tags }}
          push: true
          provenance: false
          sbom: true

      - name: Publish arm64 release image
        id: publish_arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/ghcr-arm64-promotion
          file: ${{ runner.temp }}/ghcr-arm64-promotion/Dockerfile
          build-contexts: prepared=oci-layout://${{ runner.temp }}/ghcr-arm64-publication/layout@${{ steps.validate.outputs.arm64_digest }}
          platforms: linux/arm64
          tags: ${{ steps.validate.outputs.arm64_tags }}
          push: true
          provenance: false
          sbom: true

      - name: Resolve GHCR image name
        id: ghcr_image
        shell: bash
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          printf 'name=ghcr.io/%s/lopper\n' "${owner}" >> "$GITHUB_OUTPUT"

      - name: Write release provenance predicate
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_SOURCE_REF: refs/tags/${{ inputs.tag }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u PROMPT_COMMAND -u PS4 -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          source_sha="${RELEASE_SOURCE_SHA:?}"
          output_path="${RUNNER_TEMP:?}/lopper-release-provenance.json"
          source_ref="${RELEASE_SOURCE_REF:?}"
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release source SHA must be a lowercase full 40-character commit SHA." >&2
            exit 1
          fi
          case "${source_ref}" in
            refs/tags/*|refs/heads/*) ;;
            *)
              echo "Release source ref must name a refs/tags or refs/heads ref." >&2
              exit 1
              ;;
          esac
          case "${source_ref}" in
            *..*|*"@"*|*"//"*|*" "*|*"\\"*|*/)
              echo "Release source ref is invalid." >&2
              exit 1
              ;;
          esac
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub OIDC token request is unavailable." >&2
            exit 1
          fi
          oidc_token="$(curl -fsSL --retry 3 --retry-delay 2 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=lopper-release-provenance")"
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN
          predicate="$(
            OIDC_TOKEN="${oidc_token}" \
              RELEASE_SOURCE_SHA="${source_sha}" \
              RELEASE_SOURCE_REF="${source_ref}" \
              GITHUB_SHA="${GITHUB_SHA}" \
              GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
              GITHUB_REF="${GITHUB_REF}" \
              GITHUB_SERVER_URL="${GITHUB_SERVER_URL}" \
              python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import sys

          def fail(message):
              sys.stderr.write(message + "\n")
              sys.exit(1)

          token = os.environ.pop("OIDC_TOKEN", "")
          source_sha = os.environ["RELEASE_SOURCE_SHA"]
          source_ref = os.environ["RELEASE_SOURCE_REF"]
          github_sha = os.environ["GITHUB_SHA"]
          repository = os.environ["GITHUB_REPOSITORY"]
          ref = os.environ["GITHUB_REF"]
          server = os.environ["GITHUB_SERVER_URL"].rstrip("/")
          sha_pattern = re.compile(r"^[0-9a-f]{40}$")
          if sha_pattern.fullmatch(source_sha) is None or sha_pattern.fullmatch(github_sha) is None:
              fail("Release provenance SHAs must be lowercase full commit SHAs.")
          parts = token.split(".")
          if len(parts) != 3 or parts[1] == "":
              fail("OIDC token payload is invalid.")
          try:
              payload = parts[1]
              payload += "=" * ((4 - len(payload) % 4) % 4)
              claims = json.loads(base64.urlsafe_b64decode(payload))
          except Exception:
              fail("OIDC token payload is invalid.")
          if not isinstance(claims, dict):
              fail("OIDC token payload is invalid.")

          def claim_string(key):
              if key not in claims:
                  fail("OIDC token is missing claim " + key)
              value = claims[key]
              if isinstance(value, bool) or value is None:
                  fail("OIDC token claim " + key + " is invalid.")
              if isinstance(value, int):
                  return str(value)
              if isinstance(value, str) and value != "":
                  return value
              fail("OIDC token claim " + key + " is invalid.")

          workflow_sha = claim_string("sha")
          workflow_ref = claim_string("ref")
          workflow_repository = claim_string("repository")
          if workflow_sha != github_sha or workflow_repository != repository or workflow_ref != ref:
              fail("OIDC token does not match the GitHub workflow context.")
          if not sha_pattern.fullmatch(workflow_sha):
              fail("OIDC workflow SHA is invalid.")
          workflow_path_ref = claim_string("workflow_ref")
          # Direct jobs use workflow_ref. Reusable jobs also identify the called workflow.
          job_workflow_ref = workflow_path_ref
          if "job_workflow_ref" in claims:
              job_workflow_ref = claim_string("job_workflow_ref")
          prefix = repository + "/"
          if not workflow_path_ref.startswith(prefix) or not job_workflow_ref.startswith(prefix):
              fail("OIDC workflow ref is outside the repository.")
          workflow_path = workflow_path_ref[len(prefix):].split("@", 1)[0]
          if workflow_path == "" or workflow_path.startswith("/") or ".." in workflow_path.split("/"):
              fail("OIDC workflow path is invalid.")
          if re.fullmatch(r"refs/(tags|heads)/[A-Za-z0-9][A-Za-z0-9._/-]{0,200}", source_ref) is None or ".." in source_ref or "@" in source_ref or "//" in source_ref or source_ref.endswith("/"):
              fail("Release source ref is invalid.")
          if source_ref == workflow_ref and source_sha != workflow_sha:
              fail("Release source ref does not match the workflow commit.")

          def dependency(uri_ref, digest):
              return {
                  "uri": "git+" + server + "/" + repository + "@" + uri_ref,
                  "digest": {"gitCommit": digest},
              }

          dependencies = []
          seen = set()
          for item in (dependency(workflow_ref, workflow_sha), dependency(source_ref, source_sha)):
              key = (item["uri"], item["digest"]["gitCommit"])
              if key in seen:
                  continue
              seen.add(key)
              dependencies.append(item)
          predicate = {
              "buildDefinition": {
                  "buildType": "https://actions.github.io/buildtypes/workflow/v1",
                  "externalParameters": {
                      "workflow": {
                          "ref": workflow_ref,
                          "repository": server + "/" + repository,
                          "path": workflow_path,
                      }
                  },
                  "internalParameters": {
                      "github": {
                          "event_name": claim_string("event_name"),
                          "repository_id": claim_string("repository_id"),
                          "repository_owner_id": claim_string("repository_owner_id"),
                          "runner_environment": claim_string("runner_environment"),
                      }
                  },
                  "resolvedDependencies": dependencies,
              },
              "runDetails": {
                  "builder": {"id": server + "/" + job_workflow_ref},
                  "metadata": {
                      "invocationId": server + "/" + repository + "/actions/runs/" + claim_string("run_id") + "/attempts/" + claim_string("run_attempt"),
                  },
              },
          }
          json.dump(predicate, sys.stdout, separators=(",", ":"), sort_keys=True)
          sys.stdout.write("\n")
          PY
          )"
          unset oidc_token
          umask 077
          printf '%s' "${predicate}" > "${output_path}"
          if [[ ! -s "${output_path}" ]] || ! grep -F -q "${source_sha}" "${output_path}" || ! grep -F -q "${source_ref}" "${output_path}" || ! grep -F -q "${GITHUB_SHA}" "${output_path}"; then
            echo "Release provenance predicate does not record the workflow commit and the selected release ref." >&2
            rm -f "${output_path}"
            exit 1
          fi
      - name: Attest amd64 release image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/lopper-release-provenance.json
          subject-name: ${{ steps.ghcr_image.outputs.name }}
          subject-digest: ${{ steps.publish_amd64.outputs.digest }}
          push-to-registry: true

      - name: Attest arm64 release image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/lopper-release-provenance.json
          subject-name: ${{ steps.ghcr_image.outputs.name }}
          subject-digest: ${{ steps.publish_arm64.outputs.digest }}
          push-to-registry: true

  prepare-ghcr-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Compute image name
        id: image
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${owner}/lopper" >> "$GITHUB_OUTPUT"

      - name: Compute manifest image tags
        id: image_tags
        shell: bash
        env:
          IMAGE_TAGS: ${{ inputs.image_tags }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          valid_image_tag_pattern='^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
          declare -a sanitized_tags=()
          while IFS= read -r raw_tag || [[ -n "$raw_tag" ]]; do
            tag="${raw_tag%$'\r'}"
            tag="${tag#"${tag%%[![:space:]]*}"}"
            tag="${tag%"${tag##*[![:space:]]}"}"
            if [[ -z "$tag" ]]; then
              continue
            fi
            if [[ ! "$tag" =~ $valid_image_tag_pattern ]]; then
              printf '::error::Malformed image tag rejected. Tags must match %s.\n' "$valid_image_tag_pattern" >&2
              printf 'Rejected image tag: %q\n' "$tag" >&2
              exit 1
            fi
            sanitized_tags+=("$tag")
          done <<< "$IMAGE_TAGS"
          if [[ "${#sanitized_tags[@]}" -eq 0 ]]; then
            printf '::error::No valid image tags were provided.\n' >&2
            exit 1
          fi

          image_tags_file="$(mktemp)"
          for tag in "${sanitized_tags[@]}"; do
            printf '%s:%s\n' "$IMAGE_NAME" "$tag" >> "$image_tags_file"
          done
          echo "file=$image_tags_file" >> "$GITHUB_OUTPUT"

      - name: Prepare manifest publication payload
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE_TAGS_FILE: ${{ steps.image_tags.outputs.file }}
        run: |
          set -euo pipefail
          payload_root="${RUNNER_TEMP}/ghcr-manifest-publication"
          mkdir -p "${payload_root}"
          install -m 0600 "${IMAGE_TAGS_FILE}" "${payload_root}/image-tags.txt"
          jq -n \
            --arg source_sha "${SOURCE_SHA}" \
            --arg image_name "${IMAGE_NAME}" \
            --arg tag "${RELEASE_TAG}" \
            '{source_sha: $source_sha, image_name: $image_name, tag: $tag}' \
            > "${payload_root}/publication.json"
          (
            cd "${payload_root}"
            find -P . -type f ! -path './SHA256SUMS' -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 -r sha256sum
          ) > "${payload_root}/SHA256SUMS"

      - name: Upload manifest publication payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ghcr-manifest-publication-payload
          path: ${{ runner.temp }}/ghcr-manifest-publication

  publish-ghcr-manifest:
    needs:
      - verify-publication-source
      - validate-publication-identifiers
      - publish-ghcr-images
      - prepare-ghcr-manifest
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      id-token: write
      packages: write
    steps:
      - name: Download manifest publication payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ghcr-manifest-publication-payload
          path: ${{ runner.temp }}/ghcr-manifest-publication

      - name: Validate manifest publication payload
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_IMAGE_TAGS: ${{ inputs.image_tags }}
          EXPECTED_AMD64_DIGEST: ${{ needs.publish-ghcr-images.outputs.amd64_digest }}
          EXPECTED_ARM64_DIGEST: ${{ needs.publish-ghcr-images.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          payload_root="${RUNNER_TEMP}/ghcr-manifest-publication"
          metadata_file="${payload_root}/publication.json"
          tags_file="${payload_root}/image-tags.txt"
          checksums_file="${payload_root}/SHA256SUMS"
          expected_source_sha="${EXPECTED_SOURCE_SHA}"
          expected_image_tags="${EXPECTED_IMAGE_TAGS}"
          amd64_digest="${EXPECTED_AMD64_DIGEST}"
          arm64_digest="${EXPECTED_ARM64_DIGEST}"
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          expected_image_name="ghcr.io/${owner}/lopper"

          if [[ ! "${expected_source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid immutable source SHA in manifest publication payload."
            exit 1
          fi
          if [[ ! "${amd64_digest}" =~ ^sha256:[0-9a-f]{64}$ ]] \
            || [[ ! "${arm64_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Published architecture image digests are invalid."
            exit 1
          fi
          if [ ! -f "${metadata_file}" ] || [ ! -f "${tags_file}" ] || [ ! -f "${checksums_file}" ] \
            || find -P "${payload_root}" ! -type d ! -type f -print -quit | grep -q .; then
            echo "::error::Manifest publication payload is missing files or contains unsupported paths."
            exit 1
          fi
          directory_count="$(find -P "${payload_root}" -type d | wc -l | tr -d '[:space:]')"
          if [ "${directory_count}" -ne 1 ]; then
            echo "::error::Manifest publication payload contains unexpected directories."
            exit 1
          fi
          file_count="$(find -P "${payload_root}" -type f | wc -l | tr -d '[:space:]')"
          total_bytes="$(find -P "${payload_root}" -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')"
          if [ "${file_count}" -ne 3 ] || [ "${total_bytes}" -gt 33280 ] \
            || [ "$(stat -c '%s' "${metadata_file}")" -gt 16384 ] \
            || [ "$(stat -c '%s' "${tags_file}")" -gt 16384 ] \
            || [ "$(stat -c '%s' "${checksums_file}")" -gt 512 ]; then
            echo "::error::Manifest artifact payload exceeds file-count or size bounds."
            exit 1
          fi
          while IFS= read -r payload_file; do
            relative_path="${payload_file#"${payload_root}/"}"
            case "${relative_path}" in
              SHA256SUMS|publication.json|image-tags.txt) ;;
              *)
                echo "::error::Unexpected manifest publication payload path."
                exit 1
                ;;
            esac
          done < <(find -P "${payload_root}" -type f -print)

          checksum_pattern='^[0-9a-f]{64}  (\./(image-tags\.txt|publication\.json))$'
          checksum_count=0
          declare -A seen_checksum_paths=()
          while IFS= read -r checksum_line || [[ -n "${checksum_line}" ]]; do
            if [[ ! "${checksum_line}" =~ ${checksum_pattern} ]]; then
              echo "::error::Manifest publication checksum syntax is invalid."
              exit 1
            fi
            checksum_path="${BASH_REMATCH[1]}"
            if [[ -n "${seen_checksum_paths[${checksum_path}]:-}" ]]; then
              echo "::error::Manifest publication checksum paths must be unique."
              exit 1
            fi
            seen_checksum_paths["${checksum_path}"]=1
            checksum_count=$((checksum_count + 1))
          done < "${checksums_file}"
          if [ "${checksum_count}" -ne 2 ]; then
            echo "::error::Manifest publication checksum count is invalid."
            exit 1
          fi
          computed_checksums="${RUNNER_TEMP}/ghcr-manifest-computed-SHA256SUMS"
          (
            cd "${payload_root}"
            find -P . -type f ! -path './SHA256SUMS' -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 -r sha256sum
          ) > "${computed_checksums}"
          if ! cmp -s "${checksums_file}" "${computed_checksums}" \
            || ! (cd "${payload_root}" && sha256sum --check --strict SHA256SUMS >/dev/null); then
            echo "::error::Manifest publication payload checksum validation failed."
            exit 1
          fi
          rm -f "${computed_checksums}"

          if ! jq -e \
            --arg source_sha "${expected_source_sha}" \
            --arg image_name "${expected_image_name}" \
            --arg tag "${EXPECTED_TAG}" \
            'type == "object"
              and length == 3
              and .source_sha == $source_sha
              and .image_name == $image_name
              and .tag == $tag' "${metadata_file}" >/dev/null; then
            echo "::error::Manifest publication metadata does not match immutable release inputs."
            exit 1
          fi

          expected_tags_file="${RUNNER_TEMP}/ghcr-manifest-expected-image-tags.txt"
          : > "${expected_tags_file}"
          expected_tag_count=0
          declare -A expected_seen_tags=()
          while IFS= read -r raw_tag || [[ -n "${raw_tag}" ]]; do
            tag="${raw_tag}"
            tag="${tag%$'\r'}"
            tag="${tag#"${tag%%[![:space:]]*}"}"
            tag="${tag%"${tag##*[![:space:]]}"}"
            if [[ -z "${tag}" ]]; then
              continue
            fi
            if [[ ! "${tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] \
              || [[ "${tag}" == *-amd64 ]] || [[ "${tag}" == *-arm64 ]]; then
              echo "::error::unexpected image reference in immutable manifest inputs."
              exit 1
            fi
            expected_image_ref="${expected_image_name}:${tag}"
            if [[ -n "${expected_seen_tags[${expected_image_ref}]:-}" ]]; then
              echo "::error::Duplicate manifest publication image reference."
              exit 1
            fi
            expected_seen_tags["${expected_image_ref}"]=1
            printf '%s:%s\n' "${expected_image_name}" "${tag}" >> "${expected_tags_file}"
            expected_tag_count=$((expected_tag_count + 1))
          done <<< "${expected_image_tags}"
          if [ "${expected_tag_count}" -lt 1 ] || [ "${expected_tag_count}" -gt 16 ]; then
            echo "::error::Immutable manifest input tag count is outside bounds."
            exit 1
          fi
          if ! cmp -s "${tags_file}" "${expected_tags_file}"; then
            echo "::error::Manifest publication image references do not match immutable release inputs."
            exit 1
          fi
          rm -f "${expected_tags_file}"

          tag_count=0
          declare -A seen_tags=()
          while IFS= read -r image_ref; do
            if [[ "${image_ref}" != "${expected_image_name}:"* ]]; then
              echo "::error::unexpected image reference in manifest publication payload."
              exit 1
            fi
            image_tag="${image_ref#"${expected_image_name}:"}"
            if [[ ! "${image_tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] \
              || [[ "${image_tag}" == *-amd64 ]] || [[ "${image_tag}" == *-arm64 ]]; then
              echo "::error::unexpected image reference in manifest publication payload."
              exit 1
            fi
            if [[ -n "${seen_tags[${image_ref}]:-}" ]]; then
              echo "::error::Duplicate manifest publication image reference."
              exit 1
            fi
            seen_tags["${image_ref}"]=1
            tag_count=$((tag_count + 1))
          done < "${tags_file}"
          if [ "${tag_count}" -lt 1 ] || [ "${tag_count}" -gt 16 ]; then
            echo "::error::Manifest publication tag count is outside bounds."
            exit 1
          fi
          chmod -R a-w "${payload_root}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch manifests
        shell: bash
        env:
          IMAGE_TAGS_FILE: ${{ runner.temp }}/ghcr-manifest-publication/image-tags.txt
          AMD64_DIGEST: ${{ needs.publish-ghcr-images.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ needs.publish-ghcr-images.outputs.arm64_digest }}
        run: |
          set -euo pipefail
          amd64_digest="${AMD64_DIGEST}"
          arm64_digest="${ARM64_DIGEST}"
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          expected_image_name="ghcr.io/${owner}/lopper"
          while IFS= read -r image_ref; do
            docker buildx imagetools create \
              -t "${image_ref}" \
              "${expected_image_name}@${amd64_digest}" \
              "${expected_image_name}@${arm64_digest}"
            docker buildx imagetools inspect "${image_ref}"
          done < "${IMAGE_TAGS_FILE}"

      - name: Resolve published manifest digest
        id: manifest_digest
        shell: bash
        env:
          IMAGE_TAGS_FILE: ${{ runner.temp }}/ghcr-manifest-publication/image-tags.txt
        run: |
          set -euo pipefail
          mapfile -t image_refs < "${IMAGE_TAGS_FILE}"
          if [ "${#image_refs[@]}" -lt 1 ]; then
            echo "::error::Manifest publication did not record an image reference." >&2
            exit 1
          fi
          digest=""
          for image_ref in "${image_refs[@]}"; do
            ref_digest="$(docker buildx imagetools inspect --format '{{printf "%s" .Manifest.Digest}}' "${image_ref}")"
            if [[ ! "${ref_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Published manifest digest is invalid." >&2
              exit 1
            fi
            if [ -z "${digest}" ]; then
              digest="${ref_digest}"
            elif [ "${ref_digest}" != "${digest}" ]; then
              echo "::error::Published manifest tags do not share one digest." >&2
              exit 1
            fi
          done
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          {
            printf 'digest=%s\n' "${digest}"
            printf 'name=ghcr.io/%s/lopper\n' "${owner}"
          } >> "$GITHUB_OUTPUT"

      - name: Write release provenance predicate
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          RELEASE_SOURCE_REF: refs/tags/${{ inputs.tag }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u PROMPT_COMMAND -u PS4 -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          set -euo pipefail
          source_sha="${RELEASE_SOURCE_SHA:?}"
          output_path="${RUNNER_TEMP:?}/lopper-release-provenance.json"
          source_ref="${RELEASE_SOURCE_REF:?}"
          if [[ ! "${source_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release source SHA must be a lowercase full 40-character commit SHA." >&2
            exit 1
          fi
          case "${source_ref}" in
            refs/tags/*|refs/heads/*) ;;
            *)
              echo "Release source ref must name a refs/tags or refs/heads ref." >&2
              exit 1
              ;;
          esac
          case "${source_ref}" in
            *..*|*"@"*|*"//"*|*" "*|*"\\"*|*/)
              echo "Release source ref is invalid." >&2
              exit 1
              ;;
          esac
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "GitHub OIDC token request is unavailable." >&2
            exit 1
          fi
          oidc_token="$(curl -fsSL --retry 3 --retry-delay 2 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=lopper-release-provenance")"
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN
          predicate="$(
            OIDC_TOKEN="${oidc_token}" \
              RELEASE_SOURCE_SHA="${source_sha}" \
              RELEASE_SOURCE_REF="${source_ref}" \
              GITHUB_SHA="${GITHUB_SHA}" \
              GITHUB_REPOSITORY="${GITHUB_REPOSITORY}" \
              GITHUB_REF="${GITHUB_REF}" \
              GITHUB_SERVER_URL="${GITHUB_SERVER_URL}" \
              python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import sys

          def fail(message):
              sys.stderr.write(message + "\n")
              sys.exit(1)

          token = os.environ.pop("OIDC_TOKEN", "")
          source_sha = os.environ["RELEASE_SOURCE_SHA"]
          source_ref = os.environ["RELEASE_SOURCE_REF"]
          github_sha = os.environ["GITHUB_SHA"]
          repository = os.environ["GITHUB_REPOSITORY"]
          ref = os.environ["GITHUB_REF"]
          server = os.environ["GITHUB_SERVER_URL"].rstrip("/")
          sha_pattern = re.compile(r"^[0-9a-f]{40}$")
          if sha_pattern.fullmatch(source_sha) is None or sha_pattern.fullmatch(github_sha) is None:
              fail("Release provenance SHAs must be lowercase full commit SHAs.")
          parts = token.split(".")
          if len(parts) != 3 or parts[1] == "":
              fail("OIDC token payload is invalid.")
          try:
              payload = parts[1]
              payload += "=" * ((4 - len(payload) % 4) % 4)
              claims = json.loads(base64.urlsafe_b64decode(payload))
          except Exception:
              fail("OIDC token payload is invalid.")
          if not isinstance(claims, dict):
              fail("OIDC token payload is invalid.")

          def claim_string(key):
              if key not in claims:
                  fail("OIDC token is missing claim " + key)
              value = claims[key]
              if isinstance(value, bool) or value is None:
                  fail("OIDC token claim " + key + " is invalid.")
              if isinstance(value, int):
                  return str(value)
              if isinstance(value, str) and value != "":
                  return value
              fail("OIDC token claim " + key + " is invalid.")

          workflow_sha = claim_string("sha")
          workflow_ref = claim_string("ref")
          workflow_repository = claim_string("repository")
          if workflow_sha != github_sha or workflow_repository != repository or workflow_ref != ref:
              fail("OIDC token does not match the GitHub workflow context.")
          if not sha_pattern.fullmatch(workflow_sha):
              fail("OIDC workflow SHA is invalid.")
          workflow_path_ref = claim_string("workflow_ref")
          # Direct jobs use workflow_ref. Reusable jobs also identify the called workflow.
          job_workflow_ref = workflow_path_ref
          if "job_workflow_ref" in claims:
              job_workflow_ref = claim_string("job_workflow_ref")
          prefix = repository + "/"
          if not workflow_path_ref.startswith(prefix) or not job_workflow_ref.startswith(prefix):
              fail("OIDC workflow ref is outside the repository.")
          workflow_path = workflow_path_ref[len(prefix):].split("@", 1)[0]
          if workflow_path == "" or workflow_path.startswith("/") or ".." in workflow_path.split("/"):
              fail("OIDC workflow path is invalid.")
          if re.fullmatch(r"refs/(tags|heads)/[A-Za-z0-9][A-Za-z0-9._/-]{0,200}", source_ref) is None or ".." in source_ref or "@" in source_ref or "//" in source_ref or source_ref.endswith("/"):
              fail("Release source ref is invalid.")
          if source_ref == workflow_ref and source_sha != workflow_sha:
              fail("Release source ref does not match the workflow commit.")

          def dependency(uri_ref, digest):
              return {
                  "uri": "git+" + server + "/" + repository + "@" + uri_ref,
                  "digest": {"gitCommit": digest},
              }

          dependencies = []
          seen = set()
          for item in (dependency(workflow_ref, workflow_sha), dependency(source_ref, source_sha)):
              key = (item["uri"], item["digest"]["gitCommit"])
              if key in seen:
                  continue
              seen.add(key)
              dependencies.append(item)
          predicate = {
              "buildDefinition": {
                  "buildType": "https://actions.github.io/buildtypes/workflow/v1",
                  "externalParameters": {
                      "workflow": {
                          "ref": workflow_ref,
                          "repository": server + "/" + repository,
                          "path": workflow_path,
                      }
                  },
                  "internalParameters": {
                      "github": {
                          "event_name": claim_string("event_name"),
                          "repository_id": claim_string("repository_id"),
                          "repository_owner_id": claim_string("repository_owner_id"),
                          "runner_environment": claim_string("runner_environment"),
                      }
                  },
                  "resolvedDependencies": dependencies,
              },
              "runDetails": {
                  "builder": {"id": server + "/" + job_workflow_ref},
                  "metadata": {
                      "invocationId": server + "/" + repository + "/actions/runs/" + claim_string("run_id") + "/attempts/" + claim_string("run_attempt"),
                  },
              },
          }
          json.dump(predicate, sys.stdout, separators=(",", ":"), sort_keys=True)
          sys.stdout.write("\n")
          PY
          )"
          unset oidc_token
          umask 077
          printf '%s' "${predicate}" > "${output_path}"
          if [[ ! -s "${output_path}" ]] || ! grep -F -q "${source_sha}" "${output_path}" || ! grep -F -q "${source_ref}" "${output_path}" || ! grep -F -q "${GITHUB_SHA}" "${output_path}"; then
            echo "Release provenance predicate does not record the workflow commit and the selected release ref." >&2
            rm -f "${output_path}"
            exit 1
          fi
      - name: Attest multi-arch release image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: ${{ runner.temp }}/lopper-release-provenance.json
          subject-name: ${{ steps.manifest_digest.outputs.name }}
          subject-digest: ${{ steps.manifest_digest.outputs.digest }}
          push-to-registry: true
