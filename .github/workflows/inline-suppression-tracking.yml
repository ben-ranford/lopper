name: inline suppression tracking

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      # A pull request that closes without merging gets no further event of
      # any other type, so its bot-created tracking issues would otherwise
      # remain open indefinitely for suppressions that never entered the
      # repository; trackInlineSuppressions dispatches this action to a
      # dedicated cleanup path instead of the normal recompute-and-publish
      # flow (which requires an open pull request).
      - closed

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: inline-suppression-tracking-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  track:
    name: track inline suppressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Materialize trusted suppression tracker
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          SUPPRESSION_TRACKER_PATH: ${{ runner.temp }}/inline_suppression_tracker.js
          TRUSTED_TRACKER_REF: ${{ github.workflow_sha }}
        with:
          script: |
            const fs = require('node:fs');
            const { data } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: 'scripts/inline_suppression_tracker.js',
              ref: process.env.TRUSTED_TRACKER_REF,
            });
            if (Array.isArray(data) || data.type !== 'file' || data.encoding !== 'base64') {
              throw new Error('Trusted inline suppression tracker is not a base64-encoded repository file.');
            }
            const source = Buffer.from(data.content.replaceAll('\n', ''), 'base64').toString('utf8');
            fs.writeFileSync(process.env.SUPPRESSION_TRACKER_PATH, source, {
              encoding: 'utf8',
              flag: 'wx',
              mode: 0o600,
            });

      - name: Track inline suppressions from trusted diff
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          SUPPRESSION_TRACKER_PATH: ${{ runner.temp }}/inline_suppression_tracker.js
        with:
          script: |
            const trackInlineSuppressions = require(process.env.SUPPRESSION_TRACKER_PATH);
            await trackInlineSuppressions({ github, context, core });
