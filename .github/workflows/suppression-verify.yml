name: suppression verify

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

permissions: {}

concurrency:
  group: suppression-verify-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      checks: write
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Publish pending suppression-verify check
        id: pending_check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'suppression-verify',
              head_sha: context.payload.pull_request.head.sha,
              status: 'in_progress',
            });
            core.setOutput('check-id', String(check.id));

      - name: Resolve trusted ci artifact for this pull request head
        id: resolve_artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const headSha = process.env.EXPECTED_HEAD_SHA;
            const artifactName = 'pr-report-inputs';
            // Bounded to the same shared-deadline style the trusted
            // tracking-issue poll below uses, so a stuck or missing "ci" run
            // fails this required check promptly instead of occupying the
            // job until its platform timeout.
            const deadlineMs = Date.now() + 10 * 60 * 1000;
            const delayMs = 15000;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            const findRun = async () => {
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci.yml',
                event: 'pull_request',
                head_sha: headSha,
                per_page: 100,
              });
              // GitHub returns newest first; the most recent run at this
              // exact head SHA is the one whose artifact (if any) reflects
              // the current, immutable PR head.
              return runs.find((run) => run.head_sha === headSha) ?? null;
            };

            let run;
            for (;;) {
              run = await findRun();
              if (run && run.status === 'completed') {
                break;
              }
              if (Date.now() >= deadlineMs) {
                throw new Error(`Timed out waiting for a completed "ci" workflow run at head SHA ${headSha}.`);
              }
              await sleep(delayMs);
            }

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run.id,
              per_page: 100,
            });
            // No matching artifact is possible only when the trusted "ci"
            // run's own "verify" job never reached its upload step (e.g. it
            // failed before then); the validation step below fails closed on
            // a missing PR report directory in that case.
            const artifact = artifacts.find((candidate) => candidate.name === artifactName && !candidate.expired) ?? null;
            if (!artifact) {
              throw new Error(`No unexpired "${artifactName}" artifact was found on the completed "ci" run at head SHA ${headSha}.`);
            }

            core.setOutput('run-id', String(run.id));
            core.setOutput('artifact-id', String(artifact.id));

      - name: Download PR report inputs
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ steps.resolve_artifact.outputs.artifact-id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pr-report-inputs
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve_artifact.outputs.run-id }}

      - name: Validate PR report inputs
        if: ${{ !env.ACT }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u PROMPT_COMMAND -u PS4 -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          PATH: /usr/bin:/bin
          REPORT_ROOT: ${{ runner.temp }}/pr-report-inputs
        run: |
          if [ ! -d "${REPORT_ROOT}" ]; then
            echo "PR report inputs are missing." >&2
            exit 1
          fi
          if find -P "${REPORT_ROOT}" -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "PR report inputs must contain only regular files." >&2
            exit 1
          fi

          allowed_files=(
            coverage-package-failures.txt
            coverage-status.txt
            coverage-total.txt
            inline-suppressions.json
            lopper-base-outcome.txt
            lopper-delta-outcome.txt
            lopper-pr-comment.md
            memory-bench-status.txt
            memory-bench-summary.md
          )
          required_files=(
            lopper-base-outcome.txt
            lopper-delta-outcome.txt
          )

          for required in "${required_files[@]}"; do
            path="${REPORT_ROOT}/${required}"
            if [ ! -f "${path}" ] || [ -L "${path}" ]; then
              echo "Missing required PR report input: ${required}" >&2
              exit 1
            fi
          done

          while IFS= read -r -d '' path; do
            name="$(basename "${path}")"
            case " ${allowed_files[*]} " in
              *" ${name} "*) ;;
              *)
                echo "Unexpected PR report input: ${name}" >&2
                exit 1
                ;;
            esac
            if [ "$(stat --format=%s "${path}")" -gt 1048576 ]; then
              echo "PR report input exceeds the 1 MiB publication limit: ${name}" >&2
              exit 1
            fi
            case "${name}" in
              coverage-package-failures.txt|inline-suppressions.json)
                if [ "$(stat --format=%s "${path}")" -gt 131072 ]; then
                  echo "PR report input exceeds the 128 KiB publication limit: ${name}" >&2
                  exit 1
                fi
                ;;
              coverage-status.txt|coverage-total.txt|memory-bench-status.txt)
                if [ "$(stat --format=%s "${path}")" -gt 64 ]; then
                  echo "PR report input exceeds the 64-byte publication limit: ${name}" >&2
                  exit 1
                fi
                ;;
            esac
          done < <(find -P "${REPORT_ROOT}" -mindepth 1 -maxdepth 1 -type f -print0)

      - name: Verify inline suppression tracking issues were published
        id: verify_suppressions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUPPRESSIONS_FILE: ${{ runner.temp }}/pr-report-inputs/inline-suppressions.json
        run: |
          # This step runs from this workflow's own trusted (default-branch)
          # revision, triggered by `pull_request_target`, not from the PR's
          # own copy of any workflow file -- unlike the read-only diff/blob
          # verification that used to live directly in ci.yml's `pull_request`
          # -triggered `verify` job, a PR cannot edit or delete this logic to
          # make its own required check trivially pass. New suppressions are
          # mutated (tracking issues created) via `issues:write` from the
          # separate `pull_request_target` tracking workflow; that workflow's
          # own check is not attached to this head SHA, so this step (and the
          # dedicated "suppression-verify" check it publishes) closes that gap
          # with a read-only wait/verify that a trusted tracking issue was
          # actually published for every suppression this PR adds, on this
          # head.
          # SUPPRESSIONS_FILE, when present, came from the "pr-report-inputs"
          # artifact uploaded by the PR-controlled checked-out `ci.yml` run
          # (the suppression detector and Makefile that produce it are
          # themselves PR-controlled code), so a PR could neuter them to
          # silently omit this artifact while still adding an untracked
          # suppression, making the checks below trivially pass. Before
          # trusting an empty/missing artifact, independently confirm via
          # GitHub's own diff data (which the PR cannot alter) that no
          # suppression-marker-shaped line was added.
          # Built from pieces, like check-inline-suppressions.sh, so this
          # gate does not match its own source.
          no_prefix="no"
          ts_prefix="ts"
          eslint_prefix="eslint"
          coverage_prefix="coverage"
          marker_names="(@?(${no_prefix}(sec|sonar|lint|qa)|${eslint_prefix}-disable(-next-line|-line)?|${ts_prefix}-(ignore|expect-error)|pragma:[[:space:]]*${no_prefix}[[:space:]]+cover|${coverage_prefix}:[[:space:]]*ignore))"
          # A "//"/"/*" comment delimiter needs no preceding whitespace in
          # any of the covered languages -- a marker immediately following
          # code with no space in between is still a valid suppression --
          # so requiring it would miss such lines entirely. Excluding ":"
          # keeps a URL scheme (http://nolint...) from matching; everything
          # else is a valid preceding position. Whether the delimiter falls
          # inside a string literal is handled separately, by masking
          # quoted regions before this pattern is applied (mirroring the
          # trusted tracker's isInsideQuotedRegion) -- checking only the
          # single preceding character misses a marker preceded by
          # ordinary text inside an otherwise-open string.
          #
          # Python/Ruby/YAML/shell only ever treat "#" as a comment
          # delimiter, so "//" in e.g. Python's `value = numerator // noqa`
          # is floor division, not a comment; matching it there would
          # reject valid code for missing suppression metadata it was never
          # meant to carry. Mirrors HASH_ONLY_EXTENSIONS/
          # SLASH_STYLE_EXTENSIONS in the trusted JS tracker; PHP and any
          # other extension not covered by either set keep recognizing
          # every prefix, since PHP alone among the covered languages
          # supports both styles.
          #
          # "#" does not follow one universal boundary rule even within
          # hash-only languages: Python and Ruby start a comment with "#"
          # anywhere outside a string -- exactly like "//" does in
          # slash-style languages -- but YAML/shell only start one with a
          # genuinely free-standing "#", never one embedded in a
          # scalar/word, such as the fragment identifier in
          # `url: https://example.test/#noqa` (YAML) or the literal
          # character in `echo foo#nolint` (shell). Mirrors
          # STRICT_HASH_BOUNDARY_EXTENSIONS/isCommentBoundary in the
          # trusted tracker.
          suspect_pattern_hash_strict="(^|[[:space:]])(#[[:space:]]*${marker_names})([^[:alnum:]_-]|$)"
          suspect_pattern_hash_lenient="(^|[^:])(#[[:space:]]*${marker_names})([^[:alnum:]_-]|$)"
          suspect_pattern_slash="(^|[^:])((//|/[*]+)[[:space:]]*${marker_names})([^[:alnum:]_-]|$)"
          # PHP (and any other extension covered by neither set) keeps the
          # original lenient boundary for "#" too: unlike YAML/shell, PHP's
          # "#" needs no free-standing rule.
          suspect_pattern_all="(^|[^:])((//|/[*]+|#)[[:space:]]*${marker_names})([^[:alnum:]_-]|$)"
          # Same extension classification as STRICT_HASH_BOUNDARY_EXTENSIONS/
          # SLASH_STYLE_EXTENSIONS in the trusted JS tracker.
          strict_hash_file_pattern='\.(bash|ksh|sh|ya?ml|zsh)$'
          lenient_hash_file_pattern='\.(py|rb)$'
          slash_style_file_pattern='\.(c|cc|cjs|cpp|cs|cxx|go|h|hh|hpp|java|js|jsx|kt|kts|mjs|rs|swift|ts|tsx)$'
          # Scope to the same source-file extensions the detector itself
          # covers, so documentation/config prose mentioning marker syntax
          # (this PR, being the one introducing the feature, has plenty)
          # can't inflate this into a false mismatch below.
          # Case-insensitive, like the trusted tracker's fileExtension()
          # (which lowercases before matching): a suppression added to
          # e.g. main.GO or component.TSX must not be silently skipped by
          # this scope filter while the trusted tracker still finds it.
          # Mirrors TRACKED_FILE_STATUSES in the trusted JS tracker, which
          # excludes "removed": a deleted file can never contain an added
          # suppression line, so scanning it (and enforcing patch
          # completeness for it) has no tracking benefit and would fail a
          # PR closed merely for deleting a large source file whose patch
          # GitHub omits.
          source_file_test='(.filename | test("^\\.githooks/|\\.(go|sh|bash|zsh|ksh|py|rb|php|js|jsx|cjs|mjs|ts|tsx|java|kt|kts|swift|rs|c|cc|cpp|cxx|h|hpp|hh|cs|ya?ml)$"; "i")) and .status != "removed"'
          # GitHub's pull-files endpoint returns at most 3000 files; a PR
          # with more changed files than that can never have all of them
          # retrieved, so a suppression added beyond the first 3000 would
          # be invisible to this scan while the trusted tracker (which
          # enforces the same MAX_CHANGED_FILES limit) correctly refuses to
          # publish anything for an oversized diff. Fail closed above the
          # same boundary instead of silently under-scanning.
          changed_files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files')"
          if [ "${changed_files:-0}" -gt 3000 ]; then
            echo "::error::This pull request changes ${changed_files} files, exceeding the 3000-file trusted diff limit; the independent suppression scan cannot retrieve all of them via GitHub's pull-files API. Refusing to trust an under-scanned diff." >&2
            exit 1
          fi
          # `gh api --paginate` requests every page but concatenates their
          # raw JSON bodies back to back -- e.g. two 100-item pages become
          # the two-document stream "[...][...]", not one combined array.
          # `jq 'length'` (and every `.[]`/`.[...]` filter below) would then
          # silently apply to each page separately instead of the whole
          # pull request, breaking the file-count comparison and any
          # per-file SHA lookup for a suppression on a later page. `jq -s
          # 'add'` slurps the whole multi-document stream into one array of
          # arrays and concatenates them into a single flat array.
          pr_files_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate | jq -s 'add')"
          pr_files_count="$(echo "${pr_files_json}" | jq 'length')"
          if [ "${pr_files_count:-0}" -ne "${changed_files:-0}" ]; then
            echo "::error::GitHub's pull-files API returned ${pr_files_count} file(s) but this pull request reports ${changed_files} changed file(s); refusing to trust an incomplete diff." >&2
            exit 1
          fi

          # GitHub omits `patch` entirely for files it considers too large
          # or whose diff it truncates. Treating that as "no suspect lines"
          # would let a PR pair an oversized source file with a tampered
          # detector/Makefile to make both counts read zero and merge an
          # untracked suppression; fail closed instead of guessing. A pure
          # rename (no content change) is also patchless but genuinely
          # empty of suspect lines -- the trusted tracker explicitly
          # exempts this exact shape (status "renamed", zero
          # additions/deletions) rather than treating it as incomplete, so
          # mirror that exemption here instead of failing every rename.
          incomplete_count="$(echo "${pr_files_json}" | jq "[.[] | select(${source_file_test}) | select(.patch == null) | select(.status != \"renamed\" or .additions != 0 or .deletions != 0)] | length")"
          if [ "${incomplete_count:-0}" -gt 0 ]; then
            echo "::error::GitHub's pull-files API omitted the patch for ${incomplete_count} source file(s) in this pull request (typically because the file or diff is too large); the independent suppression scan cannot make a safe determination for those files. Refusing to trust an under-scanned diff." >&2
            exit 1
          fi

          # A non-null but truncated patch is a separate incompleteness
          # GitHub can return alongside a genuinely present `patch` field:
          # the parsed hunks account for fewer additions/deletions than the
          # file's own reported totals. Treating that as "these are all the
          # added lines" would let a suppression beyond the truncated
          # portion escape the independent scan while the trusted tracker's
          # own patchLineStats/assertCompletePatch already refuses to trust
          # the same input. Mirror that check here instead of only testing
          # for a null patch.
          truncated_patch_count=0
          while IFS= read -r truncated_check_file_json; do
            truncated_check_filename="$(echo "${truncated_check_file_json}" | jq -r '.filename')"
            truncated_check_patch="$(echo "${truncated_check_file_json}" | jq -r '.patch')"
            truncated_check_additions="$(echo "${truncated_check_file_json}" | jq -r '.additions')"
            truncated_check_deletions="$(echo "${truncated_check_file_json}" | jq -r '.deletions')"
            if ! printf '%s\n' "${truncated_check_patch}" | awk -v want_add="${truncated_check_additions}" -v want_del="${truncated_check_deletions}" '
              function flush_hunk() {
                if (in_hunk && (old_seen != old_lines || new_seen != new_lines)) {
                  bad = 1
                }
              }
              /^@@ / {
                flush_hunk()
                line = $0
                sub(/^@@ -/, "", line)
                sub(/ @@.*/, "", line)
                split(line, halves, " ")
                old_part = halves[1]
                new_part = halves[2]
                sub(/^\+/, "", new_part)
                split(old_part, o, ",")
                split(new_part, n, ",")
                old_lines = (o[2] == "" ? 1 : o[2] + 0)
                new_lines = (n[2] == "" ? 1 : n[2] + 0)
                old_seen = 0
                new_seen = 0
                in_hunk = 1
                next
              }
              !in_hunk { next }
              /^\+/ { add++; new_seen++; next }
              /^-/ { del++; old_seen++; next }
              /^\\/ { next }
              { old_seen++; new_seen++ }
              END {
                flush_hunk()
                if (bad || add != want_add || del != want_del) {
                  exit 1
                }
              }
            '; then
              truncated_patch_count=$((truncated_patch_count + 1))
              echo "::error::GitHub's pull-files API returned a truncated patch for ${truncated_check_filename} (its parsed hunks do not account for the file's reported ${truncated_check_additions} addition(s)/${truncated_check_deletions} deletion(s)); the independent suppression scan cannot make a safe determination for this file. Refusing to trust an under-scanned diff." >&2
            fi
          done < <(echo "${pr_files_json}" | jq -c ".[] | select(${source_file_test}) | select(.patch != null)")
          if [ "${truncated_patch_count}" -gt 0 ]; then
            exit 1
          fi

          # Extract (file, added-line-content) pairs for every suspect line,
          # not just a count: comparing cardinalities alone lets a PR swap a
          # tracked suppression for an untracked one of the same shape (add
          # one, remove one) while the counts stay equal. Matching by exact
          # content -- the same "Source line" text the trusted tracker
          # records -- ties the independent scan to what was actually added.
          suspect_pairs_file="$(mktemp)"
          echo "${pr_files_json}" | jq -c ".[] | select(${source_file_test})" | while IFS= read -r file_json; do
            filename="$(echo "${file_json}" | jq -r '.filename')"
            lower_filename="$(echo "${filename}" | tr '[:upper:]' '[:lower:]')"
            if [[ "${lower_filename}" =~ ${strict_hash_file_pattern} ]]; then
              active_suspect_pattern="${suspect_pattern_hash_strict}"
            elif [[ "${lower_filename}" =~ ${lenient_hash_file_pattern} ]]; then
              active_suspect_pattern="${suspect_pattern_hash_lenient}"
            elif [[ "${lower_filename}" =~ ${slash_style_file_pattern} ]]; then
              active_suspect_pattern="${suspect_pattern_slash}"
            else
              active_suspect_pattern="${suspect_pattern_all}"
            fi
            patch="$(echo "${file_json}" | jq -r '.patch // empty')"
            content_tmp="$(mktemp)"
            # No recognized marker name appears anywhere in this patch, so
            # no line in it -- regardless of comment or quote state -- could
            # possibly match one; skip the blob fetch entirely rather than
            # paying for it on every scanned file. A PR with many changed
            # source files but no marker-shaped text could otherwise force
            # up to 3,000 sequential authenticated API requests in this
            # required check. Mirrors patchCouldContainMarker/
            # MARKER_SUBSTRINGS in the trusted tracker.
            lower_patch="$(printf '%s' "${patch}" | tr '[:upper:]' '[:lower:]')"
            if [[ "${lower_patch}" == *nosec* || "${lower_patch}" == *nosonar* || "${lower_patch}" == *nolint* || "${lower_patch}" == *noqa* || "${lower_patch}" == *eslint-disable* || "${lower_patch}" == *ts-ignore* || "${lower_patch}" == *ts-expect-error* || "${lower_patch}" == *coverage* || "${lower_patch}" == *pragma* ]]; then
              # GitHub's default 3-line patch context can hide a multi-line
              # construct (e.g. an open template literal) that begins
              # further above a hunk than that window reaches; seeding
              # every hunk's quote state as "no open quote" could mask a
              # real suppression comment after it, or the reverse. Fetch
              # the complete blob at this file's own pull-files SHA (no
              # path-encoding needed, and no Contents API inline-size
              # limit) so the scan below can derive each hunk's starting
              # quote state from it instead.
              file_sha="$(echo "${file_json}" | jq -r '.sha')"
              gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${file_sha}" --jq '.content' | base64 -d >"${content_tmp}"
            fi
            printf '%s\n' "${patch}" | awk -v pat="${active_suspect_pattern}" -v fname="${filename}" '
              FNR == NR {
                full_line_count = FNR
                full_lines[FNR] = $0
                next
              }
              function mask_quoted_regions(s, initial_quote,    result, i, c, quote, n, narrow_single_quote, past_comment_start, shell_language, no_escapes_in_this_quote, strict_hash_boundary_language) {
                result = ""
                quote = initial_quote
                n = length(s)
                past_comment_start = 0
                # Rust and C/C++ have no multi-character single-quoted
                # strings: a leading apostrophe is either a self-contained
                # char literal, a Rust lifetime, or a C++14 digit separator
                # grouping the digits of a large number -- none of which
                # close the way a real string does. Treating every
                # apostrophe as a string delimiter would let one of these
                # swallow the rest of the line, hiding a real suppression
                # comment after it.
                narrow_single_quote = (tolower(fname) ~ /\.(rs|c|cc|cpp|cxx|h|hh|hpp)$/)
                # "#" does not follow one universal boundary rule:
                # Python/Ruby start a comment with "#" anywhere outside a
                # string, but YAML/shell require it free-standing. Mirrors
                # STRICT_HASH_BOUNDARY_EXTENSIONS in the trusted tracker.
                strict_hash_boundary_language = (tolower(fname) ~ /\.(bash|ksh|sh|ya?ml|zsh)$/)
                # POSIX shell single-quoted strings have no escape character
                # at all: a backslash inside one is literal, and the string
                # closes at the very next apostrophe -- there is no way to
                # escape a quote within single quotes. Treating "\" as
                # escaping the following character there, the way it does
                # for every other quote/language combination, would let a
                # trailing backslash before the closing quote swallow that
                # quote as escaped content, leaving the string open and
                # masking a real suppression comment that follows it.
                shell_language = (tolower(fname) ~ /\.(bash|ksh|sh|zsh)$/)
                for (i = 1; i <= n; i++) {
                  c = substr(s, i, 1)
                  if (quote != "") {
                    no_escapes_in_this_quote = (quote == "'"'"'" && shell_language)
                    if (c == "\\" && i < n && !no_escapes_in_this_quote) {
                      result = result "xx"
                      i++
                      continue
                    }
                    if (c == quote) {
                      result = result c
                      quote = ""
                    } else {
                      result = result "x"
                    }
                    continue
                  }
                  if (c == "'"'"'" && narrow_single_quote) {
                    if (substr(s, i + 1, 1) == "\\" && substr(s, i + 3, 1) == "'"'"'") {
                      result = result c "xx" "'"'"'"
                      i += 3
                    } else if (substr(s, i + 1, 1) != "'"'"'" && substr(s, i + 2, 1) == "'"'"'") {
                      result = result c "x" "'"'"'"
                      i += 2
                    } else {
                      result = result c
                    }
                    continue
                  }
                  if ((c == "/" && substr(s, i + 1, 1) == "/") || c == "#") {
                    # A genuine line-comment delimiter outside any quoted
                    # region does not itself change how the rest of the
                    # line is masked (a well-formed quoted span later in
                    # the same comment, e.g. a backtick-quoted example,
                    # still needs its interior masked so example marker
                    # text is not mistaken for a real one); it only marks
                    # that a quote left dangling at end of line from here
                    # on is comment prose, not an unterminated string, and
                    # must not carry into the next line.
                    if (c == "#" && strict_hash_boundary_language) {
                      if (i == 1 || substr(s, i - 1, 1) ~ /[[:space:]]/) {
                        past_comment_start = 1
                      }
                    } else if (i == 1 || substr(s, i - 1, 1) != ":") {
                      past_comment_start = 1
                    }
                  }
                  if (c == "\"" || c == "'"'"'" || c == "`") {
                    quote = c
                    result = result c
                    continue
                  }
                  result = result c
                }
                final_quote_state = (past_comment_start ? "" : quote)
                return result
              }
              # The quote state to seed a hunk beginning at 1-indexed
              # `line`: derived from the complete blob content read above,
              # not just the 3-line context window the patch itself carries.
              function seed_quote_state(   idx, prior_count, seed) {
                seed = ""
                prior_count = line - 1
                if (full_line_count + 0 < prior_count) {
                  prior_count = full_line_count + 0
                }
                for (idx = 1; idx <= prior_count; idx++) {
                  mask_quoted_regions(full_lines[idx], seed)
                  seed = final_quote_state
                }
                return seed
              }
              /^\+\+\+ / { next }
              /^@@ / {
                hunk = $0
                sub(/^@@ -[0-9]+(,[0-9]+)? \+/, "", hunk)
                sub(/ .*/, "", hunk)
                split(hunk, parts, ",")
                line = parts[1] + 0
                # Unlike a zero-context diff, this patch carries real
                # unchanged context lines around each hunk, but not far
                # enough back to reveal a construct opened many lines
                # above; derive the starting state from the complete blob
                # instead of guessing "no open quote".
                quote_state = seed_quote_state()
                next
              }
              /^\+/ {
                content = substr($0, 2)
                # A CRLF-encoded file preserves a trailing "\r" as part of
                # a diff line content; stripping it keeps this content --
                # and the suspect record built from it -- identical to
                # what the trusted tracker computes for the same line,
                # which strips it too.
                sub(/\r$/, "", content)
                # Quote state carries across lines within a hunk: a
                # multi-line string (e.g. a JavaScript template literal)
                # that closes partway through a later line must not make
                # that later scan think the closing delimiter opens a new
                # quoted region, which would mask a real suppression
                # comment following it on the same line.
                masked = mask_quoted_regions(content, quote_state)
                quote_state = final_quote_state
                if (tolower(masked) ~ pat) {
                  # Binding the suspect to its actual added-line number (not
                  # just file+content) ties the occurrence recomputation
                  # below to a position the diff data from GitHub proves
                  # this pull request actually added, instead of trusting
                  # whatever line the (PR-controlled) tracking artifact
                  # claims -- otherwise a tampered artifact could bind an
                  # unrelated, already-correct earlier line to a suppression
                  # whose true occurrence has since drifted.
                  printf "%s\001%d\001%s\n", fname, line, content
                }
                line++
                next
              }
              /^-/ { next }
              /^\\/ { next }
              {
                # Context line: part of the resulting file, so its
                # quote-affecting characters must still be tracked even
                # though it is not itself scanned for a suspect marker.
                content = substr($0, 2)
                sub(/\r$/, "", content)
                mask_quoted_regions(content, quote_state)
                quote_state = final_quote_state
                line++
              }
            ' "${content_tmp}" -
            rm -f "${content_tmp}"
          done > "${suspect_pairs_file}"
          suspect_count="$(wc -l < "${suspect_pairs_file}" | tr -d ' ')"

          # A PR could also leave the detector partially working -- e.g. it
          # already has one published suppression, adds a second, and tweaks
          # the detector to keep emitting only the first -- so the artifact
          # is nonempty but under-reports.
          recorded_count=0
          recorded_pairs_file="$(mktemp)"
          if [ -s "${SUPPRESSIONS_FILE}" ]; then
            mapfile -t fingerprints < <(jq -r '.suppressions[].fingerprint' "${SUPPRESSIONS_FILE}")
            # Every record is a distinct occurrence and must therefore have
            # its own distinct, occurrence-specific fingerprint. A tampered
            # detector could otherwise report two records with identical
            # (file, content) -- passing the exact-pair multiset comparison,
            # which preserves multiplicity -- while reusing the first
            # occurrence's already-tracked fingerprint for both; that single
            # still-open issue would then satisfy the polling loop even
            # though the second occurrence's issue was never published.
            # Deduplicating with `sort -u` before counting would silently
            # accept this by collapsing the reused fingerprint to one
            # instead of rejecting the artifact for containing it twice.
            if [ "${#fingerprints[@]}" -gt 0 ]; then
              # `printf '%s\n'` with no array elements still runs its format
              # once, printing a single empty line -- counting that as one
              # unique fingerprint would wrongly flag a genuinely empty
              # array as a duplicate, so this comparison only runs once
              # there is at least one fingerprint to check.
              unique_fingerprint_count="$(printf '%s\n' "${fingerprints[@]}" | sort -u | wc -l | tr -d ' ')"
              if [ "${unique_fingerprint_count}" -ne "${#fingerprints[@]}" ]; then
                echo "::error::This pull request's tracking output contains the same fingerprint for more than one record; each occurrence must have its own distinct fingerprint. Refusing to trust a tampered artifact." >&2
                exit 1
              fi
            fi
            recorded_count="${#fingerprints[@]}"
            # SUPPRESSIONS_FILE is PR-controlled; a fingerprint is later
            # interpolated into a `gh issue list --jq` expression below. An
            # unvalidated value containing jq syntax could be crafted to
            # make an empty search result look like a match, defeating the
            # whole verification. Fingerprints are always sha256 hex
            # digests, so require exactly that shape before trusting any of
            # them.
            for fingerprint in "${fingerprints[@]}"; do
              if [[ ! "${fingerprint}" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::error::This pull request's tracking output contains a fingerprint that is not a 64-character hex digest; refusing to trust a malformed or tampered artifact." >&2
                exit 1
              fi
            done
            # The trusted tracker never publishes more than MAX_RECORDS (100)
            # entries per pull request, so a larger recorded_count is
            # necessarily a tampered artifact. Reject it before the polling
            # loop below issues one gh issue list request per fingerprint --
            # otherwise a PR-controlled detector could emit thousands of
            # distinct valid-looking fingerprints and exhaust the repository
            # token's API quota or the job's timeout.
            if [ "${recorded_count}" -gt 100 ]; then
              echo "::error::This pull request's tracking output records ${recorded_count} suppressions, exceeding the trusted tracker's 100-record publication limit; refusing to trust a malformed or tampered artifact." >&2
              exit 1
            fi
            # jq's @tsv formatter escapes tab/newline/backslash/CR within a
            # field (e.g. a literal backslash becomes the two characters
            # "\\"), but the suspect side below reads the same content
            # un-escaped straight from the diff; comparing an escaped
            # recorded pair against its un-escaped suspect pair would never
            # match, rejecting an otherwise valid PR. Emit the delimiter and
            # fields as raw bytes instead so no escaping is introduced.
            #
            # Including .line (not just file and content) ties each record
            # to the specific added-line position GitHub's own diff data
            # proves this pull request actually added. Without it, a
            # tampered artifact could bind a suppression's real (file,
            # content) -- which does appear as a genuine suspect -- to an
            # unrelated line the trusted tracker never used for its
            # occurrence recomputation, letting the true occurrence drift
            # (e.g. an identical line landing in the base branch ahead of
            # this one) go undetected.
            jq -j '.suppressions[] | .file, "\u0001", (.line | tostring), "\u0001", .content, "\n"' "${SUPPRESSIONS_FILE}" > "${recorded_pairs_file}"

            # A fingerprint's occurrence suffix must match this suppression's
            # TRUE position in the complete head file, not merely some
            # ordinal for which the hash happens to match. If an identical
            # suppression published at occurrence 1 on an earlier head later
            # becomes occurrence 2 (e.g. an identical line lands in the base
            # branch ahead of this one), a PR-controlled artifact could keep
            # emitting the stale occurrence-1 fingerprint; searching for any
            # ordinal that satisfies the hash would accept it merely because
            # it was once valid, letting a now-stale, still-open issue
            # satisfy this check even though the trusted tracker's current
            # recomputation has moved on. Fetch each referenced file's
            # complete blob (via the SHA GitHub's pull-files response
            # already provides) and bundle it the same way the suspect scan
            # above does, so the verification below can compute the one true
            # occurrence directly instead of searching for one that fits.
            occurrence_bundle_file="$(mktemp)"
            mapfile -t occurrence_bundle_files < <(jq -r '.suppressions[].file' "${SUPPRESSIONS_FILE}" | sort -u)
            for occurrence_bundle_file_name in "${occurrence_bundle_files[@]}"; do
              occurrence_bundle_file_sha="$(echo "${pr_files_json}" | jq -r --arg f "${occurrence_bundle_file_name}" '[.[] | select(.filename == $f)][0].sha // empty')"
              if [ -z "${occurrence_bundle_file_sha}" ]; then
                echo "::error::This pull request's tracking output records a suppression in ${occurrence_bundle_file_name}, which is not among this pull request's changed files; refusing to trust a tampered artifact." >&2
                exit 1
              fi
              {
                printf '\001%s\n' "${occurrence_bundle_file_name}"
                gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${occurrence_bundle_file_sha}" --jq '.content' | base64 -d
                printf '\n'
              } >>"${occurrence_bundle_file}"
            done

            # The exact-pair comparison above validates (file, content), and
            # the polling loop below validates that a fingerprint has an
            # open trusted issue -- but neither ties a record's own
            # fingerprint to its own (file, content, occurrence). PR-
            # controlled code can therefore pair suppression B's real
            # file/content with suppression A's still-open fingerprint: the
            # pair check accepts B (its content is genuinely recorded) and
            # the polling loop accepts A's issue, while B itself was never
            # published. A fingerprint is sha256(file "\n" content
            # ["\noccurrence:" N]), a deterministic function of only those
            # inputs plus the one true N derived from the bundle above, so
            # recomputing it and requiring an exact match rejects any
            # fingerprint that does not actually belong to its record.
            # python3 -c requires top-level statements at column 0, but a
            # YAML block scalar's own dedenting (removing the indentation of
            # its first line from every line) leaves an unpredictable
            # residual indentation here, not a fixed number of spaces --
            # it depends on this whole step's other, differently-nested
            # bash lines. Bootstrap through a second, single-line python3
            # invocation using textwrap.dedent, which removes exactly
            # whatever common leading whitespace is actually left, rather
            # than guessing a specific amount to strip.
            fingerprint_binding_script='
            import hashlib
            import os
            import sys

            bundle_files = {}
            current_file = None
            with open(os.environ["OCCURRENCE_BUNDLE_FILE"], "rb") as handle:
                for raw_line in handle:
                    entry = raw_line[:-1] if raw_line.endswith(b"\n") else raw_line
                    if entry[:1] == b"\x01":
                        current_file = entry[1:]
                        bundle_files[current_file] = []
                        continue
                    if current_file is not None:
                        # A CRLF-encoded file preserves a trailing "\r" on
                        # every line after splitting on "\n" alone;
                        # stripping it here keeps this comparison identical
                        # to what the trusted tracker computes for the
                        # same line, which strips it too.
                        if entry.endswith(b"\r"):
                            entry = entry[:-1]
                        bundle_files[current_file].append(entry)

            data = sys.stdin.buffer.read()
            for record in data.split(b"\n"):
                if not record:
                    continue
                parts = record.split(b"\x01")
                if len(parts) != 4:
                    print("::error::This pull request tracking output contains a malformed record; refusing to trust a tampered artifact.", file=sys.stderr)
                    sys.exit(1)
                file, content, fingerprint, line_field = parts
                if not line_field.isdigit():
                    print("::error::This pull request tracking output contains a non-numeric line for a record; refusing to trust a tampered artifact.", file=sys.stderr)
                    sys.exit(1)
                line = int(line_field)
                lines = bundle_files.get(file)
                if lines is None:
                    print("::error::This pull request tracking output records a suppression whose file content could not be verified; refusing to trust a tampered artifact.", file=sys.stderr)
                    sys.exit(1)
                occurrence = sum(1 for candidate in lines[:line] if candidate == content)
                if occurrence < 1:
                    print("::error::This pull request tracking output records a suppression that does not actually appear at its claimed line in the complete head file; refusing to trust a tampered artifact.", file=sys.stderr)
                    sys.exit(1)
                base = file + b"\n" + content
                suffix = (b"\noccurrence:%d" % occurrence) if occurrence > 1 else b""
                expected = hashlib.sha256(base + suffix).hexdigest().encode()
                if expected != fingerprint:
                    print("::error::This pull request tracking output contains a fingerprint that does not match its own recorded file, content, and true occurrence " + str(occurrence) + "; refusing to trust a tampered artifact.", file=sys.stderr)
                    sys.exit(1)
            '
            fingerprint_binding_dedented="$(printf '%s' "${fingerprint_binding_script}" | python3 -c 'import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))')"
            jq -j '.suppressions[] | .file, "\u0001", .content, "\u0001", .fingerprint, "\u0001", (.line | tostring), "\n"' "${SUPPRESSIONS_FILE}" | OCCURRENCE_BUNDLE_FILE="${occurrence_bundle_file}" python3 -c "${fingerprint_binding_dedented}"
            rm -f "${occurrence_bundle_file}"
          fi

          # comm requires sorted input but -- given sorted, duplicate-
          # preserving input -- still computes a correct *multiset*
          # difference: plain `sort` (not `sort -u`) is required here.
          # Deduplicating first would let a PR add the same suspect line
          # twice while a tampered detector reports only one occurrence's
          # (correctly fingerprinted) record; the duplicate suspect and its
          # single matching recorded pair would collapse to one of each and
          # compare as fully satisfied, hiding the untracked second
          # occurrence.
          missing_suspects="$(comm -23 <(sort "${suspect_pairs_file}") <(sort "${recorded_pairs_file}") | wc -l | tr -d ' ')"
          if [ "${missing_suspects:-0}" -gt 0 ]; then
            echo "::error::GitHub's own diff for this pull request independently found ${suspect_count} suspect line(s), ${missing_suspects} of which are not present in this pull request's tracking output (matched by file and exact line content). This can happen if the suppression detector or Makefile target was modified to under-report, or if a tracked suppression was silently swapped for an untracked one; refusing to trust the artifact." >&2
            exit 1
          fi

          if [ "${recorded_count}" -eq 0 ]; then
            echo "No inline suppressions were recorded in this pull request, and GitHub's diff independently confirms no suppression markers were added; nothing to verify."
            exit 0
          fi

          # Poll every still-missing fingerprint together under one shared
          # deadline (40 rounds x 15s = 10 minutes total), not an
          # independent wait per fingerprint -- otherwise a persistently
          # failed tracker run could make this step sleep for up to
          # MAX_RECORDS x 10 minutes instead of reporting promptly.
          missing=("${fingerprints[@]}")
          for _ in $(seq 1 40); do
            if [ "${#missing[@]}" -eq 0 ]; then
              break
            fi
            still_missing=()
            for fingerprint in "${missing[@]}"; do
              # A substring `contains` check accepts the marker text
              # anywhere in the body, including inside the echoed "Source
              # line" of an attacker-controlled suppression comment; require
              # it in the canonical first-two-lines header position instead,
              # matching the trusted controller's own issueBodyIncludesMarker.
              found="$(gh issue list --state open \
                --search "lopper-inline-suppression:${fingerprint} lopper-inline-suppression-pr:${PR_NUMBER} author:github-actions[bot]" \
                --json number,author,body \
                --jq "[.[] | select(.author.login == \"github-actions[bot]\" and ((.body // \"\") | test(\"^<!-- lopper-inline-suppression:${fingerprint} -->\\n<!-- lopper-inline-suppression-pr:${PR_NUMBER} -->\")))][0].number")"
              if [ -z "${found}" ]; then
                still_missing+=("${fingerprint}")
              fi
            done
            missing=("${still_missing[@]}")
            if [ "${#missing[@]}" -eq 0 ]; then
              break
            fi
            sleep 15
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::No trusted inline suppression tracking issue was found for fingerprint(s): ${missing[*]}. The 'inline suppression tracking' workflow must publish a tracking issue for every new suppression before this required check can pass; re-run it or check its logs if this persists." >&2
            exit 1
          fi
          echo "Verified a trusted tracking issue exists for every inline suppression in this pull request."

      - name: Report suppression verification check conclusion
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          CHECK_ID: ${{ steps.pending_check.outputs.check-id }}
          VERIFY_OUTCOME: ${{ steps.verify_suppressions.outcome }}
        with:
          script: |
            const checkId = process.env.CHECK_ID;
            if (!checkId) {
              // The pending-check step itself never ran or never produced an
              // ID; there is nothing to update, and the job's own failure
              // already reports as a workflow failure.
              return;
            }
            const conclusion = process.env.VERIFY_OUTCOME === 'success' ? 'success' : 'failure';
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(checkId),
              status: 'completed',
              conclusion,
            });
