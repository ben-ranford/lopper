name: ci

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

# PR metadata changes affect approval gates, so keep their triggers while
# replacing superseded verification runs. Manual dispatches remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  verify-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      pr_report_artifact_id: ${{ steps.upload_pr_report_inputs.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Go
        if: ${{ !env.ACT }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            Makefile
            .github/workflows/ci.yml

      - name: Setup Go (act)
        if: ${{ env.ACT }}
        run: |
          if ! command -v go >/dev/null 2>&1; then
            apt-get update
            apt-get install -y golang-go
          fi
          if ! command -v shellcheck >/dev/null 2>&1; then
            apt-get update
            apt-get install -y shellcheck
          fi
          if ! command -v ruby >/dev/null 2>&1; then
            apt-get update
            apt-get install -y ruby
          fi
          if ! node -e 'const [major, minor] = process.versions.node.split(".").map(Number); process.exit((major === 22 && minor >= 12) || major > 22 ? 0 : 1)' 2>/dev/null; then
            apt-get update
            apt-get install -y ca-certificates curl gnupg
            mkdir -p /usr/share/keyrings
            curl -fsSL --proto '=https' --tlsv1.2 https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
            echo "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
            apt-get update
            apt-get install -y nodejs
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update
            apt-get install -y python3
          fi
          go version

      - name: Install shellcheck
        if: ${{ !env.ACT }}
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      # Capture executables before any PR-controlled Make recipe can add PATH wrappers.
      - name: Capture duplication executables
        id: duplication_executables
        run: |
          revision="$(git rev-parse --verify HEAD)"
          tooling="$(mktemp -d "${RUNNER_TEMP}/lopper-tooling.XXXXXX")"
          git clone --no-local --no-checkout -- "$PWD" "$tooling"
          git -C "$tooling" -c core.hooksPath=/dev/null checkout --detach "$revision"
          {
            printf 'revision=%s\n' "$revision"
            printf 'tooling=%s\n' "$tooling"
            printf 'go=%s\n' "$(command -v go)"
            printf 'python=%s\n' "$(command -v python3)"
            printf 'git=%s\n' "$(command -v git)"
            printf 'make=%s\n' "$(command -v make)"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve gosec version
        id: gosec_version
        working-directory: ${{ steps.duplication_executables.outputs.tooling }}
        run: echo "value=$(make --silent print-gosec-version)" >> "$GITHUB_OUTPUT"

      - name: Install Go tooling
        working-directory: ${{ steps.duplication_executables.outputs.tooling }}
        env:
          GOSEC_VERSION: ${{ steps.gosec_version.outputs.value }}
        run: |
          make tools-install
          if [ -z "${ACT:-}" ]; then
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi

      - name: Resolve PR base ref
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base_ref="${PR_BASE_REF:-main}"
          {
            printf 'BASE_SHA=%s\n' "${PR_BASE_SHA}"
            printf 'BASE_REF=%s\n' "${base_ref}"
            printf 'PR_HEAD_SHA=%s\n' "${PR_HEAD_SHA}"
          } >> "$GITHUB_ENV"

      - name: Write PR body for regression proof
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const bodyPath = path.join(process.env.RUNNER_TEMP, 'pr-regression-body.md');
            fs.writeFileSync(bodyPath, context.payload.pull_request?.body || '', 'utf8');
            core.exportVariable('PR_BODY_FILE', bodyPath);

      - name: Fetch PR base
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          resolve_act_merge_base() {
            local requested_ref="$1"
            local candidate_ref=""
            if git rev-parse --verify -q --end-of-options "refs/remotes/origin/${requested_ref}^{commit}" >/dev/null; then
              candidate_ref="refs/remotes/origin/${requested_ref}"
            elif git rev-parse --verify -q --end-of-options "refs/heads/${requested_ref}^{commit}" >/dev/null; then
              candidate_ref="refs/heads/${requested_ref}"
            else
              if git fetch --no-tags origin "${requested_ref}" >/dev/null 2>&1; then
                if git rev-parse --verify -q --end-of-options "refs/remotes/origin/${requested_ref}^{commit}" >/dev/null; then
                  candidate_ref="refs/remotes/origin/${requested_ref}"
                fi
              fi
            fi
            if [ -z "${candidate_ref}" ]; then
              echo "::error::ACT pull_request event payload omitted PR base SHA and base ref '${requested_ref}' is unavailable; cannot resolve immutable merge base." >&2
              return 1
            fi
            if ! git merge-base -- "${candidate_ref}" HEAD; then
              echo "::error::ACT pull_request event payload omitted PR base SHA and base ref '${requested_ref}' is unrelated to HEAD; cannot resolve immutable merge base." >&2
              return 1
            fi
          }
          base_ref="${BASE_REF:-main}"
          base_sha="${BASE_SHA:-}"
          if [ -z "${base_sha}" ]; then
            if [ -n "${ACT:-}" ]; then
              if ! base_sha="$(resolve_act_merge_base "${base_ref}")"; then
                exit 1
              fi
              echo "ACT pull_request event payload omitted PR base SHA; resolved immutable merge base ${base_sha} from ${base_ref}."
            else
              echo "::error::PR base SHA is unavailable; cannot prepare memory benchmark base." >&2
              exit 1
            fi
          fi
          if [ -z "${ACT:-}" ]; then
            git fetch --no-tags origin "${base_sha}"
            git fetch --no-tags origin "${base_ref}"
          fi
          if ! git rev-parse --verify -q --end-of-options "${base_sha}^{commit}" >/dev/null; then
            echo "::error::PR base SHA '${base_sha}' is missing; cannot prepare memory benchmark base." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${base_sha}" HEAD; then
            echo "::error::PR base SHA '${base_sha}' is not an ancestor of HEAD; memory benchmark gate cannot run safely." >&2
            exit 1
          fi
          checkout_base_sha="$(git rev-parse --verify -q HEAD^1 2>/dev/null || true)"
          checkout_head_sha="$(git rev-parse --verify -q HEAD^2 2>/dev/null || true)"
          current_head_sha="$(git rev-parse --verify -q HEAD 2>/dev/null || true)"
          # A two-parent HEAD is only trustworthy as GitHub's synthetic PR
          # merge checkout when HEAD^2 matches the PR's real head SHA and
          # HEAD itself does not -- an ordinary merge commit that happens to
          # live on the PR branch (e.g. a "merge main into feature" commit)
          # can also satisfy a bare ancestor check on HEAD^1, silently
          # narrowing the memory-benchmark comparison to just that commit's
          # own delta instead of the whole PR.
          if [ -n "${checkout_base_sha}" ] && [ -n "${checkout_head_sha}" ] && [ -n "${PR_HEAD_SHA:-}" ] && [ "${current_head_sha}" != "${PR_HEAD_SHA}" ] && [ "${checkout_head_sha}" = "${PR_HEAD_SHA}" ] && git merge-base --is-ancestor "${base_sha}" "${checkout_base_sha}"; then
            base_sha="${checkout_base_sha}"
          fi
          printf 'MEMORY_BENCH_BASE=%s\n' "${base_sha}" >> "$GITHUB_ENV"

      - name: Run CI target
        shell: /usr/bin/env -u MAKEFLAGS -u GNUMAKEFLAGS -u MFLAGS -u MAKEFILES -u BASH_ENV -u ENV -u PROMPT_COMMAND -u PS4 -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          LOPPER_CI_MAKE: ${{ steps.duplication_executables.outputs.make }}
          GH_EVENT_NAME: ${{ github.event_name }}
          SUPPRESSION_TRACKING_OUTPUT: .artifacts/inline-suppressions.json
          LOPPER_DUPLICATION_GO: ${{ steps.duplication_executables.outputs.go }}
          LOPPER_DUPLICATION_GIT: ${{ steps.duplication_executables.outputs.git }}
          LOPPER_DUPLICATION_REVISION: ${{ steps.duplication_executables.outputs.revision }}
          DUPLICATION_PYTHON: ${{ steps.duplication_executables.outputs.python }}
        run: |
          if [ "${GH_EVENT_NAME}" = "pull_request" ]; then
            export MEMORY_BENCH_BASE="${MEMORY_BENCH_BASE:?prepared PR memory benchmark base is required}"
            export DUPLICATION_BASE="${MEMORY_BENCH_BASE}"
            export MEMORY_BENCH_ENFORCE=0
          fi
          if [ -n "${ACT:-}" ]; then
            PATH="$(go env GOPATH)/bin:$PATH" "${LOPPER_CI_MAKE}" ci-checks
          else
            "${LOPPER_CI_MAKE}" ci-checks
          fi

      - name: Prove regression tests for fix PRs
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_REGRESSION_EXEMPT_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'regression-exempt') }}
        run: |
          go run ./tools/regressionproof --repo . --body-file "$PR_BODY_FILE" --title "$PR_TITLE" --base-sha "$PR_BASE_SHA" --regression-exempt-label "$PR_REGRESSION_EXEMPT_LABEL" --target-os linux

      - name: Fail on unapproved memory regression
        if: ${{ github.event_name == 'pull_request' && !env.ACT && always() && !contains(github.event.pull_request.labels.*.name, 'memory-approved') }}
        run: |
          if [ ! -f .artifacts/memory-bench-status.txt ]; then
            exit 0
          fi
          status="$(tr -d '[:space:]' < .artifacts/memory-bench-status.txt)"
          if [ "$status" = "1" ]; then
            echo "Memory benchmark regression detected. Add the memory-approved label to acknowledge and merge it."
            exit 1
          fi

      - name: Verify demo assets are up to date
        run: make demos-check

      - name: Run lopper self-analysis (base branch)
        id: lopper_base
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          base_sha="${MEMORY_BENCH_BASE:?prepared PR memory benchmark base is required}"
          mkdir -p .artifacts
          git worktree add --detach .artifacts/base "${base_sha}"
          bin/lopper analyse --top 10 --repo .artifacts/base --language all --format json > .artifacts/lopper-base.json
          git worktree remove --force .artifacts/base

      - name: Run lopper delta summary (PR)
        id: lopper_delta
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          mkdir -p .artifacts
          bin/lopper analyse --top 10 --repo . --language all --baseline .artifacts/lopper-base.json --format pr-comment > .artifacts/lopper-pr-comment.md

      - name: Run coverage gate
        id: cov
        continue-on-error: true
        env:
          COVERAGE_MIN: 98
          COVERAGE_PACKAGE_MIN: 98
        run: |
          set +e
          if [ -n "${ACT:-}" ]; then
            PATH="$(go env GOPATH)/bin:$PATH" make cov COVERAGE_MIN="${COVERAGE_MIN}" COVERAGE_PACKAGE_MIN="${COVERAGE_PACKAGE_MIN}"
          else
            make cov COVERAGE_MIN="${COVERAGE_MIN}" COVERAGE_PACKAGE_MIN="${COVERAGE_PACKAGE_MIN}"
          fi
          status=$?
          mkdir -p .artifacts
          printf '%s\n' "$status" > .artifacts/coverage-status.txt
          if [ -f .artifacts/coverage-total.txt ]; then
            total="$(cat .artifacts/coverage-total.txt)"
          else
            total=""
          fi
          echo "package_failures<<EOF" >> "$GITHUB_OUTPUT"
          if [ -f .artifacts/coverage-package-failures.txt ]; then
            cat .artifacts/coverage-package-failures.txt >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Stage PR report inputs
        if: ${{ github.event_name == 'pull_request' && always() }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u PROMPT_COMMAND -u PS4 -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          PATH: /usr/bin:/bin
          LOPPER_BASE_OUTCOME: ${{ steps.lopper_base.outcome }}
          LOPPER_DELTA_OUTCOME: ${{ steps.lopper_delta.outcome }}
        run: |
          write_bounded_output() {
            local dest="$1"
            local limit_bytes="$2"
            local value="$3"
            printf '%s\n' "${value}" > "${dest}"
            if [ "$(stat --format=%s "${dest}")" -gt "${limit_bytes}" ]; then
              echo "PR report input exceeds the ${limit_bytes}-byte staging limit: $(basename "${dest}")" >&2
              exit 1
            fi
          }

          copy_bounded_report() {
            local src="$1"
            local dest="$2"
            local limit_bytes="$3"
            if [ "$(stat --format=%s "${src}")" -gt "${limit_bytes}" ]; then
              echo "PR report input exceeds the ${limit_bytes}-byte staging limit: $(basename "${src}")" >&2
              exit 1
            fi
            cp -- "${src}" "${dest}"
          }

          report_root="${RUNNER_TEMP}/pr-report-inputs"
          rm -rf -- "${report_root}"
          mkdir -p -- "${report_root}"

          write_bounded_output "${report_root}/lopper-base-outcome.txt" 64 "${LOPPER_BASE_OUTCOME}"
          write_bounded_output "${report_root}/lopper-delta-outcome.txt" 64 "${LOPPER_DELTA_OUTCOME}"

          for report in \
            coverage-package-failures.txt \
            coverage-status.txt \
            coverage-total.txt \
            inline-suppressions.json \
            lopper-pr-comment.md \
            memory-bench-status.txt \
            memory-bench-summary.md
          do
            src=".artifacts/${report}"
            if [ -f "${src}" ] && [ ! -L "${src}" ]; then
              limit_bytes=1048576
              case "${report}" in
                coverage-package-failures.txt)
                  limit_bytes=131072
                  ;;
                inline-suppressions.json)
                  limit_bytes=131072
                  ;;
                coverage-status.txt|coverage-total.txt|memory-bench-status.txt)
                  limit_bytes=64
                  ;;
              esac
              copy_bounded_report "${src}" "${report_root}/${report}" "${limit_bytes}"
            fi
          done

      - name: Upload PR report inputs
        id: upload_pr_report_inputs
        if: ${{ github.event_name == 'pull_request' && always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # Include the PR number for report discovery. The aggregate verify
          # job binds its download directly to this upload's artifact ID.
          name: pr-report-inputs-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/pr-report-inputs
          if-no-files-found: error

      - name: Report repository size and advisory test clones
        run: |
          python3 -m unittest discover -s scripts -p 'source_size_report_test.py'
          size_base="${MEMORY_BENCH_BASE:-origin/main}"
          make --silent source-size-report DUPLICATION_BASE="${size_base}" > "$RUNNER_TEMP/source-size-report.json"

      - name: Upload source size report
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: source-size-report
          path: ${{ runner.temp }}/source-size-report.json
          if-no-files-found: error

      - name: Upload binary artifact
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lopper-bin
          path: bin/lopper
          if-no-files-found: ignore

      - name: Mock artifact upload (act)
        if: ${{ always() && env.ACT }}
        run: |
          test -f bin/lopper
          ls -lh bin/lopper

      - name: Fail workflow on coverage gate
        if: ${{ steps.cov.outcome == 'failure' }}
        run: exit 1

  suppression-evidence:
    name: suppression-artifact-${{ needs.verify-checks.outputs.pr_report_artifact_id }}
    needs: verify-checks
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Expose exact producer artifact locator
        if: ${{ !env.ACT }}
        env:
          ARTIFACT_ID: ${{ needs.verify-checks.outputs.pr_report_artifact_id }}
        run: |
          python3 -I -S -B - <<'PYTHON'
          import os
          import re
          if not re.fullmatch(r"[1-9][0-9]*", os.environ["ARTIFACT_ID"]):
              raise SystemExit("Missing producer artifact ID")
          PYTHON

  publish-pr-reports:
    needs: verify
    if: ${{ always() && github.event_name == 'pull_request' && needs.verify.outputs.pr_report_artifact_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download PR report inputs
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.verify.outputs.pr_report_artifact_id }}
          github-token: ${{ github.token }}
          path: pr-report-inputs
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Validate PR report inputs
        if: ${{ !env.ACT }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u PROMPT_COMMAND -u PS4 -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          PATH: /usr/bin:/bin
          REPORT_ROOT: pr-report-inputs
        run: |
          if [ ! -d "${REPORT_ROOT}" ]; then
            echo "PR report inputs are missing." >&2
            exit 1
          fi
          if find -P "${REPORT_ROOT}" -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "PR report inputs must contain only regular files." >&2
            exit 1
          fi

          allowed_files=(
            coverage-package-failures.txt
            coverage-status.txt
            coverage-total.txt
            inline-suppressions.json
            lopper-base-outcome.txt
            lopper-delta-outcome.txt
            lopper-pr-comment.md
            memory-bench-status.txt
            memory-bench-summary.md
          )
          required_files=(
            lopper-base-outcome.txt
            lopper-delta-outcome.txt
          )

          for required in "${required_files[@]}"; do
            path="${REPORT_ROOT}/${required}"
            if [ ! -f "${path}" ] || [ -L "${path}" ]; then
              echo "Missing required PR report input: ${required}" >&2
              exit 1
            fi
          done

          while IFS= read -r -d '' path; do
            name="$(basename "${path}")"
            case " ${allowed_files[*]} " in
              *" ${name} "*) ;;
              *)
                echo "Unexpected PR report input: ${name}" >&2
                exit 1
                ;;
            esac
            if [ "$(stat --format=%s "${path}")" -gt 1048576 ]; then
              echo "PR report input exceeds the 1 MiB publication limit: ${name}" >&2
              exit 1
            fi
            case "${name}" in
              coverage-package-failures.txt|inline-suppressions.json)
                if [ "$(stat --format=%s "${path}")" -gt 131072 ]; then
                  echo "PR report input exceeds the 128 KiB publication limit: ${name}" >&2
                  exit 1
                fi
                ;;
              coverage-status.txt|coverage-total.txt|memory-bench-status.txt)
                if [ "$(stat --format=%s "${path}")" -gt 64 ]; then
                  echo "PR report input exceeds the 64-byte publication limit: ${name}" >&2
                  exit 1
                fi
                ;;
            esac
          done < <(find -P "${REPORT_ROOT}" -mindepth 1 -maxdepth 1 -type f -print0)

      - name: Comment memory benchmark report on PR
        if: ${{ !env.ACT }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('node:fs');

            const marker = '<!-- lopper-memory-bench -->';
            const reportRoot = 'pr-report-inputs';
            const summaryPath = `${reportRoot}/memory-bench-summary.md`;
            const statusPath = `${reportRoot}/memory-bench-status.txt`;
            const labels = context.payload.pull_request?.labels || [];
            const approved = labels.some((label) => label?.name === 'memory-approved');
            const status = fs.existsSync(statusPath) ? fs.readFileSync(statusPath, 'utf8').trim() : '';
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8').trim()
              : '## Memory Benchmarks\n\n❌ Memory benchmark summary was not produced.';

            const footer =
              status === '1'
                ? approved
                  ? 'Approval: `memory-approved` label present. The regression is acknowledged for this PR.'
                  : 'Approval required: add the `memory-approved` label to merge an intentional memory regression.'
                : status === '0'
                  ? 'Approval: not required.'
                  : 'Approval: unavailable because the memory benchmark gate did not complete cleanly.';

            const body = [marker, summary, '', footer].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Comment lopper report on PR
        if: ${{ !env.ACT }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('node:fs');

            const marker = '<!-- lopper-pr-report -->';
            const reportRoot = 'pr-report-inputs';
            const deltaCommentPath = `${reportRoot}/lopper-pr-comment.md`;
            const baseOutcomePath = `${reportRoot}/lopper-base-outcome.txt`;
            const deltaOutcomePath = `${reportRoot}/lopper-delta-outcome.txt`;
            const baseOutcome = fs.existsSync(baseOutcomePath) ? fs.readFileSync(baseOutcomePath, 'utf8').trim() : '';
            const deltaOutcome = fs.existsSync(deltaOutcomePath) ? fs.readFileSync(deltaOutcomePath, 'utf8').trim() : '';

            const failureBody = [
              marker,
              '## Lopper (Delta)',
              '',
              '❌ Lopper delta analysis failed in CI.',
              '',
              'Re-run the workflow, or run local head/base analyses and compare outputs.',
            ].join('\n');

            const body =
              baseOutcome !== 'success' ||
              deltaOutcome !== 'success' ||
              !fs.existsSync(deltaCommentPath)
                ? failureBody
                : `${marker}\n${fs.readFileSync(deltaCommentPath, 'utf8').trim()}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.filter(
              (comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker),
            );

            if (existing.length > 0) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing[0].id,
                body,
              });
              for (const duplicate of existing.slice(1)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: duplicate.id,
                });
              }
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Comment on coverage failure
        if: ${{ !env.ACT }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          COVERAGE_MIN: 98
          COVERAGE_PACKAGE_MIN: 98
        with:
          script: |
            const fs = require('node:fs');

            const reportRoot = 'pr-report-inputs';
            const statusPath = `${reportRoot}/coverage-status.txt`;
            const totalPath = `${reportRoot}/coverage-total.txt`;
            const packageFailuresPath = `${reportRoot}/coverage-package-failures.txt`;

            if (!fs.existsSync(statusPath) || fs.readFileSync(statusPath, 'utf8').trim() === '0') {
              core.info('Coverage gate passed or did not emit a status; skipping PR coverage comment.');
              return;
            }

            const marker = '<!-- lopper-coverage-failure -->';
            const total = fs.existsSync(totalPath) ? fs.readFileSync(totalPath, 'utf8').trim() : 'unavailable';
            const packageFailures = fs.existsSync(packageFailuresPath)
              ? fs.readFileSync(packageFailuresPath, 'utf8').trim()
              : '';
            const packageFailureSection = packageFailures
              ? `Packages below minimum:\n${packageFailures}\n\n`
              : '';
            const body = `${marker}
            ❌ Coverage gate failed.

            Required total: >= ${process.env.COVERAGE_MIN}%
            Actual total: ${total === 'unavailable' ? total : `${total}%`}

            Required per-package: >= ${process.env.COVERAGE_PACKAGE_MIN}%

            ${packageFailureSection}Run \`make cov\` locally for details.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  verify-rolling-checks:
    name: verification checks (rolling)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Go
        if: ${{ !env.ACT }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            Makefile
            .github/workflows/ci.yml

      - name: Setup Go (act)
        if: ${{ env.ACT }}
        run: |
          if ! command -v go >/dev/null 2>&1; then
            apt-get update
            apt-get install -y golang-go
          fi
          if ! command -v shellcheck >/dev/null 2>&1; then
            apt-get update
            apt-get install -y shellcheck
          fi
          if ! command -v ruby >/dev/null 2>&1; then
            apt-get update
            apt-get install -y ruby
          fi
          if ! node -e 'const [major, minor] = process.versions.node.split(".").map(Number); process.exit((major === 22 && minor >= 12) || major > 22 ? 0 : 1)' 2>/dev/null; then
            apt-get update
            apt-get install -y ca-certificates curl gnupg
            mkdir -p /usr/share/keyrings
            curl -fsSL --proto '=https' --tlsv1.2 https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
            echo "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
            apt-get update
            apt-get install -y nodejs
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update
            apt-get install -y python3
          fi
          go version

      - name: Install shellcheck
        if: ${{ !env.ACT }}
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

      - name: Install Go tooling
        run: |
          make tools-install
          if [ -z "${ACT:-}" ]; then
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi

      - name: Resolve PR base ref
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base_ref="${PR_BASE_REF:-main}"
          {
            printf 'BASE_SHA=%s\n' "${PR_BASE_SHA}"
            printf 'BASE_REF=%s\n' "${base_ref}"
            printf 'PR_HEAD_SHA=%s\n' "${PR_HEAD_SHA}"
          } >> "$GITHUB_ENV"

      - name: Fetch PR base
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          resolve_act_merge_base() {
            local requested_ref="$1"
            local candidate_ref=""
            if git rev-parse --verify -q --end-of-options "refs/remotes/origin/${requested_ref}^{commit}" >/dev/null; then
              candidate_ref="refs/remotes/origin/${requested_ref}"
            elif git rev-parse --verify -q --end-of-options "refs/heads/${requested_ref}^{commit}" >/dev/null; then
              candidate_ref="refs/heads/${requested_ref}"
            else
              if git fetch --no-tags origin "${requested_ref}" >/dev/null 2>&1; then
                if git rev-parse --verify -q --end-of-options "refs/remotes/origin/${requested_ref}^{commit}" >/dev/null; then
                  candidate_ref="refs/remotes/origin/${requested_ref}"
                fi
              fi
            fi
            if [ -z "${candidate_ref}" ]; then
              echo "::error::ACT pull_request event payload omitted PR base SHA and base ref '${requested_ref}' is unavailable; cannot resolve immutable merge base." >&2
              return 1
            fi
            if ! git merge-base -- "${candidate_ref}" HEAD; then
              echo "::error::ACT pull_request event payload omitted PR base SHA and base ref '${requested_ref}' is unrelated to HEAD; cannot resolve immutable merge base." >&2
              return 1
            fi
          }
          base_ref="${BASE_REF:-main}"
          base_sha="${BASE_SHA:-}"
          if [ -z "${base_sha}" ]; then
            if [ -n "${ACT:-}" ]; then
              if ! base_sha="$(resolve_act_merge_base "${base_ref}")"; then
                exit 1
              fi
              echo "ACT pull_request event payload omitted PR base SHA; resolved immutable merge base ${base_sha} from ${base_ref}."
            else
              echo "::error::PR base SHA is unavailable; cannot prepare memory benchmark base." >&2
              exit 1
            fi
          fi
          if [ -z "${ACT:-}" ]; then
            git fetch --no-tags origin "${base_sha}"
            git fetch --no-tags origin "${base_ref}"
          fi
          if ! git rev-parse --verify -q --end-of-options "${base_sha}^{commit}" >/dev/null; then
            echo "::error::PR base SHA '${base_sha}' is missing; cannot prepare memory benchmark base." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${base_sha}" HEAD; then
            echo "::error::PR base SHA '${base_sha}' is not an ancestor of HEAD; memory benchmark gate cannot run safely." >&2
            exit 1
          fi
          checkout_base_sha="$(git rev-parse --verify -q HEAD^1 2>/dev/null || true)"
          checkout_head_sha="$(git rev-parse --verify -q HEAD^2 2>/dev/null || true)"
          current_head_sha="$(git rev-parse --verify -q HEAD 2>/dev/null || true)"
          # A two-parent HEAD is only trustworthy as GitHub's synthetic PR
          # merge checkout when HEAD^2 matches the PR's real head SHA and
          # HEAD itself does not -- an ordinary merge commit that happens to
          # live on the PR branch (e.g. a "merge main into feature" commit)
          # can also satisfy a bare ancestor check on HEAD^1, silently
          # narrowing the memory-benchmark comparison to just that commit's
          # own delta instead of the whole PR.
          if [ -n "${checkout_base_sha}" ] && [ -n "${checkout_head_sha}" ] && [ -n "${PR_HEAD_SHA:-}" ] && [ "${current_head_sha}" != "${PR_HEAD_SHA}" ] && [ "${checkout_head_sha}" = "${PR_HEAD_SHA}" ] && git merge-base --is-ancestor "${base_sha}" "${checkout_base_sha}"; then
            base_sha="${checkout_base_sha}"
          fi
          printf 'MEMORY_BENCH_BASE=%s\n' "${base_sha}" >> "$GITHUB_ENV"

      - name: Run CI target with rolling defaults
        env:
          BUILD_CHANNEL: rolling
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${GH_EVENT_NAME}" = "pull_request" ]; then
            export MEMORY_BENCH_BASE="${MEMORY_BENCH_BASE:?prepared PR memory benchmark base is required}"
            export DUPLICATION_BASE="${MEMORY_BENCH_BASE}"
            export MEMORY_BENCH_ENFORCE=0
          fi
          if [ -n "${ACT:-}" ]; then
            PATH="$(go env GOPATH)/bin:$PATH" make ci-checks BUILD_CHANNEL="${BUILD_CHANNEL}"
          else
            make ci-checks BUILD_CHANNEL="${BUILD_CHANNEL}"
          fi

  verify-tests:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-tests.yml
    with:
      source_sha: ${{ github.sha }}
      build_channel: dev

  verify-rolling-tests:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-tests.yml
    with:
      source_sha: ${{ github.sha }}
      build_channel: rolling

  regression-proof-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Resolve native Go toolchain
        shell: pwsh
        run: |
          $goRoot = go env GOROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "REGRESSION_PROOF_GO_ROOT=$goRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test native Windows proof tools
        shell: pwsh
        run: go test ./tools/regressionproof -run '^TestWindowsProof' -count=1

      - name: Verify native Windows runtime path compatibility
        shell: pwsh
        run: ./scripts/verify-windows-runtime-paths.ps1

      - name: Write PR body for regression proof
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const bodyPath = path.join(process.env.RUNNER_TEMP, 'pr-regression-body.md');
            fs.writeFileSync(bodyPath, context.payload.pull_request?.body || '', 'utf8');
            core.exportVariable('PR_BODY_FILE', bodyPath);

      - name: Prove Windows regression tests for fix PRs
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]' }}
        shell: pwsh
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_REGRESSION_EXEMPT_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'regression-exempt') }}
        run: go run ./tools/regressionproof --repo . --body-file "$env:PR_BODY_FILE" --title "$env:PR_TITLE" --base-sha "$env:PR_BASE_SHA" --regression-exempt-label "$env:PR_REGRESSION_EXEMPT_LABEL" --target-os windows

  verify:
    if: ${{ always() }}
    needs: [verify-checks, verify-tests, regression-proof-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      pr_report_artifact_id: ${{ needs.verify-checks.outputs.pr_report_artifact_id }}
    steps:
      - name: Require every verification job
        env:
          CHECKS_RESULT: ${{ needs.verify-checks.result }}
          TESTS_RESULT: ${{ needs.verify-tests.result }}
          WINDOWS_PROOF_RESULT: ${{ needs.regression-proof-windows.result }}
        run: |
          test "${CHECKS_RESULT}" = success && test "${TESTS_RESULT}" = success && test "${WINDOWS_PROOF_RESULT}" = success

      - name: Initialize suppression verification
        id: suppression_verification
        if: ${{ github.event_name == 'pull_request' && !env.ACT }}
        env:
          PR_REPORT_ARTIFACT_ID: ${{ needs.verify-checks.outputs.pr_report_artifact_id }}
        run: |
          if [[ ! "${PR_REPORT_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::The current verification run did not produce a valid PR report artifact ID." >&2
            exit 1
          fi
          echo "job-start-ms=$(date +%s%3N)" >> "${GITHUB_OUTPUT}"

      - name: Download PR report inputs
        if: ${{ github.event_name == 'pull_request' && !env.ACT }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.verify-checks.outputs.pr_report_artifact_id }}
          path: ${{ runner.temp }}/pr-report-inputs
          merge-multiple: true

      - name: Validate PR report inputs
        if: ${{ github.event_name == 'pull_request' && !env.ACT }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u PROMPT_COMMAND -u PS4 -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          PATH: /usr/bin:/bin
          REPORT_ROOT: ${{ runner.temp }}/pr-report-inputs
        run: |
          if [ ! -d "${REPORT_ROOT}" ]; then
            echo "PR report inputs are missing." >&2
            exit 1
          fi
          if find -P "${REPORT_ROOT}" -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "PR report inputs must contain only regular files." >&2
            exit 1
          fi

          allowed_files=(
            coverage-package-failures.txt
            coverage-status.txt
            coverage-total.txt
            inline-suppressions.json
            lopper-base-outcome.txt
            lopper-delta-outcome.txt
            lopper-pr-comment.md
            memory-bench-status.txt
            memory-bench-summary.md
          )
          required_files=(
            lopper-base-outcome.txt
            lopper-delta-outcome.txt
          )

          for required in "${required_files[@]}"; do
            path="${REPORT_ROOT}/${required}"
            if [ ! -f "${path}" ] || [ -L "${path}" ]; then
              echo "Missing required PR report input: ${required}" >&2
              exit 1
            fi
          done

          while IFS= read -r -d '' path; do
            name="$(basename "${path}")"
            case " ${allowed_files[*]} " in
              *" ${name} "*) ;;
              *)
                echo "Unexpected PR report input: ${name}" >&2
                exit 1
                ;;
            esac
            if [ "$(stat --format=%s "${path}")" -gt 1048576 ]; then
              echo "PR report input exceeds the 1 MiB publication limit: ${name}" >&2
              exit 1
            fi
            case "${name}" in
              coverage-package-failures.txt|inline-suppressions.json)
                if [ "$(stat --format=%s "${path}")" -gt 131072 ]; then
                  echo "PR report input exceeds the 128 KiB publication limit: ${name}" >&2
                  exit 1
                fi
                ;;
              coverage-status.txt|coverage-total.txt|memory-bench-status.txt)
                if [ "$(stat --format=%s "${path}")" -gt 64 ]; then
                  echo "PR report input exceeds the 64-byte publication limit: ${name}" >&2
                  exit 1
                fi
                ;;
            esac
          done < <(find -P "${REPORT_ROOT}" -mindepth 1 -maxdepth 1 -type f -print0)

      - name: Require explicit suppression evidence
        if: ${{ github.event_name == 'pull_request' && !env.ACT }}
        env:
          SUPPRESSIONS_FILE: ${{ runner.temp }}/pr-report-inputs/inline-suppressions.json
        run: |
          if [ ! -f "${SUPPRESSIONS_FILE}" ] || [ -L "${SUPPRESSIONS_FILE}" ]; then
            echo "::error::The producer must provide explicit suppression evidence, including a clean scan." >&2
            exit 1
          fi
          if [ "$(wc -c < "${SUPPRESSIONS_FILE}")" -gt 131072 ]; then
            echo "::error::Suppression evidence exceeds the 128 KiB limit." >&2
            exit 1
          fi
          if ! jq -e -s 'length == 1 and (.[0] | type == "object" and keys == ["schema", "suppressions"] and .schema == "lopper-inline-suppressions-v1" and (.suppressions | type == "array" and length <= 100))' "${SUPPRESSIONS_FILE}" > /dev/null; then
            echo "::error::Suppression evidence must be one valid v1 document with at most 100 records." >&2
            exit 1
          fi

      - name: Verify inline suppression tracking issues were published
        id: verify_suppressions
        if: ${{ github.event_name == 'pull_request' && !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUPPRESSIONS_FILE: ${{ runner.temp }}/pr-report-inputs/inline-suppressions.json
          JOB_START_MS: ${{ steps.suppression_verification.outputs.job-start-ms }}
        run: |
          # This read-only verifier is PR-controlled, like the rest of ci.yml.
          # Issue creation stays in the separate trusted pull_request_target
          # tracking workflow. Validate its published issues without executing
          # downloaded artifacts or granting this job write permissions.
          # SUPPRESSIONS_FILE, when present, came from the "pr-report-inputs"
          # artifact uploaded by the PR-controlled checked-out `ci.yml` run
          # (the suppression detector and Makefile that produce it are
          # themselves PR-controlled code), so a PR could neuter them to
          # silently omit this artifact while still adding an untracked
          # suppression, making the checks below trivially pass. Before
          # trusting an empty/missing artifact, independently confirm via
          # GitHub's own diff data (which the PR cannot alter) that no
          # suppression-marker-shaped line was added.
          # Built from pieces, like check-inline-suppressions.sh, so this
          # gate does not match its own source.
          no_prefix="no"
          ts_prefix="ts"
          eslint_prefix="eslint"
          coverage_prefix="coverage"
          marker_names="(@?(${no_prefix}(sec|sonar|lint|qa)|${eslint_prefix}-disable(-next-line|-line)?|${ts_prefix}-(ignore|expect-error)|pragma:[[:space:]]*${no_prefix}[[:space:]]+cover|${coverage_prefix}:[[:space:]]*ignore))"
          # A "//"/"/*" comment delimiter needs no preceding whitespace in
          # any of the covered languages -- a marker immediately following
          # code with no space in between is still a valid suppression --
          # so requiring it would miss such lines entirely. Excluding ":"
          # keeps a URL scheme (http://nolint...) from matching; everything
          # else is a valid preceding position. Whether the delimiter falls
          # inside a string literal is handled separately, by masking
          # quoted regions before this pattern is applied (mirroring the
          # trusted tracker's isInsideQuotedRegion) -- checking only the
          # single preceding character misses a marker preceded by
          # ordinary text inside an otherwise-open string.
          #
          # Python/Ruby/YAML/shell only ever treat "#" as a comment
          # delimiter, so "//" in e.g. Python's `value = numerator // noqa`
          # is floor division, not a comment; matching it there would
          # reject valid code for missing suppression metadata it was never
          # meant to carry. Mirrors HASH_ONLY_EXTENSIONS/
          # SLASH_STYLE_EXTENSIONS in the trusted JS tracker; PHP and any
          # other extension not covered by either set keep recognizing
          # every prefix, since PHP alone among the covered languages
          # supports both styles.
          #
          # "#" does not follow one universal boundary rule even within
          # hash-only languages: Python and Ruby start a comment with "#"
          # anywhere outside a string -- exactly like "//" does in
          # slash-style languages -- but YAML/shell only start one with a
          # genuinely free-standing "#", never one embedded in a
          # scalar/word, such as the fragment identifier in
          # `url: https://example.test/#noqa` (YAML) or the literal
          # character in `echo foo#nolint` (shell); shell list operators
          # also start a new word. Mirrors
          # STRICT_HASH_BOUNDARY_EXTENSIONS/isCommentBoundary in the
          # trusted tracker.
          suspect_pattern_hash_yaml="(^|[[:space:]])(#[[:space:]]*${marker_names})([^[:alnum:]_-]|$)"
          suspect_pattern_hash_shell="(^|[[:space:];|&()])(#[[:space:]]*${marker_names})([^[:alnum:]_-]|$)"
          suspect_pattern_hash_lenient="(^|[^:])(#[[:space:]]*${marker_names})([^[:alnum:]_-]|$)"
          suspect_pattern_slash="(^|[^:])((//|/[*]+)[[:space:]]*${marker_names})([^[:alnum:]_-]|$)"
          suspect_go_marker_pattern="^(//|/[*]+)[[:space:]]*${marker_names}([^[:alnum:]_-]|$)"
          # PHP (and any other extension covered by neither set) keeps the
          # original lenient boundary for "#" too: unlike YAML/shell, PHP's
          # "#" needs no free-standing rule.
          suspect_pattern_all="(^|[^:])((//|/[*]+|#)[[:space:]]*${marker_names})([^[:alnum:]_-]|$)"
          # Same extension classification as STRICT_HASH_BOUNDARY_EXTENSIONS/
          # SLASH_STYLE_EXTENSIONS in the trusted JS tracker.
          yaml_file_pattern='\.(ya?ml)$'
          shell_file_pattern='\.(bash|ksh|sh|zsh)$'
          lenient_hash_file_pattern='\.(py|rb)$'
          slash_style_file_pattern='\.(c|cc|cjs|cpp|cs|cxx|go|h|hh|hpp|java|js|jsx|kt|kts|mjs|rs|swift|ts|tsx)$'
          # Scope to the same source-file extensions the detector itself
          # covers, so documentation/config prose mentioning marker syntax
          # (this PR, being the one introducing the feature, has plenty)
          # can't inflate this into a false mismatch below.
          # Case-insensitive, like the trusted tracker's fileExtension()
          # (which lowercases before matching): a suppression added to
          # e.g. main.GO or component.TSX must not be silently skipped by
          # this scope filter while the trusted tracker still finds it.
          # Mirrors TRACKED_FILE_STATUSES in the trusted JS tracker, which
          # excludes "removed": a deleted file can never contain an added
          # suppression line, so scanning it (and enforcing patch
          # completeness for it) has no tracking benefit and would fail a
          # PR closed merely for deleting a large source file whose patch
          # GitHub omits.
          source_file_test='(.filename | test("^\\.githooks/|\\.(go|sh|bash|zsh|ksh|py|rb|php|js|jsx|cjs|mjs|ts|tsx|java|kt|kts|swift|rs|c|cc|cpp|cxx|h|hpp|hh|cs|ya?ml)$"; "i")) and .status != "removed"'
          # GitHub's pull-files endpoint returns at most 3000 files; a PR
          # with more changed files than that can never have all of them
          # retrieved, so a suppression added beyond the first 3000 would
          # be invisible to this scan while the trusted tracker (which
          # enforces the same MAX_CHANGED_FILES limit) correctly refuses to
          # publish anything for an oversized diff. Fail closed above the
          # same boundary instead of silently under-scanning.
          changed_files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files')"
          if [ "${changed_files:-0}" -gt 3000 ]; then
            echo "::error::This pull request changes ${changed_files} files, exceeding the 3000-file trusted diff limit; the independent suppression scan cannot retrieve all of them via GitHub's pull-files API. Refusing to trust an under-scanned diff." >&2
            exit 1
          fi
          # `gh api --paginate` requests every page but concatenates their
          # raw JSON bodies back to back -- e.g. two 100-item pages become
          # the two-document stream "[...][...]", not one combined array.
          # `jq 'length'` (and every `.[]`/`.[...]` filter below) would then
          # silently apply to each page separately instead of the whole
          # pull request, breaking the file-count comparison and any
          # per-file SHA lookup for a suppression on a later page. `jq -s
          # 'add'` slurps the whole multi-document stream into one array of
          # arrays and concatenates them into a single flat array.
          pr_files_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate | jq -s 'add')"
          pr_files_count="$(echo "${pr_files_json}" | jq 'length')"
          if [ "${pr_files_count:-0}" -ne "${changed_files:-0}" ]; then
