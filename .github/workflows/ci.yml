name: ci

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

jobs:
  extension-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      vscode_extension: ${{ steps.filter.outputs.vscode_extension }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect VS Code extension changes
        id: filter
        uses: dorny/paths-filter@61f87a10cd2c304679af17bb73ef192addf33c1c
        with:
          filters: |
            vscode_extension:
              - 'extensions/vscode-lopper/**'

  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pr_report_artifact_id: ${{ steps.upload_pr_report_inputs.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        if: ${{ !env.ACT }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Setup Go (act)
        if: ${{ env.ACT }}
        run: |
          if ! command -v go >/dev/null 2>&1; then
            apt-get update
            apt-get install -y golang-go
          fi
          if ! command -v shellcheck >/dev/null 2>&1; then
            apt-get update
            apt-get install -y shellcheck
          fi
          go version

      - name: Install shellcheck
        if: ${{ !env.ACT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Resolve gosec version
        id: gosec_version
        run: echo "value=$(make --silent print-gosec-version)" >> "$GITHUB_OUTPUT"

      - name: Install Go tooling
        env:
          GOSEC_VERSION: ${{ steps.gosec_version.outputs.value }}
        run: |
          make tools-install
          if [ -z "${ACT:-}" ]; then
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi

      - name: Resolve PR base ref
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_ref="${PR_BASE_REF:-main}"
          printf 'BASE_SHA=%s\n' "${PR_BASE_SHA}" >> "$GITHUB_ENV"
          printf 'BASE_REF=%s\n' "${base_ref}" >> "$GITHUB_ENV"

      - name: Write PR body for regression proof
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const bodyPath = path.join(process.env.RUNNER_TEMP, 'pr-regression-body.md');
            fs.writeFileSync(bodyPath, context.payload.pull_request?.body || '', 'utf8');
            core.exportVariable('PR_BODY_FILE', bodyPath);

      - name: Fetch PR base
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          base_ref="${BASE_REF:-main}"
          base_sha="${BASE_SHA:-}"
          if [ -z "${base_sha}" ]; then
            echo "::error::PR base SHA is unavailable; cannot prepare memory benchmark base." >&2
            exit 1
          fi
          git fetch --no-tags origin "${base_sha}"
          git fetch --no-tags origin "${base_ref}"
          if ! git rev-parse --verify -q --end-of-options "${base_sha}^{commit}" >/dev/null; then
            echo "::error::PR base SHA '${base_sha}' is missing after fetch; cannot prepare memory benchmark base." >&2
            exit 1
          fi
          if ! git merge-base -- "${base_sha}" HEAD >/dev/null; then
            echo "::error::PR base SHA '${base_sha}' is not related to HEAD; memory benchmark gate cannot run safely." >&2
            exit 1
          fi
          printf 'MEMORY_BENCH_BASE=%s\n' "${base_sha}" >> "$GITHUB_ENV"

      - name: Run CI target
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          SUPPRESSION_TRACKING_OUTPUT: .artifacts/inline-suppressions.json
        run: |
          if [ "${GH_EVENT_NAME}" = "pull_request" ]; then
            export MEMORY_BENCH_BASE="${MEMORY_BENCH_BASE:?prepared PR memory benchmark base is required}"
            export MEMORY_BENCH_ENFORCE=0
          fi
          if [ -n "${ACT:-}" ]; then
            PATH="$(go env GOPATH)/bin:$PATH" make ci
          else
            make ci
          fi

      - name: Prove regression tests for fix PRs
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_REGRESSION_EXEMPT_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'regression-exempt') }}
        run: |
          go run ./tools/regressionproof --repo . --body-file "$PR_BODY_FILE" --title "$PR_TITLE" --base-sha "$PR_BASE_SHA" --regression-exempt-label "$PR_REGRESSION_EXEMPT_LABEL"

      - name: Fail on unapproved memory regression
        if: ${{ github.event_name == 'pull_request' && !env.ACT && always() && !contains(github.event.pull_request.labels.*.name, 'memory-approved') }}
        run: |
          if [ ! -f .artifacts/memory-bench-status.txt ]; then
            exit 0
          fi
          status="$(tr -d '[:space:]' < .artifacts/memory-bench-status.txt)"
          if [ "$status" = "1" ]; then
            echo "Memory benchmark regression detected. Add the memory-approved label to acknowledge and merge it."
            exit 1
          fi

      - name: Verify demo assets are up to date
        run: make demos-check

      - name: Run lopper self-analysis (base branch)
        id: lopper_base
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          base_ref="${BASE_REF:-main}"
          mkdir -p .artifacts
          git worktree add --detach .artifacts/base "origin/${base_ref}"
          bin/lopper analyse --top 10 --repo .artifacts/base --language all --format json > .artifacts/lopper-base.json
          git worktree remove --force .artifacts/base

      - name: Run lopper delta summary (PR)
        id: lopper_delta
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          mkdir -p .artifacts
          bin/lopper analyse --top 10 --repo . --language all --baseline .artifacts/lopper-base.json --format pr-comment > .artifacts/lopper-pr-comment.md

      - name: Run coverage gate
        id: cov
        continue-on-error: true
        env:
          COVERAGE_MIN: 98
          COVERAGE_PACKAGE_MIN: 98
        run: |
          set +e
          if [ -n "${ACT:-}" ]; then
            PATH="$(go env GOPATH)/bin:$PATH" make cov COVERAGE_MIN="${COVERAGE_MIN}" COVERAGE_PACKAGE_MIN="${COVERAGE_PACKAGE_MIN}"
          else
            make cov COVERAGE_MIN="${COVERAGE_MIN}" COVERAGE_PACKAGE_MIN="${COVERAGE_PACKAGE_MIN}"
          fi
          status=$?
          mkdir -p .artifacts
          printf '%s\n' "$status" > .artifacts/coverage-status.txt
          if [ -f .artifacts/coverage-total.txt ]; then
            total="$(cat .artifacts/coverage-total.txt)"
          else
            total=""
          fi
          echo "package_failures<<EOF" >> "$GITHUB_OUTPUT"
          if [ -f .artifacts/coverage-package-failures.txt ]; then
            cat .artifacts/coverage-package-failures.txt >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Stage PR report inputs
        if: ${{ github.event_name == 'pull_request' && always() }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u PROMPT_COMMAND -u PS4 -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          PATH: /usr/bin:/bin
          LOPPER_BASE_OUTCOME: ${{ steps.lopper_base.outcome }}
          LOPPER_DELTA_OUTCOME: ${{ steps.lopper_delta.outcome }}
        run: |
          write_bounded_output() {
            local dest="$1"
            local limit_bytes="$2"
            local value="$3"
            printf '%s\n' "${value}" > "${dest}"
            if [ "$(stat --format=%s "${dest}")" -gt "${limit_bytes}" ]; then
              echo "PR report input exceeds the ${limit_bytes}-byte staging limit: $(basename "${dest}")" >&2
              exit 1
            fi
          }

          copy_bounded_report() {
            local src="$1"
            local dest="$2"
            local limit_bytes="$3"
            if [ "$(stat --format=%s "${src}")" -gt "${limit_bytes}" ]; then
              echo "PR report input exceeds the ${limit_bytes}-byte staging limit: $(basename "${src}")" >&2
              exit 1
            fi
            cp -- "${src}" "${dest}"
          }

          report_root="${RUNNER_TEMP}/pr-report-inputs"
          rm -rf -- "${report_root}"
          mkdir -p -- "${report_root}"

          write_bounded_output "${report_root}/lopper-base-outcome.txt" 64 "${LOPPER_BASE_OUTCOME}"
          write_bounded_output "${report_root}/lopper-delta-outcome.txt" 64 "${LOPPER_DELTA_OUTCOME}"

          for report in \
            coverage-package-failures.txt \
            coverage-status.txt \
            coverage-total.txt \
            inline-suppressions.json \
            lopper-pr-comment.md \
            memory-bench-status.txt \
            memory-bench-summary.md
          do
            src=".artifacts/${report}"
            if [ -f "${src}" ] && [ ! -L "${src}" ]; then
              limit_bytes=1048576
              case "${report}" in
                coverage-package-failures.txt)
                  limit_bytes=131072
                  ;;
                inline-suppressions.json)
                  limit_bytes=131072
                  ;;
                coverage-status.txt|coverage-total.txt|memory-bench-status.txt)
                  limit_bytes=64
                  ;;
              esac
              copy_bounded_report "${src}" "${report_root}/${report}" "${limit_bytes}"
            fi
          done

      - name: Upload PR report inputs
        id: upload_pr_report_inputs
        if: ${{ github.event_name == 'pull_request' && always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-report-inputs
          path: ${{ runner.temp }}/pr-report-inputs
          if-no-files-found: error

      - name: Upload binary artifact
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lopper-bin
          path: bin/lopper
          if-no-files-found: ignore

      - name: Mock artifact upload (act)
        if: ${{ always() && env.ACT }}
        run: |
          test -f bin/lopper
          ls -lh bin/lopper

      - name: Fail workflow on coverage gate
        if: ${{ steps.cov.outcome == 'failure' }}
        run: exit 1

  publish-pr-reports:
    needs: verify
    if: ${{ always() && github.event_name == 'pull_request' && needs.verify.outputs.pr_report_artifact_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download PR report inputs
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.verify.outputs.pr_report_artifact_id }}
          github-token: ${{ github.token }}
          path: pr-report-inputs
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Validate PR report inputs
        if: ${{ !env.ACT }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u PROMPT_COMMAND -u PS4 -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          PATH: /usr/bin:/bin
          REPORT_ROOT: pr-report-inputs
        run: |
          if [ ! -d "${REPORT_ROOT}" ]; then
            echo "PR report inputs are missing." >&2
            exit 1
          fi
          if find -P "${REPORT_ROOT}" -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "PR report inputs must contain only regular files." >&2
            exit 1
          fi

          allowed_files=(
            coverage-package-failures.txt
            coverage-status.txt
            coverage-total.txt
            inline-suppressions.json
            lopper-base-outcome.txt
            lopper-delta-outcome.txt
            lopper-pr-comment.md
            memory-bench-status.txt
            memory-bench-summary.md
          )
          required_files=(
            lopper-base-outcome.txt
            lopper-delta-outcome.txt
          )

          for required in "${required_files[@]}"; do
            path="${REPORT_ROOT}/${required}"
            if [ ! -f "${path}" ] || [ -L "${path}" ]; then
              echo "Missing required PR report input: ${required}" >&2
              exit 1
            fi
          done

          while IFS= read -r -d '' path; do
            name="$(basename "${path}")"
            case " ${allowed_files[*]} " in
              *" ${name} "*) ;;
              *)
                echo "Unexpected PR report input: ${name}" >&2
                exit 1
                ;;
            esac
            if [ "$(stat --format=%s "${path}")" -gt 1048576 ]; then
              echo "PR report input exceeds the 1 MiB publication limit: ${name}" >&2
              exit 1
            fi
            case "${name}" in
              coverage-package-failures.txt|inline-suppressions.json)
                if [ "$(stat --format=%s "${path}")" -gt 131072 ]; then
                  echo "PR report input exceeds the 128 KiB publication limit: ${name}" >&2
                  exit 1
                fi
                ;;
              coverage-status.txt|coverage-total.txt|memory-bench-status.txt)
                if [ "$(stat --format=%s "${path}")" -gt 64 ]; then
                  echo "PR report input exceeds the 64-byte publication limit: ${name}" >&2
                  exit 1
                fi
                ;;
            esac
          done < <(find -P "${REPORT_ROOT}" -mindepth 1 -maxdepth 1 -type f -print0)

      - name: Track inline suppressions
        if: ${{ !env.ACT }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');

            const reportPath = 'pr-report-inputs/inline-suppressions.json';
            let uploadedCount = 0;
            if (fs.existsSync(reportPath)) {
              const raw = fs.readFileSync(reportPath, 'utf8');
              if (Buffer.byteLength(raw, 'utf8') > 131072) {
                throw new Error('Inline suppression records exceed the 128 KiB publication limit.');
              }

              const payload = JSON.parse(raw);
              if (payload?.schema !== 'lopper-inline-suppressions-v1' || !Array.isArray(payload.suppressions)) {
                throw new Error('Inline suppression records use an unsupported schema.');
              }
              if (payload.suppressions.length > 100) {
                throw new Error('Inline suppression records exceed the 100-record publication limit.');
              }
              uploadedCount = payload.suppressions.length;
            }

            const markerPattern = /(^|\s)((\/\/|\/\*+|#)\s*(@?(no(sec|sonar|lint|qa)|eslint-disable(-next-line|-line)?|ts-(ignore|expect-error)|pragma:\s*no\s+cover|coverage:\s*ignore)))([^A-Za-z0-9_-]|$)/iu;
            const sourceFilePattern = /^(?:\.githooks\/|.*\.(?:go|sh|bash|zsh|ksh|py|rb|php|js|jsx|cjs|mjs|ts|tsx|java|kt|kts|swift|rs|c|cc|cpp|cxx|h|hpp|hh|cs|ya?ml))$/u;
            const trim = (value) => value.trim();
            const metadataValue = (content, keyPattern) => {
              const match = new RegExp(`(^|[\\s;,])(${keyPattern})\\s*[:=]\\s*([^;]+)`, 'iu').exec(content);
              return match ? trim(match[3]) : '';
            };
            const fingerprintFor = (file, content) => crypto.createHash('sha256').update(`${file}\n${content}`).digest('hex');
            const validateString = (value, label, maxBytes) => {
              if (typeof value !== 'string' || value.length === 0 || Buffer.byteLength(value, 'utf8') > maxBytes || /[\u0000-\u0008\u000a-\u001f\u007f]/u.test(value)) {
                throw new Error(`Invalid inline suppression ${label}.`);
              }
              return value;
            };
            const escapeFence = (value) => value.replaceAll('```', '``\u200b`');
            const addSuppression = (records, file, line, content, headSha) => {
              validateString(file, 'file', 512);
              if (file.startsWith('/') || file.split('/').includes('..')) {
                throw new Error('Invalid inline suppression file path.');
              }
              if (!Number.isInteger(line) || line < 1 || line > 1000000) {
                throw new Error('Invalid inline suppression line.');
              }
              validateString(content, 'content', 4096);
              const rationale = validateString(metadataValue(content, 'rationale|reason'), 'rationale', 1024);
              const owner = validateString(metadataValue(content, 'owner'), 'owner', 256);
              const remove_when = validateString(metadataValue(content, 'remove-when|removal-condition|removal'), 'remove_when', 1024);
              const fingerprint = fingerprintFor(file, content);
              const normalized = {
                fingerprint,
                file,
                line,
                source: `${process.env.GITHUB_SERVER_URL || 'https://github.com'}/${context.repo.owner}/${context.repo.repo}/blob/${headSha}/${file}#L${line}`,
                content,
                rationale,
                owner,
                remove_when,
              };
              if (!records.has(fingerprint)) {
                records.set(fingerprint, normalized);
              }
            };
            const scanPatch = (records, file, patch, headSha) => {
              let line = 0;
              for (const rawLine of patch.split('\n')) {
                if (rawLine.startsWith('@@ ')) {
                  const hunk = /^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(rawLine);
                  if (!hunk) {
                    throw new Error(`Unable to parse inline suppression diff hunk for ${file}.`);
                  }
                  line = Number.parseInt(hunk[1], 10);
                  continue;
                }
                if (rawLine.startsWith('+++')) {
                  continue;
                }
                if (rawLine.startsWith('+')) {
                  const content = rawLine.slice(1);
                  if (markerPattern.test(content)) {
                    addSuppression(records, file, line, content, headSha);
                  }
                  line += 1;
                  continue;
                }
                if (!rawLine.startsWith('-') && !rawLine.startsWith('\\')) {
                  line += 1;
                }
              }
            };
            const loadChangedFileCount = async (pull) => {
              if (Number.isInteger(pull.changed_files)) {
                return pull.changed_files;
              }
              const response = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
              });
              if (!Number.isInteger(response.data.changed_files)) {
                throw new Error('Pull request changed file count is unavailable; refusing to publish tracking mutations.');
              }
              return response.data.changed_files;
            };
            const recomputeSuppressionRecords = async () => {
              const pull = context.payload.pull_request;
              if (!pull?.number || !pull?.base?.sha || !pull?.head?.sha) {
                throw new Error('Pull request base and head SHAs are required to recompute inline suppression records.');
              }
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pull.number,
                per_page: 100,
              });
              const changedFileCount = await loadChangedFileCount(pull);
              if (files.length !== changedFileCount) {
                throw new Error(`Trusted inline suppression recomputation saw ${files.length} changed files but GitHub reports ${changedFileCount}; refusing to publish tracking mutations.`);
              }
              const records = new Map();
              for (const file of files) {
                if (!['added', 'modified'].includes(file.status) || !sourceFilePattern.test(file.filename)) {
                  continue;
                }
                if (typeof file.patch !== 'string') {
                  throw new Error(`Inline suppression diff patch is unavailable for ${file.filename}; refusing to publish tracking mutations.`);
                }
                scanPatch(records, file.filename, file.patch, pull.head.sha);
              }
              return records;
            };

            const records = await recomputeSuppressionRecords();
            if (records.size > 100) {
              throw new Error('Inline suppression records exceed the 100-record publication limit.');
            }
            if (uploadedCount !== records.size) {
              core.warning(`Uploaded inline suppression count ${uploadedCount} differs from trusted recomputation count ${records.size}; using recomputed records.`);
            }
            if (records.size === 0) {
              core.info('No inline suppression records were produced.');
              return;
            }
            const pull = context.payload.pull_request;
            const isForkPullRequest = Boolean(
              pull?.head?.repo?.fork === true ||
              (pull?.head?.repo?.full_name && pull?.base?.repo?.full_name && pull.head.repo.full_name !== pull.base.repo.full_name),
            );
            if (isForkPullRequest) {
              core.warning('Inline suppression tracking mutation skipped for fork pull request; metadata was validated without mutating issues.');
              return;
            }

            for (const record of records.values()) {
              const marker = `lopper-inline-suppression:${record.fingerprint}`;
              const title = `ci: track inline suppression in ${record.file}:${record.line}`;
              const body = [
                `<!-- ${marker} -->`,
                '',
                '## Inline analysis suppression tracking',
                '',
                `- Location: \`${record.file}:${record.line}\``,
                `- Source: ${record.source}`,
                `- Rationale: ${record.rationale}`,
                `- Owner: ${record.owner}`,
                `- Removal condition: ${record.remove_when}`,
                '',
                'Source line:',
                '',
                '```text',
                escapeFence(record.content),
                '```',
              ].join('\n');

              const results = await github.rest.search.issuesAndPullRequests({
                q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open ${marker}`,
                per_page: 2,
              });
              const existing = results.data.items.find((item) => !item.pull_request);
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  title,
                  body,
                });
                core.info(`Updated inline suppression tracking issue #${existing.number} for ${record.file}:${record.line}.`);
              } else {
                const created = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
                core.info(`Opened inline suppression tracking issue #${created.data.number} for ${record.file}:${record.line}.`);
              }
            }

      - name: Comment memory benchmark report on PR
        if: ${{ !env.ACT }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('node:fs');

            const marker = '<!-- lopper-memory-bench -->';
            const reportRoot = 'pr-report-inputs';
            const summaryPath = `${reportRoot}/memory-bench-summary.md`;
            const statusPath = `${reportRoot}/memory-bench-status.txt`;
            const labels = context.payload.pull_request?.labels || [];
            const approved = labels.some((label) => label?.name === 'memory-approved');
            const status = fs.existsSync(statusPath) ? fs.readFileSync(statusPath, 'utf8').trim() : '';
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8').trim()
              : '## Memory Benchmarks\n\n❌ Memory benchmark summary was not produced.';

            const footer =
              status === '1'
                ? approved
                  ? 'Approval: `memory-approved` label present. The regression is acknowledged for this PR.'
                  : 'Approval required: add the `memory-approved` label to merge an intentional memory regression.'
                : status === '0'
                  ? 'Approval: not required.'
                  : 'Approval: unavailable because the memory benchmark gate did not complete cleanly.';

            const body = [marker, summary, '', footer].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Comment lopper report on PR
        if: ${{ !env.ACT }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('node:fs');

            const marker = '<!-- lopper-pr-report -->';
            const reportRoot = 'pr-report-inputs';
            const deltaCommentPath = `${reportRoot}/lopper-pr-comment.md`;
            const baseOutcomePath = `${reportRoot}/lopper-base-outcome.txt`;
            const deltaOutcomePath = `${reportRoot}/lopper-delta-outcome.txt`;
            const baseOutcome = fs.existsSync(baseOutcomePath) ? fs.readFileSync(baseOutcomePath, 'utf8').trim() : '';
            const deltaOutcome = fs.existsSync(deltaOutcomePath) ? fs.readFileSync(deltaOutcomePath, 'utf8').trim() : '';

            const failureBody = [
              marker,
              '## Lopper (Delta)',
              '',
              '❌ Lopper delta analysis failed in CI.',
              '',
              'Re-run the workflow, or run local head/base analyses and compare outputs.',
            ].join('\n');

            const body =
              baseOutcome !== 'success' ||
              deltaOutcome !== 'success' ||
              !fs.existsSync(deltaCommentPath)
                ? failureBody
                : `${marker}\n${fs.readFileSync(deltaCommentPath, 'utf8').trim()}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.filter(
              (comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker),
            );

            if (existing.length > 0) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing[0].id,
                body,
              });
              for (const duplicate of existing.slice(1)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: duplicate.id,
                });
              }
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Comment on coverage failure
        if: ${{ !env.ACT }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          COVERAGE_MIN: 98
          COVERAGE_PACKAGE_MIN: 98
        with:
          script: |
            const fs = require('node:fs');

            const reportRoot = 'pr-report-inputs';
            const statusPath = `${reportRoot}/coverage-status.txt`;
            const totalPath = `${reportRoot}/coverage-total.txt`;
            const packageFailuresPath = `${reportRoot}/coverage-package-failures.txt`;

            if (!fs.existsSync(statusPath) || fs.readFileSync(statusPath, 'utf8').trim() === '0') {
              core.info('Coverage gate passed or did not emit a status; skipping PR coverage comment.');
              return;
            }

            const marker = '<!-- lopper-coverage-failure -->';
            const total = fs.existsSync(totalPath) ? fs.readFileSync(totalPath, 'utf8').trim() : 'unavailable';
            const packageFailures = fs.existsSync(packageFailuresPath)
              ? fs.readFileSync(packageFailuresPath, 'utf8').trim()
              : '';
            const packageFailureSection = packageFailures
              ? `Packages below minimum:\n${packageFailures}\n\n`
              : '';
            const body = `${marker}
            ❌ Coverage gate failed.

            Required total: >= ${process.env.COVERAGE_MIN}%
            Actual total: ${total === 'unavailable' ? total : `${total}%`}

            Required per-package: >= ${process.env.COVERAGE_PACKAGE_MIN}%

            ${packageFailureSection}Run \`make cov\` locally for details.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  verify-rolling:
    name: verify (rolling)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        if: ${{ !env.ACT }}
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Go (act)
        if: ${{ env.ACT }}
        run: |
          if ! command -v go >/dev/null 2>&1; then
            apt-get update
            apt-get install -y golang-go
          fi
          if ! command -v shellcheck >/dev/null 2>&1; then
            apt-get update
            apt-get install -y shellcheck
          fi
          go version

      - name: Install shellcheck
        if: ${{ !env.ACT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install Go tooling
        run: |
          make tools-install
          if [ -z "${ACT:-}" ]; then
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi

      - name: Fetch PR base
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_ref="${PR_BASE_REF:-main}"
          base_sha="${PR_BASE_SHA:-}"
          if [ -z "${base_sha}" ]; then
            echo "::error::PR base SHA is unavailable; cannot prepare rolling memory benchmark base." >&2
            exit 1
          fi
          git fetch --no-tags origin "${base_sha}"
          git fetch --no-tags --depth=1 origin "${base_ref}"
          if ! git rev-parse --verify -q --end-of-options "${base_sha}^{commit}" >/dev/null; then
            echo "::error::PR base SHA '${base_sha}' is missing after fetch; cannot prepare rolling memory benchmark base." >&2
            exit 1
          fi
          if ! git merge-base -- "${base_sha}" HEAD >/dev/null; then
            echo "::error::PR base SHA '${base_sha}' is not related to HEAD; rolling memory benchmark gate cannot run safely." >&2
            exit 1
          fi
          printf 'MEMORY_BENCH_BASE=%s\n' "${base_sha}" >> "$GITHUB_ENV"

      - name: Run CI target with rolling defaults
        env:
          BUILD_CHANNEL: rolling
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${GH_EVENT_NAME}" = "pull_request" ]; then
            export MEMORY_BENCH_BASE="${MEMORY_BENCH_BASE:?prepared rolling PR memory benchmark base is required}"
            export MEMORY_BENCH_ENFORCE=0
          fi
          if [ -n "${ACT:-}" ]; then
            PATH="$(go env GOPATH)/bin:$PATH" make ci BUILD_CHANNEL="${BUILD_CHANNEL}"
          else
            make ci BUILD_CHANNEL="${BUILD_CHANNEL}"
          fi

  os-smoke:
    name: os-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - &ci_smoke_checkout
        name: Checkout
        uses: actions/checkout@v7

      - &ci_smoke_setup_go
        name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run smoke checks
        run: make smoke

  vscode-smoke:
    name: vscode-smoke (${{ matrix.os }})
    needs: extension-changes
    if: ${{ needs.extension-changes.outputs.vscode_extension == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    permissions:
      contents: read
    steps:
      - *ci_smoke_checkout

      - *ci_smoke_setup_go

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/vscode-lopper/package-lock.json

      - name: Build local lopper binary
        run: make build

      - name: Install extension dependencies
        run: make vscode-extension-install

      - name: Verify VS Code extension package contract
        run: go test ./scripts -run '^(TestVSCodeExtensionIconPackageContract|TestVSCodeExtensionPackagingHonorsBraceGlobIgnore)$' -count=1

      - name: Run VS Code smoke tests
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a make vscode-extension-test
          else
            make vscode-extension-test
          fi

  homebrew-tap-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Detect tap repository
        id: tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh repo view ben-ranford/homebrew-tap >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Homebrew
        if: ${{ steps.tap.outputs.exists == 'true' }}
        uses: Homebrew/actions/setup-homebrew@fc695c54c2032716dd4cedd007489c8e32fc8a5d

      - name: Checkout tap formula
        if: ${{ steps.tap.outputs.exists == 'true' }}
        uses: actions/checkout@v7
        with:
          repository: ben-ranford/homebrew-tap
          path: homebrew-tap

      - name: Run Homebrew audit and test
        if: ${{ steps.tap.outputs.exists == 'true' }}
        run: |
          set -euo pipefail
          brew untap ben-ranford/tap >/dev/null 2>&1 || true
          brew tap --custom-remote ben-ranford/tap "file://${PWD}/homebrew-tap"
          brew trust ben-ranford/tap
          brew audit --strict --online ben-ranford/tap/lopper
          export HOMEBREW_NO_SANDBOX_LINUX=1
          brew install --build-from-source ben-ranford/tap/lopper
          brew test ben-ranford/tap/lopper

      - name: Skip when tap is not created yet
        if: ${{ steps.tap.outputs.exists != 'true' }}
        run: echo "homebrew-tap repository not found; skipping Homebrew tap verification."
