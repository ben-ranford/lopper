name: ci

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      pr_report_artifact_id: ${{ steps.upload_pr_report_inputs.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        if: ${{ !env.ACT }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Setup Go (act)
        if: ${{ env.ACT }}
        run: |
          if ! command -v go >/dev/null 2>&1; then
            apt-get update
            apt-get install -y golang-go
          fi
          if ! command -v shellcheck >/dev/null 2>&1; then
            apt-get update
            apt-get install -y shellcheck
          fi
          if ! command -v ruby >/dev/null 2>&1; then
            apt-get update
            apt-get install -y ruby
          fi
          if ! command -v node >/dev/null 2>&1 || [ "$(node -e 'console.log(process.versions.node.split(".")[0])' 2>/dev/null || echo 0)" -lt 20 ]; then
            apt-get update
            apt-get install -y ca-certificates curl gnupg
            mkdir -p /usr/share/keyrings
            curl -fsSL --proto '=https' --tlsv1.2 https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
            echo "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
            apt-get update
            apt-get install -y nodejs
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update
            apt-get install -y python3
          fi
          go version

      - name: Install shellcheck
        if: ${{ !env.ACT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Resolve gosec version
        id: gosec_version
        run: echo "value=$(make --silent print-gosec-version)" >> "$GITHUB_OUTPUT"

      - name: Install Go tooling
        env:
          GOSEC_VERSION: ${{ steps.gosec_version.outputs.value }}
        run: |
          make tools-install
          if [ -z "${ACT:-}" ]; then
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi

      - name: Resolve PR base ref
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_ref="${PR_BASE_REF:-main}"
          printf 'BASE_SHA=%s\n' "${PR_BASE_SHA}" >> "$GITHUB_ENV"
          printf 'BASE_REF=%s\n' "${base_ref}" >> "$GITHUB_ENV"

      - name: Write PR body for regression proof
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const bodyPath = path.join(process.env.RUNNER_TEMP, 'pr-regression-body.md');
            fs.writeFileSync(bodyPath, context.payload.pull_request?.body || '', 'utf8');
            core.exportVariable('PR_BODY_FILE', bodyPath);

      - name: Fetch PR base
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          resolve_act_merge_base() {
            local requested_ref="$1"
            local candidate_ref=""
            if git rev-parse --verify -q --end-of-options "refs/remotes/origin/${requested_ref}^{commit}" >/dev/null; then
              candidate_ref="refs/remotes/origin/${requested_ref}"
            elif git rev-parse --verify -q --end-of-options "refs/heads/${requested_ref}^{commit}" >/dev/null; then
              candidate_ref="refs/heads/${requested_ref}"
            else
              if git fetch --no-tags origin "${requested_ref}" >/dev/null 2>&1; then
                if git rev-parse --verify -q --end-of-options "refs/remotes/origin/${requested_ref}^{commit}" >/dev/null; then
                  candidate_ref="refs/remotes/origin/${requested_ref}"
                fi
              fi
            fi
            if [ -z "${candidate_ref}" ]; then
              echo "::error::ACT pull_request event payload omitted PR base SHA and base ref '${requested_ref}' is unavailable; cannot resolve immutable merge base." >&2
              return 1
            fi
            if ! git merge-base -- "${candidate_ref}" HEAD; then
              echo "::error::ACT pull_request event payload omitted PR base SHA and base ref '${requested_ref}' is unrelated to HEAD; cannot resolve immutable merge base." >&2
              return 1
            fi
          }
          base_ref="${BASE_REF:-main}"
          base_sha="${BASE_SHA:-}"
          if [ -z "${base_sha}" ]; then
            if [ -n "${ACT:-}" ]; then
              if ! base_sha="$(resolve_act_merge_base "${base_ref}")"; then
                exit 1
              fi
              echo "ACT pull_request event payload omitted PR base SHA; resolved immutable merge base ${base_sha} from ${base_ref}."
            else
              echo "::error::PR base SHA is unavailable; cannot prepare memory benchmark base." >&2
              exit 1
            fi
          fi
          if [ -z "${ACT:-}" ]; then
            git fetch --no-tags origin "${base_sha}"
            git fetch --no-tags origin "${base_ref}"
          fi
          if ! git rev-parse --verify -q --end-of-options "${base_sha}^{commit}" >/dev/null; then
            echo "::error::PR base SHA '${base_sha}' is missing; cannot prepare memory benchmark base." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${base_sha}" HEAD; then
            echo "::error::PR base SHA '${base_sha}' is not an ancestor of HEAD; memory benchmark gate cannot run safely." >&2
            exit 1
          fi
          printf 'MEMORY_BENCH_BASE=%s\n' "${base_sha}" >> "$GITHUB_ENV"

      - name: Run CI target
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          SUPPRESSION_TRACKING_OUTPUT: .artifacts/inline-suppressions.json
        run: |
          if [ "${GH_EVENT_NAME}" = "pull_request" ]; then
            export MEMORY_BENCH_BASE="${MEMORY_BENCH_BASE:?prepared PR memory benchmark base is required}"
            export MEMORY_BENCH_ENFORCE=0
          fi
          if [ -n "${ACT:-}" ]; then
            PATH="$(go env GOPATH)/bin:$PATH" make ci
          else
            make ci
          fi

      - name: Verify inline suppression tracking issues were published
        if: ${{ github.event_name == 'pull_request' && !env.ACT }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUPPRESSIONS_FILE: .artifacts/inline-suppressions.json
        run: |
          # This job runs on `pull_request` (head-associated, so it can be a
          # required check), but new suppressions are only ever mutated via
          # `issues:write` from the separate `pull_request_target` tracking
          # workflow (forked PRs get a read-only GITHUB_TOKEN here). That
          # workflow's own check is not attached to this head SHA and so
          # cannot itself gate the merge; this step closes that gap with a
          # read-only wait/verify that a trusted tracking issue was actually
          # published for every suppression this PR adds, on this head.
          # The suppression detector and Makefile that produce
          # SUPPRESSIONS_FILE are themselves PR-controlled checked-out code,
          # so a PR could neuter them to silently omit this artifact while
          # still adding an untracked suppression, making the checks below
          # trivially pass. Before trusting an empty/missing artifact,
          # independently confirm via GitHub's own diff data (which the PR
          # cannot alter) that no suppression-marker-shaped line was added.
          # Built from pieces, like check-inline-suppressions.sh, so this
          # gate does not match its own source.
          no_prefix="no"
          ts_prefix="ts"
          eslint_prefix="eslint"
          coverage_prefix="coverage"
          marker_names="(@?(${no_prefix}(sec|sonar|lint|qa)|${eslint_prefix}-disable(-next-line|-line)?|${ts_prefix}-(ignore|expect-error)|pragma:[[:space:]]*${no_prefix}[[:space:]]+cover|${coverage_prefix}:[[:space:]]*ignore))"
          # A comment delimiter needs no preceding whitespace in any of the
          # covered languages -- a marker immediately following code with
          # no space in between is still a valid suppression -- so
          # requiring it would miss such lines entirely. Excluding ":"
          # keeps a URL scheme (http://nolint...) from matching; everything
          # else is a valid preceding position. Whether the delimiter falls
          # inside a string literal is handled separately, by masking
          # quoted regions before this pattern is applied (mirroring the
          # trusted tracker's isInsideQuotedRegion) -- checking only the
          # single preceding character misses a marker preceded by
          # ordinary text inside an otherwise-open string.
          #
          # Python/Ruby/YAML/shell only ever treat "#" as a comment
          # delimiter, so "//" in e.g. Python's `value = numerator // noqa`
          # is floor division, not a comment; matching it there would
          # reject valid code for missing suppression metadata it was never
          # meant to carry. Mirrors HASH_ONLY_EXTENSIONS/
          # SLASH_STYLE_EXTENSIONS in the trusted JS tracker; PHP and any
          # other extension not covered by either set keep recognizing
          # every prefix, since PHP alone among the covered languages
          # supports both styles.
          suspect_pattern_hash="(^|[^:])(#[[:space:]]*${marker_names})([^[:alnum:]_-]|$)"
          suspect_pattern_slash="(^|[^:])((//|/[*]+)[[:space:]]*${marker_names})([^[:alnum:]_-]|$)"
          suspect_pattern_all="(^|[^:])((//|/[*]+|#)[[:space:]]*${marker_names})([^[:alnum:]_-]|$)"
          # Same extension classification as HASH_ONLY_EXTENSIONS/
          # SLASH_STYLE_EXTENSIONS in the trusted JS tracker.
          hash_only_file_pattern='\.(bash|ksh|py|rb|sh|ya?ml|zsh)$'
          slash_style_file_pattern='\.(c|cc|cjs|cpp|cs|cxx|go|h|hh|hpp|java|js|jsx|kt|kts|mjs|rs|swift|ts|tsx)$'
          # Scope to the same source-file extensions the detector itself
          # covers, so documentation/config prose mentioning marker syntax
          # (this PR, being the one introducing the feature, has plenty)
          # can't inflate this into a false mismatch below.
          # Case-insensitive, like the trusted tracker's fileExtension()
          # (which lowercases before matching): a suppression added to
          # e.g. main.GO or component.TSX must not be silently skipped by
          # this scope filter while the trusted tracker still finds it.
          source_file_test='.filename | test("^\\.githooks/|\\.(go|sh|bash|zsh|ksh|py|rb|php|js|jsx|cjs|mjs|ts|tsx|java|kt|kts|swift|rs|c|cc|cpp|cxx|h|hpp|hh|cs|ya?ml)$"; "i")'
          # GitHub's pull-files endpoint returns at most 3000 files; a PR
          # with more changed files than that can never have all of them
          # retrieved, so a suppression added beyond the first 3000 would
          # be invisible to this scan while the trusted tracker (which
          # enforces the same MAX_CHANGED_FILES limit) correctly refuses to
          # publish anything for an oversized diff. Fail closed above the
          # same boundary instead of silently under-scanning.
          changed_files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files')"
          if [ "${changed_files:-0}" -gt 3000 ]; then
            echo "::error::This pull request changes ${changed_files} files, exceeding the 3000-file trusted diff limit; the independent suppression scan cannot retrieve all of them via GitHub's pull-files API. Refusing to trust an under-scanned diff." >&2
            exit 1
          fi
          pr_files_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate)"
          pr_files_count="$(echo "${pr_files_json}" | jq 'length')"
          if [ "${pr_files_count:-0}" -ne "${changed_files:-0}" ]; then
            echo "::error::GitHub's pull-files API returned ${pr_files_count} file(s) but this pull request reports ${changed_files} changed file(s); refusing to trust an incomplete diff." >&2
            exit 1
          fi

          # GitHub omits `patch` entirely for files it considers too large
          # or whose diff it truncates. Treating that as "no suspect lines"
          # would let a PR pair an oversized source file with a tampered
          # detector/Makefile to make both counts read zero and merge an
          # untracked suppression; fail closed instead of guessing. A pure
          # rename (no content change) is also patchless but genuinely
          # empty of suspect lines -- the trusted tracker explicitly
          # exempts this exact shape (status "renamed", zero
          # additions/deletions) rather than treating it as incomplete, so
          # mirror that exemption here instead of failing every rename.
          incomplete_count="$(echo "${pr_files_json}" | jq "[.[] | select(${source_file_test}) | select(.patch == null) | select(.status != \"renamed\" or .additions != 0 or .deletions != 0)] | length")"
          if [ "${incomplete_count:-0}" -gt 0 ]; then
            echo "::error::GitHub's pull-files API omitted the patch for ${incomplete_count} source file(s) in this pull request (typically because the file or diff is too large); the independent suppression scan cannot make a safe determination for those files. Refusing to trust an under-scanned diff." >&2
            exit 1
          fi

          # Extract (file, added-line-content) pairs for every suspect line,
          # not just a count: comparing cardinalities alone lets a PR swap a
          # tracked suppression for an untracked one of the same shape (add
          # one, remove one) while the counts stay equal. Matching by exact
          # content -- the same "Source line" text the trusted tracker
          # records -- ties the independent scan to what was actually added.
          suspect_pairs_file="$(mktemp)"
          echo "${pr_files_json}" | jq -c ".[] | select(${source_file_test})" | while IFS= read -r file_json; do
            filename="$(echo "${file_json}" | jq -r '.filename')"
            lower_filename="$(echo "${filename}" | tr '[:upper:]' '[:lower:]')"
            if [[ "${lower_filename}" =~ ${hash_only_file_pattern} ]]; then
              active_suspect_pattern="${suspect_pattern_hash}"
            elif [[ "${lower_filename}" =~ ${slash_style_file_pattern} ]]; then
              active_suspect_pattern="${suspect_pattern_slash}"
            else
              active_suspect_pattern="${suspect_pattern_all}"
            fi
            # GitHub's default 3-line patch context can hide a multi-line
            # construct (e.g. an open template literal) that begins further
            # above a hunk than that window reaches; seeding every hunk's
            # quote state as "no open quote" could mask a real suppression
            # comment after it, or the reverse. Fetch the complete blob at
            # this file's own pull-files SHA (no path-encoding needed, and
            # no Contents API inline-size limit) so the scan below can
            # derive each hunk's starting quote state from it instead.
            file_sha="$(echo "${file_json}" | jq -r '.sha')"
            content_tmp="$(mktemp)"
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${file_sha}" --jq '.content' | base64 -d >"${content_tmp}"
            echo "${file_json}" | jq -r '.patch // empty' | awk -v pat="${active_suspect_pattern}" -v fname="${filename}" '
              FNR == NR {
                full_line_count = FNR
                full_lines[FNR] = $0
                next
              }
              function mask_quoted_regions(s, initial_quote,    result, i, c, quote, n, narrow_single_quote, past_comment_start) {
                result = ""
                quote = initial_quote
                n = length(s)
                past_comment_start = 0
                # Rust and C/C++ have no multi-character single-quoted
                # strings: a leading apostrophe is either a self-contained
                # char literal, a Rust lifetime, or a C++14 digit separator
                # grouping the digits of a large number -- none of which
                # close the way a real string does. Treating every
                # apostrophe as a string delimiter would let one of these
                # swallow the rest of the line, hiding a real suppression
                # comment after it.
                narrow_single_quote = (tolower(fname) ~ /\.(rs|c|cc|cpp|cxx|h|hh|hpp)$/)
                for (i = 1; i <= n; i++) {
                  c = substr(s, i, 1)
                  if (quote != "") {
                    if (c == "\\" && i < n) {
                      result = result "xx"
                      i++
                      continue
                    }
                    if (c == quote) {
                      result = result c
                      quote = ""
                    } else {
                      result = result "x"
                    }
                    continue
                  }
                  if (c == "'"'"'" && narrow_single_quote) {
                    if (substr(s, i + 1, 1) == "\\" && substr(s, i + 3, 1) == "'"'"'") {
                      result = result c "xx" "'"'"'"
                      i += 3
                    } else if (substr(s, i + 1, 1) != "'"'"'" && substr(s, i + 2, 1) == "'"'"'") {
                      result = result c "x" "'"'"'"
                      i += 2
                    } else {
                      result = result c
                    }
                    continue
                  }
                  if ((c == "/" && substr(s, i + 1, 1) == "/") || c == "#") {
                    # A genuine line-comment delimiter outside any quoted
                    # region does not itself change how the rest of the
                    # line is masked (a well-formed quoted span later in
                    # the same comment, e.g. a backtick-quoted example,
                    # still needs its interior masked so example marker
                    # text is not mistaken for a real one); it only marks
                    # that a quote left dangling at end of line from here
                    # on is comment prose, not an unterminated string, and
                    # must not carry into the next line.
                    if (i == 1 || substr(s, i - 1, 1) != ":") {
                      past_comment_start = 1
                    }
                  }
                  if (c == "\"" || c == "'"'"'" || c == "`") {
                    quote = c
                    result = result c
                    continue
                  }
                  result = result c
                }
                final_quote_state = (past_comment_start ? "" : quote)
                return result
              }
              # The quote state to seed a hunk beginning at 1-indexed
              # `line`: derived from the complete blob content read above,
              # not just the 3-line context window the patch itself carries.
              function seed_quote_state(   idx, prior_count, seed) {
                seed = ""
                prior_count = line - 1
                if (full_line_count + 0 < prior_count) {
                  prior_count = full_line_count + 0
                }
                for (idx = 1; idx <= prior_count; idx++) {
                  mask_quoted_regions(full_lines[idx], seed)
                  seed = final_quote_state
                }
                return seed
              }
              /^\+\+\+ / { next }
              /^@@ / {
                hunk = $0
                sub(/^@@ -[0-9]+(,[0-9]+)? \+/, "", hunk)
                sub(/ .*/, "", hunk)
                split(hunk, parts, ",")
                line = parts[1] + 0
                # Unlike a zero-context diff, this patch carries real
                # unchanged context lines around each hunk, but not far
                # enough back to reveal a construct opened many lines
                # above; derive the starting state from the complete blob
                # instead of guessing "no open quote".
                quote_state = seed_quote_state()
                next
              }
              /^\+/ {
                content = substr($0, 2)
                # Quote state carries across lines within a hunk: a
                # multi-line string (e.g. a JavaScript template literal)
                # that closes partway through a later line must not make
                # that later scan think the closing delimiter opens a new
                # quoted region, which would mask a real suppression
                # comment following it on the same line.
                masked = mask_quoted_regions(content, quote_state)
                quote_state = final_quote_state
                if (tolower(masked) ~ pat) {
                  printf "%s\001%s\n", fname, content
                }
                line++
                next
              }
              /^-/ { next }
              /^\\/ { next }
              {
                # Context line: part of the resulting file, so its
                # quote-affecting characters must still be tracked even
                # though it is not itself scanned for a suspect marker.
                content = substr($0, 2)
                mask_quoted_regions(content, quote_state)
                quote_state = final_quote_state
                line++
              }
            ' "${content_tmp}" -
            rm -f "${content_tmp}"
          done > "${suspect_pairs_file}"
          suspect_count="$(wc -l < "${suspect_pairs_file}" | tr -d ' ')"

          # A PR could also leave the detector partially working -- e.g. it
          # already has one published suppression, adds a second, and tweaks
          # the detector to keep emitting only the first -- so the artifact
          # is nonempty but under-reports.
          recorded_count=0
          recorded_pairs_file="$(mktemp)"
          if [ -s "${SUPPRESSIONS_FILE}" ]; then
            mapfile -t fingerprints < <(jq -r '.suppressions[].fingerprint' "${SUPPRESSIONS_FILE}")
            # Every record is a distinct occurrence and must therefore have
            # its own distinct, occurrence-specific fingerprint. A tampered
            # detector could otherwise report two records with identical
            # (file, content) -- passing the exact-pair multiset comparison,
            # which preserves multiplicity -- while reusing the first
            # occurrence's already-tracked fingerprint for both; that single
            # still-open issue would then satisfy the polling loop even
            # though the second occurrence's issue was never published.
            # Deduplicating with `sort -u` before counting would silently
            # accept this by collapsing the reused fingerprint to one
            # instead of rejecting the artifact for containing it twice.
            if [ "${#fingerprints[@]}" -gt 0 ]; then
              # `printf '%s\n'` with no array elements still runs its format
              # once, printing a single empty line -- counting that as one
              # unique fingerprint would wrongly flag a genuinely empty
              # array as a duplicate, so this comparison only runs once
              # there is at least one fingerprint to check.
              unique_fingerprint_count="$(printf '%s\n' "${fingerprints[@]}" | sort -u | wc -l | tr -d ' ')"
              if [ "${unique_fingerprint_count}" -ne "${#fingerprints[@]}" ]; then
                echo "::error::This pull request's tracking output contains the same fingerprint for more than one record; each occurrence must have its own distinct fingerprint. Refusing to trust a tampered artifact." >&2
                exit 1
              fi
            fi
            recorded_count="${#fingerprints[@]}"
            # SUPPRESSIONS_FILE is PR-controlled; a fingerprint is later
            # interpolated into a `gh issue list --jq` expression below. An
            # unvalidated value containing jq syntax could be crafted to
            # make an empty search result look like a match, defeating the
            # whole verification. Fingerprints are always sha256 hex
            # digests, so require exactly that shape before trusting any of
            # them.
            for fingerprint in "${fingerprints[@]}"; do
              if [[ ! "${fingerprint}" =~ ^[0-9a-f]{64}$ ]]; then
                echo "::error::This pull request's tracking output contains a fingerprint that is not a 64-character hex digest; refusing to trust a malformed or tampered artifact." >&2
                exit 1
              fi
            done
            # The trusted tracker never publishes more than MAX_RECORDS (100)
            # entries per pull request, so a larger recorded_count is
            # necessarily a tampered artifact. Reject it before the polling
            # loop below issues one gh issue list request per fingerprint --
            # otherwise a PR-controlled detector could emit thousands of
            # distinct valid-looking fingerprints and exhaust the repository
            # token's API quota or the job's timeout.
            if [ "${recorded_count}" -gt 100 ]; then
              echo "::error::This pull request's tracking output records ${recorded_count} suppressions, exceeding the trusted tracker's 100-record publication limit; refusing to trust a malformed or tampered artifact." >&2
              exit 1
            fi
            # jq's @tsv formatter escapes tab/newline/backslash/CR within a
            # field (e.g. a literal backslash becomes the two characters
            # "\\"), but the suspect side below reads the same content
            # un-escaped straight from the diff; comparing an escaped
            # recorded pair against its un-escaped suspect pair would never
            # match, rejecting an otherwise valid PR. Emit the delimiter and
            # fields as raw bytes instead so no escaping is introduced.
            jq -j '.suppressions[] | .file, "\u0001", .content, "\n"' "${SUPPRESSIONS_FILE}" > "${recorded_pairs_file}"

            # The exact-pair comparison above validates (file, content), and
            # the polling loop below validates that a fingerprint has an
            # open trusted issue -- but neither ties a record's own
            # fingerprint to its own (file, content). PR-controlled code can
            # therefore pair suppression B's real file/content with
            # suppression A's still-open fingerprint: the pair check accepts
            # B (its content is genuinely recorded) and the polling loop
            # accepts A's issue, while B itself was never published. A
            # fingerprint is sha256(file "\n" content ["\noccurrence:" N]),
            # a deterministic function of only those inputs, so recomputing
            # it and requiring a match rejects any fingerprint that does not
            # actually belong to its record's file and content.
            #
            # MAX_RECORDS (100) bounds how many NEW records a pull request
            # can introduce, not the occurrence ordinal among lines already
            # present in the complete file -- a file with over 100
            # pre-existing identical suppression lines legitimately produces
            # occurrence 101 or higher for one more added line, so the
            # search range must extend well past 100. Doing that search
            # in-process (instead of one shasum subprocess per candidate)
            # keeps it fast: ~100,000 sha256 digests take well under a
            # second in Python.
            # python3 -c requires top-level statements at column 0, but a
            # YAML block scalar's own dedenting (removing the indentation of
            # its first line from every line) leaves an unpredictable
            # residual indentation here, not a fixed number of spaces --
            # it depends on this whole step's other, differently-nested
            # bash lines. Bootstrap through a second, single-line python3
            # invocation using textwrap.dedent, which removes exactly
            # whatever common leading whitespace is actually left, rather
            # than guessing a specific amount to strip.
            fingerprint_binding_script='
            import hashlib
            import sys

            MAX_OCCURRENCE = 100000

            data = sys.stdin.buffer.read()
            for record in data.split(b"\n"):
                if not record:
                    continue
                parts = record.split(b"\x01")
                if len(parts) != 3:
                    print("::error::This pull request tracking output contains a malformed record; refusing to trust a tampered artifact.", file=sys.stderr)
                    sys.exit(1)
                file, content, fingerprint = parts
                base = file + b"\n" + content
                bound = hashlib.sha256(base).hexdigest().encode() == fingerprint
                if not bound:
                    for occurrence in range(2, MAX_OCCURRENCE + 1):
                        candidate = hashlib.sha256(base + ("\noccurrence:%d" % occurrence).encode()).hexdigest().encode()
                        if candidate == fingerprint:
                            bound = True
                            break
                if not bound:
                    print("::error::This pull request tracking output contains a fingerprint that does not match its own recorded file and content for any occurrence up to " + str(MAX_OCCURRENCE) + "; refusing to trust a tampered artifact.", file=sys.stderr)
                    sys.exit(1)
            '
            fingerprint_binding_dedented="$(printf '%s' "${fingerprint_binding_script}" | python3 -c 'import sys, textwrap; sys.stdout.write(textwrap.dedent(sys.stdin.read()))')"
            jq -j '.suppressions[] | .file, "\u0001", .content, "\u0001", .fingerprint, "\n"' "${SUPPRESSIONS_FILE}" | python3 -c "${fingerprint_binding_dedented}"
          fi

          # comm requires sorted input but -- given sorted, duplicate-
          # preserving input -- still computes a correct *multiset*
          # difference: plain `sort` (not `sort -u`) is required here.
          # Deduplicating first would let a PR add the same suspect line
          # twice while a tampered detector reports only one occurrence's
          # (correctly fingerprinted) record; the duplicate suspect and its
          # single matching recorded pair would collapse to one of each and
          # compare as fully satisfied, hiding the untracked second
          # occurrence.
          missing_suspects="$(comm -23 <(sort "${suspect_pairs_file}") <(sort "${recorded_pairs_file}") | wc -l | tr -d ' ')"
          if [ "${missing_suspects:-0}" -gt 0 ]; then
            echo "::error::GitHub's own diff for this pull request independently found ${suspect_count} suspect line(s), ${missing_suspects} of which are not present in this pull request's tracking output (matched by file and exact line content). This can happen if the suppression detector or Makefile target was modified to under-report, or if a tracked suppression was silently swapped for an untracked one; refusing to trust the artifact." >&2
            exit 1
          fi

          if [ "${recorded_count}" -eq 0 ]; then
            echo "No inline suppressions were recorded in this pull request, and GitHub's diff independently confirms no suppression markers were added; nothing to verify."
            exit 0
          fi

          # Poll every still-missing fingerprint together under one shared
          # deadline (40 rounds x 15s = 10 minutes total), not an
          # independent wait per fingerprint -- otherwise a persistently
          # failed tracker run could make this step sleep for up to
          # MAX_RECORDS x 10 minutes instead of reporting promptly.
          missing=("${fingerprints[@]}")
          for _ in $(seq 1 40); do
            if [ "${#missing[@]}" -eq 0 ]; then
              break
            fi
            still_missing=()
            for fingerprint in "${missing[@]}"; do
              # A substring `contains` check accepts the marker text
              # anywhere in the body, including inside the echoed "Source
              # line" of an attacker-controlled suppression comment; require
              # it in the canonical first-two-lines header position instead,
              # matching the trusted controller's own issueBodyIncludesMarker.
              found="$(gh issue list --state open \
                --search "lopper-inline-suppression:${fingerprint} lopper-inline-suppression-pr:${PR_NUMBER} author:github-actions[bot]" \
                --json number,author,body \
                --jq "[.[] | select(.author.login == \"github-actions[bot]\" and ((.body // \"\") | test(\"^<!-- lopper-inline-suppression:${fingerprint} -->\\n<!-- lopper-inline-suppression-pr:${PR_NUMBER} -->\")))][0].number")"
              if [ -z "${found}" ]; then
                still_missing+=("${fingerprint}")
              fi
            done
            missing=("${still_missing[@]}")
            if [ "${#missing[@]}" -eq 0 ]; then
              break
            fi
            sleep 15
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::No trusted inline suppression tracking issue was found for fingerprint(s): ${missing[*]}. The 'inline suppression tracking' workflow must publish a tracking issue for every new suppression before this required check can pass; re-run it or check its logs if this persists." >&2
            exit 1
          fi
          echo "Verified a trusted tracking issue exists for every inline suppression in this pull request."

      - name: Prove regression tests for fix PRs
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'renovate[bot]' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_REGRESSION_EXEMPT_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'regression-exempt') }}
        run: |
          go run ./tools/regressionproof --repo . --body-file "$PR_BODY_FILE" --title "$PR_TITLE" --base-sha "$PR_BASE_SHA" --regression-exempt-label "$PR_REGRESSION_EXEMPT_LABEL"

      - name: Fail on unapproved memory regression
        if: ${{ github.event_name == 'pull_request' && !env.ACT && always() && !contains(github.event.pull_request.labels.*.name, 'memory-approved') }}
        run: |
          if [ ! -f .artifacts/memory-bench-status.txt ]; then
            exit 0
          fi
          status="$(tr -d '[:space:]' < .artifacts/memory-bench-status.txt)"
          if [ "$status" = "1" ]; then
            echo "Memory benchmark regression detected. Add the memory-approved label to acknowledge and merge it."
            exit 1
          fi

      - name: Verify demo assets are up to date
        run: make demos-check

      - name: Run lopper self-analysis (base branch)
        id: lopper_base
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          base_sha="${MEMORY_BENCH_BASE:?prepared PR memory benchmark base is required}"
          mkdir -p .artifacts
          git worktree add --detach .artifacts/base "${base_sha}"
          bin/lopper analyse --top 10 --repo .artifacts/base --language all --format json > .artifacts/lopper-base.json
          git worktree remove --force .artifacts/base

      - name: Run lopper delta summary (PR)
        id: lopper_delta
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          mkdir -p .artifacts
          bin/lopper analyse --top 10 --repo . --language all --baseline .artifacts/lopper-base.json --format pr-comment > .artifacts/lopper-pr-comment.md

      - name: Run coverage gate
        id: cov
        continue-on-error: true
        env:
          COVERAGE_MIN: 98
          COVERAGE_PACKAGE_MIN: 98
        run: |
          set +e
          if [ -n "${ACT:-}" ]; then
            PATH="$(go env GOPATH)/bin:$PATH" make cov COVERAGE_MIN="${COVERAGE_MIN}" COVERAGE_PACKAGE_MIN="${COVERAGE_PACKAGE_MIN}"
          else
            make cov COVERAGE_MIN="${COVERAGE_MIN}" COVERAGE_PACKAGE_MIN="${COVERAGE_PACKAGE_MIN}"
          fi
          status=$?
          mkdir -p .artifacts
          printf '%s\n' "$status" > .artifacts/coverage-status.txt
          if [ -f .artifacts/coverage-total.txt ]; then
            total="$(cat .artifacts/coverage-total.txt)"
          else
            total=""
          fi
          echo "package_failures<<EOF" >> "$GITHUB_OUTPUT"
          if [ -f .artifacts/coverage-package-failures.txt ]; then
            cat .artifacts/coverage-package-failures.txt >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Stage PR report inputs
        if: ${{ github.event_name == 'pull_request' && always() }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u PROMPT_COMMAND -u PS4 -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          PATH: /usr/bin:/bin
          LOPPER_BASE_OUTCOME: ${{ steps.lopper_base.outcome }}
          LOPPER_DELTA_OUTCOME: ${{ steps.lopper_delta.outcome }}
        run: |
          write_bounded_output() {
            local dest="$1"
            local limit_bytes="$2"
            local value="$3"
            printf '%s\n' "${value}" > "${dest}"
            if [ "$(stat --format=%s "${dest}")" -gt "${limit_bytes}" ]; then
              echo "PR report input exceeds the ${limit_bytes}-byte staging limit: $(basename "${dest}")" >&2
              exit 1
            fi
          }

          copy_bounded_report() {
            local src="$1"
            local dest="$2"
            local limit_bytes="$3"
            if [ "$(stat --format=%s "${src}")" -gt "${limit_bytes}" ]; then
              echo "PR report input exceeds the ${limit_bytes}-byte staging limit: $(basename "${src}")" >&2
              exit 1
            fi
            cp -- "${src}" "${dest}"
          }

          report_root="${RUNNER_TEMP}/pr-report-inputs"
          rm -rf -- "${report_root}"
          mkdir -p -- "${report_root}"

          write_bounded_output "${report_root}/lopper-base-outcome.txt" 64 "${LOPPER_BASE_OUTCOME}"
          write_bounded_output "${report_root}/lopper-delta-outcome.txt" 64 "${LOPPER_DELTA_OUTCOME}"

          for report in \
            coverage-package-failures.txt \
            coverage-status.txt \
            coverage-total.txt \
            inline-suppressions.json \
            lopper-pr-comment.md \
            memory-bench-status.txt \
            memory-bench-summary.md
          do
            src=".artifacts/${report}"
            if [ -f "${src}" ] && [ ! -L "${src}" ]; then
              limit_bytes=1048576
              case "${report}" in
                coverage-package-failures.txt)
                  limit_bytes=131072
                  ;;
                inline-suppressions.json)
                  limit_bytes=131072
                  ;;
                coverage-status.txt|coverage-total.txt|memory-bench-status.txt)
                  limit_bytes=64
                  ;;
              esac
              copy_bounded_report "${src}" "${report_root}/${report}" "${limit_bytes}"
            fi
          done

      - name: Upload PR report inputs
        id: upload_pr_report_inputs
        if: ${{ github.event_name == 'pull_request' && always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-report-inputs
          path: ${{ runner.temp }}/pr-report-inputs
          if-no-files-found: error

      - name: Upload binary artifact
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lopper-bin
          path: bin/lopper
          if-no-files-found: ignore

      - name: Mock artifact upload (act)
        if: ${{ always() && env.ACT }}
        run: |
          test -f bin/lopper
          ls -lh bin/lopper

      - name: Fail workflow on coverage gate
        if: ${{ steps.cov.outcome == 'failure' }}
        run: exit 1

  publish-pr-reports:
    needs: verify
    if: ${{ always() && github.event_name == 'pull_request' && needs.verify.outputs.pr_report_artifact_id != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download PR report inputs
        if: ${{ !env.ACT }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.verify.outputs.pr_report_artifact_id }}
          github-token: ${{ github.token }}
          path: pr-report-inputs
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Validate PR report inputs
        if: ${{ !env.ACT }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u PROMPT_COMMAND -u PS4 -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          PATH: /usr/bin:/bin
          REPORT_ROOT: pr-report-inputs
        run: |
          if [ ! -d "${REPORT_ROOT}" ]; then
            echo "PR report inputs are missing." >&2
            exit 1
          fi
          if find -P "${REPORT_ROOT}" -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "PR report inputs must contain only regular files." >&2
            exit 1
          fi

          allowed_files=(
            coverage-package-failures.txt
            coverage-status.txt
            coverage-total.txt
            inline-suppressions.json
            lopper-base-outcome.txt
            lopper-delta-outcome.txt
            lopper-pr-comment.md
            memory-bench-status.txt
            memory-bench-summary.md
          )
          required_files=(
            lopper-base-outcome.txt
            lopper-delta-outcome.txt
          )

          for required in "${required_files[@]}"; do
            path="${REPORT_ROOT}/${required}"
            if [ ! -f "${path}" ] || [ -L "${path}" ]; then
              echo "Missing required PR report input: ${required}" >&2
              exit 1
            fi
          done

          while IFS= read -r -d '' path; do
            name="$(basename "${path}")"
            case " ${allowed_files[*]} " in
              *" ${name} "*) ;;
              *)
                echo "Unexpected PR report input: ${name}" >&2
                exit 1
                ;;
            esac
            if [ "$(stat --format=%s "${path}")" -gt 1048576 ]; then
              echo "PR report input exceeds the 1 MiB publication limit: ${name}" >&2
              exit 1
            fi
            case "${name}" in
              coverage-package-failures.txt|inline-suppressions.json)
                if [ "$(stat --format=%s "${path}")" -gt 131072 ]; then
                  echo "PR report input exceeds the 128 KiB publication limit: ${name}" >&2
                  exit 1
                fi
                ;;
              coverage-status.txt|coverage-total.txt|memory-bench-status.txt)
                if [ "$(stat --format=%s "${path}")" -gt 64 ]; then
                  echo "PR report input exceeds the 64-byte publication limit: ${name}" >&2
                  exit 1
                fi
                ;;
            esac
          done < <(find -P "${REPORT_ROOT}" -mindepth 1 -maxdepth 1 -type f -print0)

      - name: Comment memory benchmark report on PR
        if: ${{ !env.ACT }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('node:fs');

            const marker = '<!-- lopper-memory-bench -->';
            const reportRoot = 'pr-report-inputs';
            const summaryPath = `${reportRoot}/memory-bench-summary.md`;
            const statusPath = `${reportRoot}/memory-bench-status.txt`;
            const labels = context.payload.pull_request?.labels || [];
            const approved = labels.some((label) => label?.name === 'memory-approved');
            const status = fs.existsSync(statusPath) ? fs.readFileSync(statusPath, 'utf8').trim() : '';
            const summary = fs.existsSync(summaryPath)
              ? fs.readFileSync(summaryPath, 'utf8').trim()
              : '## Memory Benchmarks\n\n❌ Memory benchmark summary was not produced.';

            const footer =
              status === '1'
                ? approved
                  ? 'Approval: `memory-approved` label present. The regression is acknowledged for this PR.'
                  : 'Approval required: add the `memory-approved` label to merge an intentional memory regression.'
                : status === '0'
                  ? 'Approval: not required.'
                  : 'Approval: unavailable because the memory benchmark gate did not complete cleanly.';

            const body = [marker, summary, '', footer].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Comment lopper report on PR
        if: ${{ !env.ACT }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const fs = require('node:fs');

            const marker = '<!-- lopper-pr-report -->';
            const reportRoot = 'pr-report-inputs';
            const deltaCommentPath = `${reportRoot}/lopper-pr-comment.md`;
            const baseOutcomePath = `${reportRoot}/lopper-base-outcome.txt`;
            const deltaOutcomePath = `${reportRoot}/lopper-delta-outcome.txt`;
            const baseOutcome = fs.existsSync(baseOutcomePath) ? fs.readFileSync(baseOutcomePath, 'utf8').trim() : '';
            const deltaOutcome = fs.existsSync(deltaOutcomePath) ? fs.readFileSync(deltaOutcomePath, 'utf8').trim() : '';

            const failureBody = [
              marker,
              '## Lopper (Delta)',
              '',
              '❌ Lopper delta analysis failed in CI.',
              '',
              'Re-run the workflow, or run local head/base analyses and compare outputs.',
            ].join('\n');

            const body =
              baseOutcome !== 'success' ||
              deltaOutcome !== 'success' ||
              !fs.existsSync(deltaCommentPath)
                ? failureBody
                : `${marker}\n${fs.readFileSync(deltaCommentPath, 'utf8').trim()}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.filter(
              (comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker),
            );

            if (existing.length > 0) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing[0].id,
                body,
              });
              for (const duplicate of existing.slice(1)) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: duplicate.id,
                });
              }
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Comment on coverage failure
        if: ${{ !env.ACT }}
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          COVERAGE_MIN: 98
          COVERAGE_PACKAGE_MIN: 98
        with:
          script: |
            const fs = require('node:fs');

            const reportRoot = 'pr-report-inputs';
            const statusPath = `${reportRoot}/coverage-status.txt`;
            const totalPath = `${reportRoot}/coverage-total.txt`;
            const packageFailuresPath = `${reportRoot}/coverage-package-failures.txt`;

            if (!fs.existsSync(statusPath) || fs.readFileSync(statusPath, 'utf8').trim() === '0') {
              core.info('Coverage gate passed or did not emit a status; skipping PR coverage comment.');
              return;
            }

            const marker = '<!-- lopper-coverage-failure -->';
            const total = fs.existsSync(totalPath) ? fs.readFileSync(totalPath, 'utf8').trim() : 'unavailable';
            const packageFailures = fs.existsSync(packageFailuresPath)
              ? fs.readFileSync(packageFailuresPath, 'utf8').trim()
              : '';
            const packageFailureSection = packageFailures
              ? `Packages below minimum:\n${packageFailures}\n\n`
              : '';
            const body = `${marker}
            ❌ Coverage gate failed.

            Required total: >= ${process.env.COVERAGE_MIN}%
            Actual total: ${total === 'unavailable' ? total : `${total}%`}

            Required per-package: >= ${process.env.COVERAGE_PACKAGE_MIN}%

            ${packageFailureSection}Run \`make cov\` locally for details.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                typeof comment.body === 'string' &&
                comment.body.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  verify-rolling:
    name: verify (rolling)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Go
        if: ${{ !env.ACT }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Setup Go (act)
        if: ${{ env.ACT }}
        run: |
          if ! command -v go >/dev/null 2>&1; then
            apt-get update
            apt-get install -y golang-go
          fi
          if ! command -v shellcheck >/dev/null 2>&1; then
            apt-get update
            apt-get install -y shellcheck
          fi
          if ! command -v ruby >/dev/null 2>&1; then
            apt-get update
            apt-get install -y ruby
          fi
          if ! command -v node >/dev/null 2>&1 || [ "$(node -e 'console.log(process.versions.node.split(".")[0])' 2>/dev/null || echo 0)" -lt 20 ]; then
            apt-get update
            apt-get install -y ca-certificates curl gnupg
            mkdir -p /usr/share/keyrings
            curl -fsSL --proto '=https' --tlsv1.2 https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /usr/share/keyrings/nodesource.gpg
            echo "deb [signed-by=/usr/share/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
            apt-get update
            apt-get install -y nodejs
          fi
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update
            apt-get install -y python3
          fi
          go version

      - name: Install shellcheck
        if: ${{ !env.ACT }}
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install Go tooling
        run: |
          make tools-install
          if [ -z "${ACT:-}" ]; then
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi

      - name: Resolve PR base ref
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_ref="${PR_BASE_REF:-main}"
          printf 'BASE_SHA=%s\n' "${PR_BASE_SHA}" >> "$GITHUB_ENV"
          printf 'BASE_REF=%s\n' "${base_ref}" >> "$GITHUB_ENV"

      - name: Fetch PR base
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          resolve_act_merge_base() {
            local requested_ref="$1"
            local candidate_ref=""
            if git rev-parse --verify -q --end-of-options "refs/remotes/origin/${requested_ref}^{commit}" >/dev/null; then
              candidate_ref="refs/remotes/origin/${requested_ref}"
            elif git rev-parse --verify -q --end-of-options "refs/heads/${requested_ref}^{commit}" >/dev/null; then
              candidate_ref="refs/heads/${requested_ref}"
            else
              if git fetch --no-tags origin "${requested_ref}" >/dev/null 2>&1; then
                if git rev-parse --verify -q --end-of-options "refs/remotes/origin/${requested_ref}^{commit}" >/dev/null; then
                  candidate_ref="refs/remotes/origin/${requested_ref}"
                fi
              fi
            fi
            if [ -z "${candidate_ref}" ]; then
              echo "::error::ACT pull_request event payload omitted PR base SHA and base ref '${requested_ref}' is unavailable; cannot resolve immutable merge base." >&2
              return 1
            fi
            if ! git merge-base -- "${candidate_ref}" HEAD; then
              echo "::error::ACT pull_request event payload omitted PR base SHA and base ref '${requested_ref}' is unrelated to HEAD; cannot resolve immutable merge base." >&2
              return 1
            fi
          }
          base_ref="${BASE_REF:-main}"
          base_sha="${BASE_SHA:-}"
          if [ -z "${base_sha}" ]; then
            if [ -n "${ACT:-}" ]; then
              if ! base_sha="$(resolve_act_merge_base "${base_ref}")"; then
                exit 1
              fi
              echo "ACT pull_request event payload omitted PR base SHA; resolved immutable merge base ${base_sha} from ${base_ref}."
            else
              echo "::error::PR base SHA is unavailable; cannot prepare memory benchmark base." >&2
              exit 1
            fi
          fi
          if [ -z "${ACT:-}" ]; then
            git fetch --no-tags origin "${base_sha}"
            git fetch --no-tags origin "${base_ref}"
          fi
          if ! git rev-parse --verify -q --end-of-options "${base_sha}^{commit}" >/dev/null; then
            echo "::error::PR base SHA '${base_sha}' is missing; cannot prepare memory benchmark base." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "${base_sha}" HEAD; then
            echo "::error::PR base SHA '${base_sha}' is not an ancestor of HEAD; memory benchmark gate cannot run safely." >&2
            exit 1
          fi
          printf 'MEMORY_BENCH_BASE=%s\n' "${base_sha}" >> "$GITHUB_ENV"

      - name: Run CI target with rolling defaults
        env:
          BUILD_CHANNEL: rolling
          GH_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${GH_EVENT_NAME}" = "pull_request" ]; then
            export MEMORY_BENCH_BASE="${MEMORY_BENCH_BASE:?prepared PR memory benchmark base is required}"
            export MEMORY_BENCH_ENFORCE=0
          fi
          if [ -n "${ACT:-}" ]; then
            PATH="$(go env GOPATH)/bin:$PATH" make ci BUILD_CHANNEL="${BUILD_CHANNEL}"
          else
            make ci BUILD_CHANNEL="${BUILD_CHANNEL}"
          fi

  os-smoke:
    name: os-smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - &ci_smoke_checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - &ci_smoke_setup_go
        name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Run smoke checks
        run: make smoke

  vscode-smoke:
    name: vscode-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
    permissions:
      contents: read
    steps:
      - *ci_smoke_checkout

      - *ci_smoke_setup_go

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extensions/vscode-lopper/package-lock.json

      - name: Build local lopper binary
        run: make build

      - name: Install extension dependencies
        run: make vscode-extension-install

      - name: Verify VS Code extension package contract
        run: go test ./scripts -run '^(TestVSCodeExtensionIconPackageContract|TestVSCodeExtensionPackagingHonorsBraceGlobIgnore)$' -count=1

      - name: Run VS Code smoke tests
        run: |
          if [ "${RUNNER_OS}" = "Linux" ]; then
            xvfb-run -a make vscode-extension-test
          else
            make vscode-extension-test
          fi

  homebrew-tap-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Detect tap repository
        id: tap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh repo view ben-ranford/homebrew-tap >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Homebrew
        if: ${{ steps.tap.outputs.exists == 'true' }}
        uses: Homebrew/actions/setup-homebrew@fc695c54c2032716dd4cedd007489c8e32fc8a5d

      - name: Checkout tap formula
        if: ${{ steps.tap.outputs.exists == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ben-ranford/homebrew-tap
          path: homebrew-tap

      - name: Run Homebrew audit and test
        if: ${{ steps.tap.outputs.exists == 'true' }}
        run: |
          set -euo pipefail
          brew untap ben-ranford/tap >/dev/null 2>&1 || true
          brew tap --custom-remote ben-ranford/tap "file://${PWD}/homebrew-tap"
          brew trust ben-ranford/tap
          brew audit --strict --online ben-ranford/tap/lopper
          export HOMEBREW_NO_SANDBOX_LINUX=1
          brew install --build-from-source ben-ranford/tap/lopper
          brew test ben-ranford/tap/lopper

      - name: Skip when tap is not created yet
        if: ${{ steps.tap.outputs.exists != 'true' }}
        run: echo "homebrew-tap repository not found; skipping Homebrew tap verification."
